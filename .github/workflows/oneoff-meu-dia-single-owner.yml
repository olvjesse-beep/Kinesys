name: One-off Meu Dia Single Owner

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/oneoff-meu-dia-single-owner.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Consolidar Meu dia em uma única fonte
        shell: python
        run: |
          from pathlib import Path
          import subprocess

          core_path = Path('src/core/script-1.18.0.js')
          core = core_path.read_text(encoding='utf-8')

          home_block_call = "        carregarPainelFisioterapeuta();\n"
          if home_block_call not in core:
              raise SystemExit('Chamada legada do Meu dia não encontrada no core')
          core = core.replace(home_block_call, '', 1)

          start_marker = 'async function carregarPainelFisioterapeuta(){'
          end_marker = 'async function renderizarPendenciasClinicas(){'
          start = core.find(start_marker)
          if start < 0:
              raise SystemExit('Implementação legada carregarPainelFisioterapeuta não encontrada')
          end = core.find(end_marker, start)
          if end < 0:
              raise SystemExit('Limite final da implementação legada não encontrado')
          core = core[:start] + core[end:]
          core_path.write_text(core, encoding='utf-8')

          index_path = Path('index.html')
          html = index_path.read_text(encoding='utf-8')

          old_core = 'src/core/script-1.18.0.js?v=20260910-hma-perf-r3&patient_self_service=20260910-r1&access_admin=20260910-r1&data_cache=20260911-r1&core_mod=20260911-phase4s-r1'
          new_core = 'src/core/script-1.18.0.js?v=20260915-meu-dia-single-owner-r7'
          old_home = 'src/home/home_fisioterapeuta_util-1.24.0.js?v=20260910-r3&fisio_home=20260910-r1&home4h=20260910-r1'
          new_home = 'src/home/home_fisioterapeuta_util-1.24.0.js?v=20260915-meu-dia-single-owner-r7'
          old_resume = 'src/core/operational_resume_refresh-1.0.0.js?v=20260912-home-mobile-r5'
          new_resume = 'src/core/operational_resume_refresh-1.0.0.js?v=20260915-agenda-only-r7'

          for old, new, label in [
              (old_core,new_core,'core'),
              (old_home,new_home,'home'),
              (old_resume,new_resume,'resume')
          ]:
              if old not in html:
                  raise SystemExit(f'Asset antigo não encontrado no index: {label}')
              html = html.replace(old, new, 1)
          index_path.write_text(html, encoding='utf-8')

          # Remove o hotfix visual de deduplicação. Com a fonte única corrigida,
          # o polish volta a cuidar apenas da composição visual da Home.
          clean_polish = subprocess.check_output([
              'git','show','d32d20c1560d8f7068f2fd1c04fc7707abc420a0:src/home/home_profissional_polish-1.0.0.js'
          ], text=True)
          Path('src/home/home_profissional_polish-1.0.0.js').write_text(clean_polish, encoding='utf-8')

          test = r'''\
'use strict';
const fs=require('fs');
const assert=require('assert');
const core=fs.readFileSync('src/core/script-1.18.0.js','utf8');
const home=fs.readFileSync('src/home/home_fisioterapeuta_util-1.24.0.js','utf8');
const resume=fs.readFileSync('src/core/operational_resume_refresh-1.0.0.js','utf8');
const polish=fs.readFileSync('src/home/home_profissional_polish-1.0.0.js','utf8');
const html=fs.readFileSync('index.html','utf8');

assert.doesNotMatch(core,/async function carregarPainelFisioterapeuta\s*\(/,
  'core não pode possuir uma segunda implementação do Meu dia');
const homeNav=(core.match(/if \(idTela === 'tela_home'\) \{[\s\S]*?\n    \}/)||[''])[0];
assert.doesNotMatch(homeNav,/carregarPainelFisioterapeuta\s*\(/,
  'navegação da Home não deve disparar um segundo carregador do Meu dia');
assert.match(home,/window\.carregarPainelFisioterapeuta=garantirPainelFisioterapeuta/,
  'home_fisioterapeuta_util deve ser o único dono público do Meu dia');
assert.match(home,/lista\.replaceChildren\(fragmento\)/,
  'renderização do Meu dia deve permanecer atômica');
assert.match(home,/id==='tela_agenda'[\s\S]*atualizarPainelFisioterapeuta\(\{motivo:'agenda'\}\)/,
  'entrada na Agenda deve atualizar a fotografia do Meu dia');
assert.doesNotMatch(resume,/revalidarMeuDiaClinico|normalizeMeuDia|observeMeuDia/,
  'resume refresh não pode voltar a ser segundo dono do Meu dia');
assert.doesNotMatch(polish,/removerDuplicatasMeuDia|chaveLinhaMeuDia|ksMeuDiaDeduplicado/,
  'polish visual não deve conter hotfix de deduplicação do Meu dia');
assert.match(html,/script-1\.18\.0\.js\?v=20260915-meu-dia-single-owner-r7/,
  'core corrigido precisa de URL nova em produção');
assert.match(html,/home_fisioterapeuta_util-1\.24\.0\.js\?v=20260915-meu-dia-single-owner-r7/,
  'Meu dia corrigido precisa de URL nova em produção');
assert.match(html,/operational_resume_refresh-1\.0\.0\.js\?v=20260915-agenda-only-r7/,
  'resume agenda-only precisa de URL nova em produção');
console.log('Meu dia single-owner contract: OK');
'''
          Path('tests/meu_dia_single_owner.contract.js').write_text(test, encoding='utf-8')

      - name: Validar JavaScript e contrato
        run: |
          node --check src/core/script-1.18.0.js
          node --check src/home/home_fisioterapeuta_util-1.24.0.js
          node --check src/home/home_profissional_polish-1.0.0.js
          node --check src/core/operational_resume_refresh-1.0.0.js
          node --check tests/meu_dia_single_owner.contract.js
          node tests/meu_dia_single_owner.contract.js
          git diff --check

      - name: Commitar correção estrutural
        run: |
          git config user.name 'kinesys-fix-bot'
          git config user.email 'kinesys-fix-bot@users.noreply.github.com'
          git add src/core/script-1.18.0.js src/home/home_profissional_polish-1.0.0.js index.html tests/meu_dia_single_owner.contract.js
          git commit -m 'fix(home): tornar Meu dia clínico fonte única no runtime'
          git push origin HEAD:main
