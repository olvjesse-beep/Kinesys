name: Modularization Phase 4L Patch Temp

on:
  push:
    branches: [performance/modularization-phase4l]
    paths:
      - 'tools/modularization_phase4l_patch.py'
      - '.github/workflows/modularization-phase4l-patch-temp.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: performance/modularization-phase4l
      - name: Extract patient records browse fallbacks
        run: python tools/modularization_phase4l_patch.py
      - name: Validate Phase 4L
        shell: bash
        run: |
          set -euo pipefail
          node --check patient_records_browse_core-1.0.0.js
          node --check script-1.18.0.js
          node --check tests/patient_records_browse_modularization.contract.js
          node --check tests/patient_pre_registration_modularization.contract.js
          node --check tests/patient_chart_read_modularization.contract.js
          node --check tests/document_timeline_modularization.contract.js
          node tests/patient_records_browse_modularization.contract.js
          node tests/patient_pre_registration_modularization.contract.js
          node tests/patient_chart_read_modularization.contract.js
          node tests/patient_index_cache_modularization.contract.js
          node tests/data_cache_integration.contract.js
          node tests/data_loading.contract.js
          node tests/operational_data_loading.contract.js
          node tests/document_timeline_modularization.contract.js
          node tests/screen_loader.contract.js
          git diff --check
          echo '=== STALE CACHE-BUST EXPECTATIONS ==='
          if grep -RIn 'core_mod=20260911-phase4k-r1' tests .github/workflows --exclude='modularization-phase4l-patch-temp.yml'; then
            echo 'Found stale Phase 4K core cache-bust expectation.' >&2
            exit 1
          fi
          echo '=== DEFINITIONS AFTER EXTRACTION ==='
          if grep -nE '^(async )?function (renderizarTabelaProntuarios|filtrarPacientesSalvos|renderizarPacientesRecentesHome)\(' script-1.18.0.js; then
            echo 'Browse definitions remained in the monolithic core.' >&2
            exit 1
          fi
          grep -n 'async function carregarPacienteParaEdicao' script-1.18.0.js
          grep -n 'async function excluirPaciente' script-1.18.0.js
          echo '=== SIZE AFTER EXTRACTION ==='
          wc -l -c script-1.18.0.js patient_records_browse_core-1.0.0.js
      - name: Commit extraction
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add script-1.18.0.js index.html
          git commit -m "Extract patient records browse fallbacks from monolithic core" || exit 0
          git push origin HEAD:performance/modularization-phase4l
