name: One-time Agenda visual refinement

on:
  push:
    paths:
      - '.github/workflows/refine-agenda-visual.yml'

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Flatten schedule configuration hierarchy
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          p = Path('design_agenda.css')
          text = p.read_text(encoding='utf-8')

          replacements = [
              (
                  'background:linear-gradient(135deg,#FBFDFC,#F1F8F6);',
                  'background:var(--kds-surface-soft);',
                  'clinic schedule header gradient'
              ),
              (
                  '#tela_agenda .ks-professional-schedule-card .ks-week-schedule-head{background:linear-gradient(135deg,#FBFCFD,#F4F7F8)}',
                  '#tela_agenda .ks-professional-schedule-card .ks-week-schedule-head{background:var(--kds-surface-soft)}',
                  'professional schedule header gradient'
              ),
              (
                  '''#tela_agenda .ks-schedule-level{\n  display:inline-flex;\n  padding:4px 7px;\n  border-radius:var(--kds-radius-pill);\n  background:var(--kds-accent-soft);\n  color:var(--kds-accent);\n  font-size:var(--kds-font-metadata);\n  font-weight:900;\n  letter-spacing:.7px;\n}''',
                  '''#tela_agenda .ks-schedule-level{\n  display:inline-flex;\n  padding:0;\n  border-radius:0;\n  background:transparent;\n  color:var(--kds-accent);\n  font-size:var(--kds-font-metadata);\n  font-weight:800;\n  letter-spacing:0;\n}''',
                  'schedule level badge treatment'
              ),
          ]

          for old, new, label in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 occurrence, found {count}')
              text = text.replace(old, new)

          p.write_text(text, encoding='utf-8')
          PY
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add design_agenda.css
          git diff --cached --exit-code >/dev/null && { echo 'No changes produced'; exit 1; } || true
          git commit -m "Refine Agenda schedule visual hierarchy"
          git push
