name: Modularization Phase 4K Patch Temp

on:
  push:
    branches: [performance/modularization-phase4k]
    paths:
      - 'tools/modularization_phase4k_patch.py'
      - '.github/workflows/modularization-phase4k-patch-temp.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: performance/modularization-phase4k
      - name: Extract pre-registration selector
        run: python tools/modularization_phase4k_patch.py
      - name: Validate Phase 4K
        shell: bash
        run: |
          set -euo pipefail
          node --check patient_pre_registration_core-1.0.0.js
          node --check script-1.18.0.js
          node --check tests/patient_pre_registration_modularization.contract.js
          node --check tests/patient_chart_read_modularization.contract.js
          node --check tests/document_timeline_modularization.contract.js
          node tests/patient_pre_registration_modularization.contract.js
          node tests/patient_chart_read_modularization.contract.js
          node tests/patient_index_cache_modularization.contract.js
          node tests/data_cache_integration.contract.js
          node tests/data_loading.contract.js
          node tests/operational_data_loading.contract.js
          node tests/document_timeline_modularization.contract.js
          node tests/screen_loader.contract.js
          git diff --check
          echo '=== STALE CACHE-BUST EXPECTATIONS ==='
          grep -RIn 'core_mod=20260911-phase4j-r1' tests .github/workflows --exclude='modularization-phase4k-patch-temp.yml' && exit 1 || true
          echo '=== DEFINITIONS AFTER EXTRACTION ==='
          grep -nE 'function (alternarFiltroPreCadastro|fecharBuscaPacientesPreCadastro|sincronizarBuscaPacientePreCadastro|selecionarPacienteBuscaPreCadastro|filtrarPacientesPreCadastro|navegarBuscaPacientesPreCadastro|atualizarSelectPacientesPreCadastro|carregarPacientePreCadastradoNaAvaliacao)' script-1.18.0.js && exit 1 || true
          echo '=== SIZE AFTER EXTRACTION ==='
          wc -l -c script-1.18.0.js patient_pre_registration_core-1.0.0.js
      - name: Commit extraction
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add script-1.18.0.js index.html
          git commit -m "Extract patient pre-registration selector from monolithic core" || exit 0
          git push origin HEAD:performance/modularization-phase4k
