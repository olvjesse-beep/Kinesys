name: Lifecycle Phase 2C Temp

on:
  push:
    branches:
      - performance/lifecycle-phase2c

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: performance/lifecycle-phase2c
          fetch-depth: 0
      - name: Apply Radar lifecycle patch
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = 'script-1.18.0.js';
          let s = fs.readFileSync(path, 'utf8');

          const oldBlock = `function instalarObservadorCicloVidaRadar() {\n    const tela = document.getElementById('tela_avaliacao');\n    if (!tela || tela.dataset.radarLifecycleBound === '1') return;\n    const observer = new MutationObserver(() => sincronizarCicloVidaRadar());\n    observer.observe(tela, { attributes: true, attributeFilter: ['class'] });\n    tela.dataset.radarLifecycleBound = '1';\n    sincronizarCicloVidaRadar();\n}`;

          const newBlock = `function instalarObservadorCicloVidaRadar() {\n    const tela = document.getElementById('tela_avaliacao');\n    if (!tela || tela.dataset.radarLifecycleBound === '1') return;\n    const sincronizarSeAvaliacao = event => {\n        if (event?.detail?.id === 'tela_avaliacao') sincronizarCicloVidaRadar();\n    };\n    document.addEventListener('kinesys:tela-ativada', sincronizarSeAvaliacao);\n    document.addEventListener('kinesys:tela-desativada', sincronizarSeAvaliacao);\n    tela.dataset.radarLifecycleBound = '1';\n    sincronizarCicloVidaRadar();\n}`;

          if (!s.includes(oldBlock)) throw new Error('Observer lifecycle do Radar não encontrado');
          s = s.replace(oldBlock, newBlock);
          fs.writeFileSync(path, s);
          NODE
      - name: Remove temporary workflow
        run: rm .github/workflows/lifecycle-phase2c-temp.yml
      - name: Validate syntax and diff
        run: |
          node --check script-1.18.0.js
          git diff --check
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add script-1.18.0.js .github/workflows/lifecycle-phase2c-temp.yml
          git commit -m "Performance — Radar lifecycle Phase 2C"
          git push origin HEAD:performance/lifecycle-phase2c
