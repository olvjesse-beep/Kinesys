name: Agenda Edit Audit

on:
  push:
    branches:
      - feature/agenda-editar-atendimento

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Map agenda detail, persistence, recurrence and finance contracts
        shell: bash
        run: |
          set -euo pipefail
          echo '=== AGENDA FILES / LOADERS ==='
          git grep -n -I -E 'agenda-1\.20\.0\.js|agenda\.js|tela_agenda' -- index.html screen_loader.js screen_loader-*.js 2>/dev/null || true

          echo '=== DETAIL / MODAL / PAYMENT ==='
          git grep -n -I -E 'Detalhe do Agendamento|DETALHE DO AGENDAMENTO|detalhe.*agend|agend.*detalhe|LANÇAR PAGAMENTO|Lançar pagamento|lancar.*pagamento|pagamento.*agend' -- 'agenda*.js' 'index.html' 2>/dev/null || true

          echo '=== SELECTED APPOINTMENT STATE ==='
          git grep -n -I -E 'agendamentoSelecion|agendamentoAtual|agendamentoAberto|eventoSelecion|appointment.*selected|selected.*agend' -- 'agenda*.js' 2>/dev/null || true

          echo '=== SUPABASE AGENDAMENTO WRITES ==='
          git grep -n -I -E "from\(['\"]agendamentos|from\(['\"]atendimentos|rpc\(['\"][^'\"]*(agend|atend)|\.update\(|\.insert\(|\.upsert\(" -- 'agenda*.js' 'financeiro*.js' 'script-*.js' 2>/dev/null || true

          echo '=== RECURRENCE ==='
          git grep -n -I -E 'recorr|recurrence|serie|série|frequencia|frequência' -- 'agenda*.js' 'supabase/**' '*.sql' 2>/dev/null || true

          echo '=== CONFLICT / AVAILABILITY ==='
          git grep -n -I -E 'conflit|disponib|sobrepos|ocupad|choque.*hor|hor.*choque' -- 'agenda*.js' 2>/dev/null || true

          echo '=== PROFESSIONAL / PROCEDURE SOURCES ==='
          git grep -n -I -E 'profissionais|procedimentos|profissional_id|procedimento_id|profissionalId|procedimentoId' -- 'agenda*.js' 2>/dev/null || true

          echo '=== FINANCIAL COUPLING ==='
          git grep -n -I -E 'financeir|pagamento|valor_pago|valor_pendente|credito|crédito|recebimento' -- 'agenda*.js' 'financeiro*.js' 2>/dev/null || true

          echo '=== SQL / SCHEMA ==='
          git grep -n -I -E 'CREATE TABLE.*(agendamentos|atendimentos)|ALTER TABLE.*(agendamentos|atendimentos)|agendamentos \(|atendimentos \(' -- '*.sql' 'supabase/**' 2>/dev/null || true
