name: Recovery Redirect Temp

on:
  push:
    branches: [security/access-management-recovery]
    paths:
      - 'tools/recovery_redirect_temp.py'
      - '.github/workflows/recovery-redirect-temp.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: security/access-management-recovery
      - name: Patch recovery redirect
        run: python tools/recovery_redirect_temp.py
      - name: Validate
        run: |
          node --check login_access-1.18.0.js
          git diff --check
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add login_access-1.18.0.js
          git commit -m "Use production password recovery redirect" || exit 0
          git push origin HEAD:security/access-management-recovery
