name: Patient Form Helpers Modularization Contract

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  contract:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 10
    defaults:
      run:
        shell: 'C:\PROGRA~1\Git\bin\bash.exe --noprofile --norc -eo pipefail {0}'
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: JavaScript syntax
        run: |
          node --check patient_form_helpers_core-1.0.0.js
          node --check script-1.18.0.js
          node --check tests/patient_form_helpers_modularization.contract.js

      - name: Patient form helpers contract
        run: node tests/patient_form_helpers_modularization.contract.js

      - name: Team management integration
        run: node tests/team_management_modularization.contract.js

      - name: Diff whitespace check
        run: git diff --check
