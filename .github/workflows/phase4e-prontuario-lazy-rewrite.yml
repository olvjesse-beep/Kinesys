name: Phase 4E Prontuario Export Lazy Rewrite

on:
  push:
    branches: [performance/prontuario-export-phase4e]
    paths:
      - '.github/workflows/phase4e-prontuario-lazy-rewrite.yml'

permissions:
  contents: write

jobs:
  rewrite:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: performance/prontuario-export-phase4e
          fetch-depth: 0
      - name: Apply Phase 4E rewrite
        run: |
          python .github/scripts/phase4e_prontuario_lazy.py
          git checkout -- .github/workflows/kinesys-quality.yml
      - name: Validate Phase 4E
        shell: bash
        run: |
          set -euo pipefail
          node --check prontuario_export.js
          node --check prontuario_export_impl.js
          node --check design_system-1.20.1.js
          node tests/prontuario_export_lazy.contract.js
          node tests/screen_loader.contract.js
          node tests/data_loading.contract.js
          node tests/operational_data_loading.contract.js
          node tests/clinical_reasoning_shoulder_elbow.regression.js
          git diff --check
      - name: Commit permanent Phase 4E code
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html prontuario_export.js prontuario_export_impl.js design_system-1.20.1.js tests/prontuario_export_lazy.contract.js
          git commit -m 'Lazy-load prontuario export implementation'
          git push origin HEAD:performance/prontuario-export-phase4e
