name: Phase 3A data loading rewrite

on:
  push:
    branches: [performance/data-on-demand-phase3a]
    paths:
      - '.github/workflows/phase3a-data-loading-rewrite.yml'

permissions:
  contents: write

jobs:
  rewrite:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: performance/data-on-demand-phase3a
          fetch-depth: 0

      - name: Apply exact data-loading rewrite
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess

          source = Path('.github/scripts/phase3a_data_loading.py').read_text(encoding='utf-8')
          start_marker = '# Saving an evaluation: full selected chart, basic global list only for duplicate-name check.'
          end_marker = '# Report screens need one full patient, never all patient histories.'
          start = source.index(start_marker)
          end = source.index(end_marker, start)
          replacement = r'''# Saving an evaluation: full selected chart, basic global list only for duplicate-name check.
          text = replace_once(
              text,
              "    let lista=await obterPacientesSalvos();\n    let pacienteExistente=pacienteAtualId?lista.find(p=>String(p.id)===String(pacienteAtualId)):null;",
              "    let pacienteExistente=pacienteAtualId?await obterPacienteCompletoPorId(pacienteAtualId):null;",
              'save evaluation loads only selected chart'
          )
          text = replace_once(
              text,
              "    if(!pacienteExistente&&!pacienteAtualId){const duplicados=lista.filter(",
              "    if(!pacienteExistente&&!pacienteAtualId){const listaBasica=await obterPacientesBasicos();const duplicados=listaBasica.filter(",
              'save evaluation duplicate-name check uses lightweight index'
          )

          '''
          patched = source[:start] + replacement + source[end:]
          temp = Path('/tmp/phase3a_data_loading_v2.py')
          temp.write_text(patched, encoding='utf-8')
          subprocess.check_call(['python', str(temp)])
          PY

      - name: Validate Phase 3A
        shell: bash
        run: |
          set -euo pipefail
          node --check script-1.18.0.js
          node --check tests/data_loading.contract.js
          node tests/data_loading.contract.js
          node tests/screen_loader.contract.js
          node tests/clinical_reasoning_shoulder_elbow.regression.js
          git diff --check
          git diff --stat

      - name: Commit permanent Phase 3A code
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add script-1.18.0.js tests/data_loading.contract.js
          git commit -m 'Separate lightweight patient index from full charts'
          git push origin HEAD:performance/data-on-demand-phase3a
