name: Temporary Online Cache R3

on:
  push:
    branches:
      - fix/agendamento-online-cache-r3
    paths:
      - .github/workflows/temp-online-cache-r3.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: [self-hosted, Windows, X64]
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Bump online cache chain
        shell: 'C:\PROGRA~1\Git\bin\bash.exe --noprofile --norc -e -o pipefail {0}'
        run: |
          set -euo pipefail
          sed -i 's/20260913-online-r2/20260913-online-r3/g' src/admin/access_admin-1.0.0.js
          sed -i 's/20260913-online-r2/20260913-online-r3/g' src/admin/configuracoes_agendamento_online-1.0.0.js
          sed -i 's/20260913-online-r2/20260913-online-r3/g' index.html

          git rm .github/workflows/temp-online-cache-r3.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/admin/access_admin-1.0.0.js src/admin/configuracoes_agendamento_online-1.0.0.js index.html

          if ! git diff --cached --quiet; then
            git commit -m 'fix: invalidate online scheduling config cache'
            git push origin HEAD:fix/agendamento-online-cache-r3
          fi
