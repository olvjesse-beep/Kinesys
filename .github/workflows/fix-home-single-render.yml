name: Fix Home single render

on:
  push:
    paths:
      - '.github/workflows/fix-home-single-render.yml'

permissions:
  contents: write

jobs:
  fix-home-single-render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply durable Meu Dia dedupe and cache bust
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          home_path = Path('src/home/home_fisioterapeuta_util-1.24.0.js')
          home = home_path.read_text(encoding='utf-8')

          marker = 'function garantirIntegridadePainelFisioterapeuta(lista)'
          if marker not in home:
              anchor = '    function resumoTimeline(itens,livres,emAtendimento,concluidos,registrosPendentes){\n'
              if anchor not in home:
                  raise SystemExit('Anchor resumoTimeline not found')
              guard = r'''    function chaveLinhaPainelFisioterapeuta(linha){
        if(!linha?.matches?.('.ks-fisio-day-row'))return '';
        const agendamentoId=String(linha.dataset?.agendamentoId||'').trim();
        if(agendamentoId)return `agendamento:${agendamentoId}`;
        const hora=String(linha.querySelector('.ks-fisio-day-time strong')?.textContent||'').trim();
        const texto=String(linha.textContent||'').replace(/\s+/g,' ').trim();
        return hora||texto ? `visual:${hora}|${texto}` : '';
    }

    function deduplicarLinhasPainelFisioterapeuta(lista){
        if(!lista)return 0;
        const vistos=new Set();
        let removidos=0;
        Array.from(lista.children).forEach(linha=>{
            const chave=chaveLinhaPainelFisioterapeuta(linha);
            if(!chave)return;
            if(vistos.has(chave)){
                linha.remove();
                removidos++;
                return;
            }
            vistos.add(chave);
        });
        if(removidos){
            const card=document.getElementById('card_painel_fisioterapeuta');
            if(card){
                card.dataset.ksMeuDiaDeduplicado='1';
                card.dataset.ksMeuDiaDeduplicadoEm=String(Date.now());
            }
        }
        return removidos;
    }

    function garantirIntegridadePainelFisioterapeuta(lista){
        if(!lista)return;
        deduplicarLinhasPainelFisioterapeuta(lista);
        if(lista.__ksMeuDiaIntegridadeObserver)return;
        let agendado=false;
        const observer=new MutationObserver(()=>{
            if(agendado)return;
            agendado=true;
            queueMicrotask(()=>{
                agendado=false;
                deduplicarLinhasPainelFisioterapeuta(lista);
            });
        });
        observer.observe(lista,{childList:true});
        lista.__ksMeuDiaIntegridadeObserver=observer;
    }

'''
              home = home.replace(anchor, guard + anchor, 1)

          old = '        lista.replaceChildren(fragmento);\n'
          new = '        lista.replaceChildren(fragmento);\n        garantirIntegridadePainelFisioterapeuta(lista);\n'
          if new not in home:
              if old not in home:
                  raise SystemExit('replaceChildren anchor not found')
              home = home.replace(old, new, 1)

          home_path.write_text(home, encoding='utf-8')

          op_path = Path('src/core/operational_resume_refresh-1.0.0.js')
          op = op_path.read_text(encoding='utf-8')
          op = op.replace("const VERSION='1.2.0-home-single-render';", "const VERSION='1.2.1-home-single-render';")
          op = op.replace("const PROFESSIONAL_HOME_ASSET_VERSION='20260915-home-dedupe-r6';", "const PROFESSIONAL_HOME_ASSET_VERSION='20260915-home-dedupe-r8';")
          op_path.write_text(op, encoding='utf-8')

          index_path = Path('index.html')
          index = index_path.read_text(encoding='utf-8')
          old_home = 'src/home/home_fisioterapeuta_util-1.24.0.js?v=20260910-r3&fisio_home=20260910-r1&home4h=20260910-r1'
          new_home = old_home + '&single_render=20260915-r2'
          if 'single_render=20260915-r2' not in index:
              if old_home not in index:
                  raise SystemExit('Home script URL anchor not found')
              index = index.replace(old_home, new_home, 1)

          old_op = 'src/core/operational_resume_refresh-1.0.0.js?v=20260912-home-mobile-r5'
          new_op = old_op + '&single_render=20260915-r2'
          if new_op not in index:
              if old_op not in index:
                  raise SystemExit('Operational refresh URL anchor not found')
              index = index.replace(old_op, new_op, 1)

          index_path.write_text(index, encoding='utf-8')
          PY

      - name: Verify contracts
        shell: bash
        run: |
          node tests/fisio_home_patient_self_service.contract.js
          grep -q "garantirIntegridadePainelFisioterapeuta" src/home/home_fisioterapeuta_util-1.24.0.js
          grep -q "single_render=20260915-r2" index.html
          grep -q "20260915-home-dedupe-r8" src/core/operational_resume_refresh-1.0.0.js

      - name: Commit fix
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html src/home/home_fisioterapeuta_util-1.24.0.js src/core/operational_resume_refresh-1.0.0.js
          git commit -m 'fix(home): enforce single render and refresh assets'
          git push origin HEAD:main
