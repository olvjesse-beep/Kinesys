name: Fix grouped control semantics

on:
  push:
    paths:
      - '.github/workflows/fix-group-semantics.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Improve grouped control semantics
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          html_path = Path('index.html')
          css_path = Path('design_screens.css')
          html = html_path.read_text(encoding='utf-8')
          css = css_path.read_text(encoding='utf-8')

          rules = [
              (r'<label>Fatores de piora</label>\s*<div class="checkbox-group compact-chips">',
               '<span class="kds-group-label" id="fatores_piora_label">Fatores de piora</span>\n                        <div class="checkbox-group compact-chips" role="group" aria-labelledby="fatores_piora_label">'),
              (r'<label>Marcadores e comorbidades</label><div class="checkbox-group compact-chips">',
               '<span class="kds-group-label" id="marcadores_comorbidades_label">Marcadores e comorbidades</span><div class="checkbox-group compact-chips" role="group" aria-labelledby="marcadores_comorbidades_label">'),
              (r'<label>Nova Escala Visual Analógica da Dor \(EVA\)</label>',
               '<label for="eva_slider_evo">Nova Escala Visual Analógica da Dor (EVA)</label>'),
              (r'<label>Resumo para orientar o documento <span class="ks-optional">opcional</span></label>',
               '<label for="rel_rascunho_rapido">Resumo para orientar o documento <span class="ks-optional">opcional</span></label>'),
              (r'<label>Regra de segurança</label><div class="field-help">',
               '<span class="kds-group-label">Regra de segurança</span><div class="field-help">'),
              (r'<label>Plano ou atendimento unitário <span class="optional-label">\(opcional\)</span></label>',
               '<label for="ag_plano_select">Plano ou atendimento unitário <span class="optional-label">(opcional)</span></label>'),
              (r'<label>Quem realiza este procedimento</label>\s*<div class="toggle-pill" id="proc_profissionais_toggle"></div>',
               '<span class="kds-group-label" id="proc_profissionais_label">Quem realiza este procedimento</span>\n                <div class="toggle-pill" id="proc_profissionais_toggle" role="group" aria-labelledby="proc_profissionais_label"></div>'),
              (r'<label>Janela de preferência \(opcional\)</label>\s*<div class="grid-2">',
               '<span class="kds-group-label" id="esp_janela_label">Janela de preferência (opcional)</span>\n                <div class="grid-2" role="group" aria-labelledby="esp_janela_label">'),
              (r'<label>Dias da semana preferidos <span class="kds-u-fw-500 kds-u-text-muted">\(opcional\)</span></label>\s*<div class="checkbox-group compact-chips" id="esp_dias_semana">',
               '<span class="kds-group-label" id="esp_dias_semana_label">Dias da semana preferidos <span class="kds-u-fw-500 kds-u-text-muted">(opcional)</span></span>\n                <div class="checkbox-group compact-chips" id="esp_dias_semana" role="group" aria-labelledby="esp_dias_semana_label">'),
              (r'<label>Formas de pagamento previstas</label><div id="fin_plano_forma" class="finance-payment-methods" role="group" aria-label="Formas de pagamento previstas">',
               '<span class="kds-group-label" id="fin_plano_forma_label">Formas de pagamento previstas</span><div id="fin_plano_forma" class="finance-payment-methods" role="group" aria-labelledby="fin_plano_forma_label">')
          ]

          applied = 0
          for pattern, replacement in rules:
              html, count = re.subn(pattern, replacement, html, count=1)
              if count != 1:
                  raise SystemExit(f'Expected exactly one match for: {pattern}; found {count}')
              applied += count

          marker = '/* Group labels for multi-control/informational input groups. */'
          if marker not in css:
              css += '\n\n' + marker + '\n' + (
                  'body.ks-design-ready .input-group > .kds-group-label{' 
                  'display:block;font-size:var(--kds-font-label);line-height:var(--kds-leading-ui);'
                  'font-weight:650;color:var(--kds-text-secondary);margin-bottom:6px;letter-spacing:0}\n'
              )

          html_path.write_text(html, encoding='utf-8')
          css_path.write_text(css, encoding='utf-8')
          print(f'Applied {applied} grouped-control semantic fixes')
          PY
      - name: Validate grouped controls
        run: |
          python - <<'PY'
          from pathlib import Path
          html = Path('index.html').read_text(encoding='utf-8')
          checks = [
              'role="group" aria-labelledby="fatores_piora_label"',
              'role="group" aria-labelledby="marcadores_comorbidades_label"',
              'for="eva_slider_evo"',
              'for="rel_rascunho_rapido"',
              'for="ag_plano_select"',
              'aria-labelledby="proc_profissionais_label"',
              'aria-labelledby="esp_janela_label"',
              'aria-labelledby="esp_dias_semana_label"',
              'aria-labelledby="fin_plano_forma_label"'
          ]
          missing = [item for item in checks if item not in html]
          if missing:
              raise SystemExit('Missing grouped semantics: ' + ', '.join(missing))
          print('Grouped-control semantics validated')
          PY
      - name: Remove one-off workflow and commit
        run: |
          git rm .github/workflows/fix-group-semantics.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html design_screens.css
          git commit -m 'Improve grouped form control semantics'
          git push
