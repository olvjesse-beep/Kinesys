name: KineSys final runtime QA

on:
  push:
    paths:
      - '.github/workflows/kinesys-final-runtime-qa.yml'

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate JavaScript syntax
        run: |
          set -euo pipefail
          count=0
          while IFS= read -r -d '' file; do
            node --check "$file"
            count=$((count+1))
          done < <(find . -type f -name '*.js' -not -path './.git/*' -print0)
          echo "JS_SYNTAX_FILES_OK=$count"

      - name: Validate HTML structural contracts
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          from collections import Counter

          text = Path('index.html').read_text(encoding='utf-8')
          ids = re.findall(r'\bid="([^"]+)"', text)
          dup = sorted(k for k,v in Counter(ids).items() if v > 1)
          styles = re.findall(r'<style\b', text, re.I)
          external_scripts = re.findall(r'<script\b([^>]*)\bsrc="[^"]+"[^>]*>', text, re.I)
          non_defer = [attrs.strip() for attrs in external_scripts if not re.search(r'\bdefer\b', attrs, re.I)]

          print(f'HTML_ID_COUNT={len(ids)}')
          print(f'DUPLICATE_ID_COUNT={len(dup)}')
          print(f'INLINE_STYLE_BLOCK_COUNT={len(styles)}')
          print(f'EXTERNAL_SCRIPT_COUNT={len(external_scripts)}')
          print(f'EXTERNAL_SCRIPT_WITHOUT_DEFER_COUNT={len(non_defer)}')

          if dup:
              raise SystemExit('Duplicate IDs: ' + ', '.join(dup))
          if styles:
              raise SystemExit('Inline <style> blocks found in index.html')
          if non_defer:
              raise SystemExit(f'{len(non_defer)} external scripts are missing defer')
          PY

      - name: Validate runtime CSS contracts
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          html = Path('index.html').read_text(encoding='utf-8')
          hrefs = re.findall(r'<link[^>]+rel="stylesheet"[^>]+href="([^"]+)"', html, re.I)
          css_files = []
          for href in hrefs:
              p = Path(href.split('?',1)[0])
              if p.exists() and p.suffix.lower() == '.css':
                  css_files.append(p)

          allowed = {1280,1180,1100,980,900,820,760,700,620,560,520,430}
          micro = []
          bp = []
          for p in css_files:
              text = re.sub(r'/\*.*?\*/','',p.read_text(encoding='utf-8'),flags=re.S)
              for m in re.finditer(r'font-size\s*:\s*([0-9]*\.?[0-9]+)px', text, re.I):
                  if float(m.group(1)) < 12.5:
                      micro.append(f'{p}:{text.count(chr(10),0,m.start())+1}:{m.group(1)}px')
              for m in re.finditer(r'@media[^\{]*\((max|min)-width\s*:\s*([0-9]+)px\)', text, re.I):
                  kind = m.group(1).lower()
                  value = int(m.group(2))
                  if value not in allowed and not (kind == 'min' and value == 701):
                      bp.append(f'{p}:{text.count(chr(10),0,m.start())+1}:{value}px')

          print(f'RUNTIME_CSS_FILES={len(css_files)}')
          print(f'MICROTYPE_UNDER_12_5_COUNT={len(micro)}')
          print(f'NONCONTRACT_BREAKPOINT_COUNT={len(bp)}')
          if micro:
              raise SystemExit('Microtype remains:\n' + '\n'.join(micro))
          if bp:
              raise SystemExit('Non-contract breakpoints remain:\n' + '\n'.join(bp))
          PY

      - name: Validate visible form accessible names
        run: |
          python -m pip install --quiet beautifulsoup4
          python - <<'PY'
          from bs4 import BeautifulSoup
          from pathlib import Path

          soup = BeautifulSoup(Path('index.html').read_text(encoding='utf-8'), 'html.parser')
          labels_for = {x.get('for') for x in soup.find_all('label') if x.get('for')}

          def hidden(node):
              cur = node
              while cur is not None and getattr(cur, 'attrs', None) is not None:
                  if cur.has_attr('hidden') or cur.get('aria-hidden') == 'true':
                      return True
                  style = (cur.get('style') or '').replace(' ','').lower()
                  if 'display:none' in style or 'visibility:hidden' in style:
                      return True
                  cur = cur.parent
              return False

          unnamed = []
          for control in soup.find_all(['input','select','textarea']):
              if control.name == 'input' and control.get('type','text').lower() == 'hidden':
                  continue
              if control.has_attr('disabled') or hidden(control):
                  continue
              cid = control.get('id')
              wrapped = control.find_parent('label') is not None
              named = bool(control.get('aria-label') or control.get('aria-labelledby') or wrapped or (cid and cid in labels_for))
              if not named:
                  unnamed.append(cid or str(control)[:120])

          form_buttons_without_type = []
          for form in soup.find_all('form'):
              for button in form.find_all('button'):
                  if not button.get('type'):
                      form_buttons_without_type.append(button.get('id') or button.get_text(' ',strip=True)[:60])

          print(f'VISIBLE_UNNAMED_FORM_CONTROL_COUNT={len(unnamed)}')
          print(f'FORM_BUTTON_WITHOUT_TYPE_COUNT={len(form_buttons_without_type)}')
          if unnamed:
              raise SystemExit('Visible unnamed controls: ' + ', '.join(unnamed))
          if form_buttons_without_type:
              raise SystemExit('Form buttons without type: ' + ', '.join(form_buttons_without_type))
          PY

      - name: Run Impeccable detector summary
        run: |
          set -uo pipefail
          chmod +x .agents/skills/impeccable/scripts/impeccable || true
          set +e
          .agents/skills/impeccable/scripts/impeccable detect --json index.html design_tokens.css design_components.css design_responsive.css design_screens.css avaliacao_experiencia-1.22.0.css > /tmp/impeccable-detect.json 2>/tmp/impeccable-detect.err
          code=$?
          set -e
          echo "IMPECCABLE_DETECTOR_EXIT_CODE=$code"
          if [ -s /tmp/impeccable-detect.err ]; then
            echo 'IMPECCABLE_DETECTOR_STDERR_BEGIN'
            cat /tmp/impeccable-detect.err
            echo 'IMPECCABLE_DETECTOR_STDERR_END'
          fi
          python - <<'PY'
          import json
          from collections import Counter
          from pathlib import Path

          raw = Path('/tmp/impeccable-detect.json').read_text(encoding='utf-8').strip()
          try:
              findings = json.loads(raw) if raw else []
          except Exception as exc:
              print('IMPECCABLE_JSON_PARSE_ERROR=', repr(exc))
              print(raw[:2000])
              raise
          if not isinstance(findings, list):
              findings = []
          severity = Counter((f.get('severity') or 'unknown') for f in findings)
          kinds = Counter((f.get('antipattern') or f.get('name') or 'unknown') for f in findings)
          print(f'IMPECCABLE_FINDING_COUNT={len(findings)}')
          for key in sorted(severity):
              print(f'IMPECCABLE_SEVERITY_{key.upper()}={severity[key]}')
          print('IMPECCABLE_TOP_FINDINGS:')
          for key,count in kinds.most_common(15):
              print(f'  {key}={count}')
          PY
