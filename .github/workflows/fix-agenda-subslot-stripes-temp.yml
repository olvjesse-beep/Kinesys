name: Agenda Subslot Stripes Temp

on:
  push:
    branches:
      - fix/agenda-subslot-stripes

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/agenda-subslot-stripes
          fetch-depth: 0
      - name: Apply visual fix
        run: python .github/scripts/fix_agenda_subslot_stripes.py
      - name: Validate
        shell: bash
        run: |
          set -euo pipefail
          node --check agenda-1.20.0.js
          node tests/access_agenda_home4h.contract.js
          node tests/agenda_editar_atendimento.contract.js
          node tests/screen_loader.contract.js
          git diff --check
          grep -q 'AGENDA SUBSLOT STRIPES FIX R3' design_agenda.css
          grep -q 'border-top-width:0!important' design_agenda.css
          grep -q 'design_agenda.css?v=20260910-compact-r3' index.html
      - name: Commit permanent files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add design_agenda.css index.html
          if git diff --cached --quiet; then
            echo 'No changes'
            exit 0
          fi
          git commit -m "Remove visual stripes from 10-minute agenda subslots"
          git push origin HEAD:fix/agenda-subslot-stripes
