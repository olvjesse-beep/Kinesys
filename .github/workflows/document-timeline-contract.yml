name: Document Timeline Contract

on:
  pull_request:
    branches: [main]
    paths:
      - 'index.html'
      - 'src/core/script-1.18.0.js'
      - 'src/core/document_timeline_core-1.0.0.js'
      - 'tests/document_timeline_modularization.contract.js'
      - '.github/workflows/document-timeline-contract.yml'
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'src/core/script-1.18.0.js'
      - 'src/core/document_timeline_core-1.0.0.js'
      - 'tests/document_timeline_modularization.contract.js'
      - '.github/workflows/document-timeline-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: 'C:\PROGRA~1\Git\bin\bash.exe --noprofile --norc -eo pipefail {0}'

jobs:
  contract:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: JavaScript syntax
        run: |
          node --check src/core/document_timeline_core-1.0.0.js
          node --check src/core/script-1.18.0.js
          node --check tests/document_timeline_modularization.contract.js
      - name: Document timeline modularization contract
        run: node tests/document_timeline_modularization.contract.js
      - name: Diff hygiene
        run: git diff --check
