name: Run HMA latency and language fix
on:
  push:
    paths:
      - '.github/workflows/run-hma-latency-language-fix.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python .tmp_fix_hma_latency_language.py
      - run: node --check script-1.18.0.js
      - run: node --check clinical_reasoning_hma-3.0.0.js
      - run: node --check clinical_reasoning_shoulder-3.1.0.js
      - run: git diff --check
      - run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('script-1.18.0.js').read_text(encoding='utf-8')
          sh=Path('clinical_reasoning_shoulder-3.1.0.js').read_text(encoding='utf-8')
          assert 'decubitoOmbro' in s
          assert 'dormir encima do braço' in s
          assert 'deitar encima do braco' in s
          assert "3.1.2-shoulder3" in sh
          assert 'dormir em cima do braco' in sh
          assert 'ultimaAssinaturaAtualizacao' in Path('clinical_reasoning_hma-3.0.0.js').read_text(encoding='utf-8')
          print('semantic/performance guards OK')
          PY
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add script-1.18.0.js clinical_reasoning_hma-3.0.0.js clinical_reasoning_shoulder-3.1.0.js index.html
          git commit -m "Optimize HMA live analysis and broaden shoulder language" || exit 0
          git push
