name: Phase 4F Messages Reference Audit

on:
  push:
    branches: [performance/messages-on-demand-phase4f]
    paths:
      - '.github/workflows/phase4f-messages-audit.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Audit message configuration references
        shell: bash
        run: |
          set -euo pipefail
          for symbol in obterMensagemPadraoConfigurada carregarConfiguracoesMensagens abrirConfiguracoesMensagens selecionarMensagemConfiguracao salvarMensagemConfiguracaoAtual restaurarMensagemPadraoAtual inserirVariavelMensagem atualizarPreviewMensagemConfiguracao; do
            echo "=== $symbol ==="
            git grep -n -I "$symbol" -- ':!mensagens_config.js' || true
          done
          echo '=== mensagens_config.js loader ==='
          git grep -n -I 'mensagens_config.js' || true
          echo '=== listar mensagens RPC ==='
          git grep -n -I 'kinesys_listar_mensagens_padrao' -- ':!mensagens_config.js' || true
