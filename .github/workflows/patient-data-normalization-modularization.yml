name: Patient Data Normalization Modularization Contract

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  contract:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 10
    defaults:
      run:
        shell: 'C:\PROGRA~1\Git\bin\bash.exe --noprofile --norc -eo pipefail {0}'
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: JavaScript syntax
        run: |
          node --check patient_data_normalization_core-1.0.0.js
          node --check script-1.18.0.js
          node --check tests/patient_data_normalization_modularization.contract.js

      - name: Patient normalization contract
        run: node tests/patient_data_normalization_modularization.contract.js

      - name: Patient index integration
        run: node tests/patient_index_cache_modularization.contract.js

      - name: Diff whitespace check
        run: git diff --check
