name: Run Motor 3.1 shoulder patch
on:
  push:
    paths:
      - '.github/workflows/run-motor31-shoulder-patch.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python .tmp_patch_motor31.py
      - run: node --check clinical_reasoning_hma-3.0.0.js
      - run: node --check clinical_reasoning_shoulder-3.1.0.js
      - run: git diff --check
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add clinical_reasoning_hma-3.0.0.js index.html
          git commit -m "Connect Motor 3.1 shoulder reasoning" || exit 0
          git push
