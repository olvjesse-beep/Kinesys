name: One-time physiotherapist workspace scope fix

on:
  push:
    paths:
      - '.github/workflows/fix-physio-workspace-scope.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix lexical globals and bump runtime asset
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('home_fisioterapeuta_util-1.23.0.js')
          s=p.read_text(encoding='utf-8')
          replacements={
            "const tipo=String(window.usuarioLogado?.tipo || '').toUpperCase();":"const u=typeof usuarioLogado!=='undefined'?usuarioLogado:null;\n        const tipo=String(u?.tipo || '').toUpperCase();",
            "if(!window._supabase){":"if(typeof _supabase==='undefined' || !_supabase){",
            "const perfilInicial=window.usuarioLogado;":"const perfilInicial=typeof usuarioLogado!=='undefined'?usuarioLogado:null;",
            "if(window.usuarioLogado===perfilInicial) resumo.textContent='Não foi possível verificar seu vínculo com a agenda. Tente novamente.';":"if((typeof usuarioLogado!=='undefined'?usuarioLogado:null)===perfilInicial) resumo.textContent='Não foi possível verificar seu vínculo com a agenda. Tente novamente.';",
            "if(window.usuarioLogado!==perfilInicial) return;":"if((typeof usuarioLogado!=='undefined'?usuarioLogado:null)!==perfilInicial) return;",
            "String(window.usuarioLogado?.id||'');":"String(perfilInicial?.id||'');",
            "let consulta=await window._supabase.from('agendamentos')":"let consulta=await _supabase.from('agendamentos')",
            "consulta=await window._supabase.from('agendamentos')":"consulta=await _supabase.from('agendamentos')",
          }
          for old,new in replacements.items():
              if s.count(old)!=1:
                  raise SystemExit(f'Expected one match for: {old!r}; found {s.count(old)}')
              s=s.replace(old,new)
          p.write_text(s,encoding='utf-8')

          idx=Path('index.html')
          html=idx.read_text(encoding='utf-8')
          old='home_fisioterapeuta_util-1.23.0.js?v=20260909-r1'
          new='home_fisioterapeuta_util-1.23.0.js?v=20260909-r2'
          if html.count(old)!=1:
              raise SystemExit(f'Runtime JS ref count={html.count(old)}')
          idx.write_text(html.replace(old,new),encoding='utf-8')
          PY
          node --check home_fisioterapeuta_util-1.23.0.js
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add home_fisioterapeuta_util-1.23.0.js index.html
          git commit -m "Fix physiotherapist workspace runtime scope"
          git push
