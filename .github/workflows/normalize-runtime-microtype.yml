name: Normalize runtime microtype

on:
  push:
    paths:
      - '.github/workflows/normalize-runtime-microtype.yml'

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace runtime font sizes below KDS metadata floor
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          html = Path('index.html').read_text(encoding='utf-8')
          hrefs = re.findall(r'<link[^>]+rel="stylesheet"[^>]+href="([^"]+)"', html, re.I)
          files = []
          for href in hrefs:
              p = Path(href.split('?',1)[0])
              if p.exists() and p.suffix.lower() == '.css':
                  files.append(p)

          total = 0
          touched = []
          pattern = re.compile(r'font-size\s*:\s*([0-9]*\.?[0-9]+)px', re.I)
          for path in files:
              text = path.read_text(encoding='utf-8')
              count = 0
              def repl(match):
                  nonlocal_count = None
                  value = float(match.group(1))
                  if value < 12.5:
                      return 'font-size:var(--kds-font-metadata)'
                  return match.group(0)
              updated = pattern.sub(repl, text)
              # Count only actual replacements.
              count = sum(1 for m in pattern.finditer(text) if float(m.group(1)) < 12.5)
              if count:
                  path.write_text(updated, encoding='utf-8')
                  total += count
                  touched.append((str(path), count))

          if total == 0:
              raise SystemExit('No runtime microtype below 12.5px found')
          print('Replacements:', total)
          for item in touched:
              print('TOUCHED:', item)
          PY
      - name: Validate no runtime px microtype remains
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          html = Path('index.html').read_text(encoding='utf-8')
          hrefs = re.findall(r'<link[^>]+rel="stylesheet"[^>]+href="([^"]+)"', html, re.I)
          failures = []
          for href in hrefs:
              p = Path(href.split('?',1)[0])
              if not p.exists() or p.suffix.lower() != '.css':
                  continue
              text = re.sub(r'/\*.*?\*/','',p.read_text(encoding='utf-8'),flags=re.S)
              for m in re.finditer(r'font-size\s*:\s*([0-9]*\.?[0-9]+)px', text, re.I):
                  if float(m.group(1)) < 12.5:
                      failures.append(f'{p}:{text.count(chr(10),0,m.start())+1}:{m.group(1)}px')
          if failures:
              raise SystemExit('Microtype remains:\n' + '\n'.join(failures))
          print('MICROTYPE_UNDER_12_5_COUNT=0')
          PY
      - name: Validate JavaScript syntax
        run: |
          find . -type f -name '*.js' -not -path './.git/*' -print0 | xargs -0 -n1 node --check
      - name: Remove one-off workflows and commit
        run: |
          git rm .github/workflows/normalize-runtime-microtype.yml
          git rm -f .github/workflows/audit-runtime-css-contract.yml || true
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add '*.css'
          git commit -m 'Normalize runtime typography to KDS minimum scale'
          git push
