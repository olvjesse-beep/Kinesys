name: One-time connect Motor Clinico 3 HMA

on:
  push:
    paths:
      - '.github/workflows/connect-motor3-hma.yml'

permissions:
  contents: write

jobs:
  connect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Connect Motor 3 HMA runtime assets
        shell: bash
        run: |
          set -euo pipefail
          node --check clinical_reasoning_hma-3.0.0.js
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          css='    <link rel="stylesheet" href="clinical_reasoning_hma-3.0.0.css?v=20260910-r1">\n'
          js='    <script defer src="clinical_reasoning_hma-3.0.0.js?v=20260910-r1"></script>\n'
          if 'clinical_reasoning_hma-3.0.0.css' not in s:
              marker='    <link rel="stylesheet" href="home_fisioterapeuta_util-1.24.0.css?v=20260909-r1">\n'
              if s.count(marker)!=1:
                  raise SystemExit(f'CSS insertion marker count={s.count(marker)}')
              s=s.replace(marker,marker+css)
          if 'clinical_reasoning_hma-3.0.0.js' not in s:
              marker='    <script defer src="home_fisioterapeuta_util-1.24.0.js?v=20260910-r3"></script>\n'
              if s.count(marker)!=1:
                  raise SystemExit(f'JS insertion marker count={s.count(marker)}')
              s=s.replace(marker,marker+js)
          p.write_text(s,encoding='utf-8')
          PY
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Connect Motor Clinico 3 HMA reasoning layer"
          git push
