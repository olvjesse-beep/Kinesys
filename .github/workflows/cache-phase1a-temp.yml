name: TEMP Data Cache Phase 1A

on:
  push:
    branches:
      - performance/query-cache-phase1a
    paths:
      - '.github/workflows/cache-phase1a-temp.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: performance/query-cache-phase1a
          fetch-depth: 0

      - name: Integrate session-scoped patient index cache
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p=Path('index.html')
          s=p.read_text()
          old='    <script defer src="database/ocupacoes_esportes.js"></script>\n    <script defer src="script-1.18.0.js?v=20260910-hma-perf-r3&patient_self_service=20260910-r1&access_admin=20260910-r1"></script>'
          new='    <script defer src="database/ocupacoes_esportes.js"></script>\n    <script defer src="kinesys_data_cache-1.0.0.js?v=20260911-cache-r1"></script>\n    <script defer src="script-1.18.0.js?v=20260910-hma-perf-r3&patient_self_service=20260910-r1&access_admin=20260910-r1&data_cache=20260911-r1"></script>'
          assert s.count(old)==1, 'index cache anchor not found exactly once'
          p.write_text(s.replace(old,new,1))

          p=Path('script-1.18.0.js')
          s=p.read_text()
          anchor='let pacientesBasicosEmCurso = null;\nconst pacientesCompletosEmCurso = new Map();\n'
          assert s.count(anchor)==1, 'patient cache declarations anchor not found'
          helper=anchor+'''\nconst KINESYS_PACIENTES_BASICOS_CACHE_TTL_MS = 15000;\n\nfunction chaveCachePacientesBasicos() {\n    const perfilId = String(usuarioLogado?.id || 'sem_perfil').trim() || 'sem_perfil';\n    return `pacientes::basicos::${perfilId}`;\n}\n\nfunction invalidarCachePacientesBasicos() {\n    try { return !!window.KineSysDataCache?.invalidate?.(chaveCachePacientesBasicos()); }\n    catch (_) { return false; }\n}\n'''
          s=s.replace(anchor,helper,1)

          start=s.index('async function obterPacientesBasicos() {')
          end=s.index('async function obterPacienteCompletoPorId(id)',start)
          block=s[start:end]
          old_head='async function obterPacientesBasicos() {\n    if (pacientesBasicosEmCurso) return pacientesBasicosEmCurso;\n    const carregar = async () => {'
          assert block.count(old_head)==1, 'patient basic loader head changed unexpectedly'
          block=block.replace(old_head,'async function obterPacientesBasicos() {\n    const carregar = async () => {',1)
          old_tail='''    pacientesBasicosEmCurso = Promise.resolve(carregar()).finally(() => { pacientesBasicosEmCurso = null; });\n    return pacientesBasicosEmCurso;\n}\n\n'''
          new_tail='''    if (window.KineSysDataCache?.get) {\n        return window.KineSysDataCache.get({\n            key:chaveCachePacientesBasicos(),\n            ttl:KINESYS_PACIENTES_BASICOS_CACHE_TTL_MS,\n            fetcher:carregar\n        });\n    }\n    if (pacientesBasicosEmCurso) return pacientesBasicosEmCurso;\n    pacientesBasicosEmCurso = Promise.resolve(carregar()).finally(() => { pacientesBasicosEmCurso = null; });\n    return pacientesBasicosEmCurso;\n}\n\n'''
          assert block.count(old_tail)==1, 'patient basic loader tail changed unexpectedly'
          block=block.replace(old_tail,new_tail,1)
          s=s[:start]+block+s[end:]

          save='async function salvarPacienteNaNuvem(pacienteObjeto, opcoes = {}) {\n'
          assert s.count(save)==1, 'patient save anchor not found'
          s=s.replace(save,save+'    invalidarCachePacientesBasicos();\n',1)

          delete_start=s.index('async function excluirPaciente(id)')
          list_anchor='    const lista = await obterPacientesBasicos();'
          list_pos=s.index(list_anchor,delete_start)
          assert list_pos < delete_start+1000, 'patient delete lightweight lookup moved unexpectedly'
          s=s[:list_pos]+'    invalidarCachePacientesBasicos();\n'+s[list_pos:]
          p.write_text(s)
          PY

      - name: Validate Phase 1A
        run: |
          node --check kinesys_data_cache-1.0.0.js
          node --check script-1.18.0.js
          node --check tests/data_cache.contract.js
          node --check tests/data_cache_integration.contract.js
          node tests/data_cache.contract.js
          node tests/data_cache_integration.contract.js
          node tests/data_loading.contract.js
          node tests/operational_data_loading.contract.js
          node tests/screen_loader.contract.js
          git diff --check

      - name: Commit verified integration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html script-1.18.0.js
          git diff --cached --quiet && exit 0
          git commit -m 'Integrate session-scoped patient index cache'
          git push origin HEAD:performance/query-cache-phase1a
