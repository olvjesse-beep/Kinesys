name: One-off Meu Dia core cleanup

on:
  push:
    branches:
      - fix/meu-dia-core-clean-20260915
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/meu-dia-core-clean-20260915
          fetch-depth: 0

      - name: Remove legacy Meu Dia owner and bump runtime assets
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          core_path = Path('src/core/script-1.18.0.js')
          core = core_path.read_text(encoding='utf-8')

          old_home = """    if (idTela === 'tela_home') {
              renderizarPacientesRecentesHome();
              popularSelectCRM();
              renderizarPendenciasClinicas();
              carregarPainelFisioterapeuta();
          }
          """
          new_home = """    if (idTela === 'tela_home') {
              renderizarPacientesRecentesHome();
              popularSelectCRM();
              renderizarPendenciasClinicas();
              if (window.KineSysMeuDiaClinico?.ensure) {
                  Promise.resolve(window.KineSysMeuDiaClinico.ensure())
                      .catch(err => console.warn('KineSys Meu Dia:', err));
              }
          }
          """
          if old_home in core:
              core = core.replace(old_home, new_home, 1)
          elif 'window.KineSysMeuDiaClinico?.ensure' not in core:
              raise SystemExit('Bloco Home esperado não encontrado; abortando.')

          pattern = r'async function carregarPainelFisioterapeuta\(\)\{.*?\}(?=async function renderizarPendenciasClinicas\(\)\{)'
          core, removed = re.subn(pattern, '', core, count=1, flags=re.S)
          if removed not in (0, 1):
              raise SystemExit(f'Quantidade inesperada de loaders removidos: {removed}')
          if 'async function carregarPainelFisioterapeuta()' in core:
              raise SystemExit('Loader legado ainda existe no core.')
          core_path.write_text(core, encoding='utf-8')

          home_path = Path('src/home/home_fisioterapeuta_util-1.24.0.js')
          home = home_path.read_text(encoding='utf-8')
          home = re.sub(
              r"\n\s*// Compatibilidade com o núcleo legado:[\s\S]*?window\.carregarPainelFisioterapeuta=garantirPainelFisioterapeuta;\n",
              '\n', home, count=1
          )
          if 'window.carregarPainelFisioterapeuta=' in home:
              raise SystemExit('Alias legado ainda existe no módulo Meu Dia.')
          home_path.write_text(home, encoding='utf-8')

          index_path = Path('index.html')
          html = index_path.read_text(encoding='utf-8')
          html = html.replace(
              'src/core/script-1.18.0.js?v=20260910-hma-perf-r3&patient_self_service=20260910-r1&access_admin=20260910-r1&data_cache=20260911-r1&core_mod=20260911-phase4s-r1',
              'src/core/script-1.18.0.js?v=20260910-hma-perf-r3&patient_self_service=20260910-r1&access_admin=20260910-r1&data_cache=20260911-r1&core_mod=20260911-phase4s-r1&meu_dia_owner=20260915-r2'
          )
          html = html.replace(
              'src/home/home_fisioterapeuta_util-1.24.0.js?v=20260910-r3&fisio_home=20260910-r1&home4h=20260910-r1',
              'src/home/home_fisioterapeuta_util-1.24.0.js?v=20260915-single-owner-r2'
          )
          html = html.replace(
              'src/core/operational_resume_refresh-1.0.0.js?v=20260912-home-mobile-r5',
              'src/core/operational_resume_refresh-1.0.0.js?v=20260915-agenda-only-r2'
          )
          html = html.replace(
              ' class="btn-secondary" onclick="carregarPainelFisioterapeuta()">Atualizar</button>',
              ' class="btn-secondary">Atualizar</button>'
          )
          if 'onclick="carregarPainelFisioterapeuta()"' in html:
              raise SystemExit('HTML ainda chama o loader legado.')
          index_path.write_text(html, encoding='utf-8')
          PY

      - name: Validate generated cleanup
        shell: bash
        run: |
          node --check src/core/script-1.18.0.js
          node --check src/home/home_fisioterapeuta_util-1.24.0.js
          grep -q "window.KineSysMeuDiaClinico?.ensure" src/core/script-1.18.0.js
          ! grep -q "async function carregarPainelFisioterapeuta()" src/core/script-1.18.0.js
          ! grep -q "window.carregarPainelFisioterapeuta=" src/home/home_fisioterapeuta_util-1.24.0.js
          grep -q "v=20260915-single-owner-r2" index.html
          git diff --check

      - name: Commit cleanup to fix branch
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No cleanup changes needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/core/script-1.18.0.js src/home/home_fisioterapeuta_util-1.24.0.js index.html
          git commit -m 'Remove legacy Meu Dia loader from core and bump assets'
          git push origin HEAD:fix/meu-dia-core-clean-20260915
