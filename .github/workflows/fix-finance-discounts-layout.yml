name: One-time Financeiro discounts layout fix

on:
  push:
    paths:
      - '.github/workflows/fix-finance-discounts-layout.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix discounts toolbar and table readability
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          css_path = Path('financeiro_alignment.css')
          css = css_path.read_text(encoding='utf-8')
          marker = '/* Descontos — alinhamento e legibilidade */'
          if marker in css:
              raise SystemExit('Discount layout block already exists')

          block = r'''

/* Descontos — alinhamento e legibilidade */
#tela_financeiro .finance-discount-toolbar{
  display:grid!important;
  grid-template-columns:minmax(170px,190px) minmax(170px,190px) minmax(0,1fr)!important;
  align-items:end!important;
  column-gap:12px!important;
  row-gap:12px!important;
}
#tela_financeiro .finance-discount-toolbar>.input-group{
  min-width:0!important;
  margin:0!important;
  align-self:end!important;
}
#tela_financeiro .finance-discount-toolbar>.input-group>input{
  height:var(--fin-control-height)!important;
  min-height:var(--fin-control-height)!important;
}
#tela_financeiro .finance-discount-actions{
  display:flex!important;
  align-items:center!important;
  align-self:end!important;
  gap:8px!important;
  flex-wrap:wrap!important;
  margin:0!important;
  padding:0!important;
}
#tela_financeiro .finance-discount-actions>button{
  display:inline-flex!important;
  align-items:center!important;
  justify-content:center!important;
  height:var(--fin-control-height)!important;
  min-height:var(--fin-control-height)!important;
  margin:0!important;
  padding-top:0!important;
  padding-bottom:0!important;
  white-space:nowrap!important;
}

#tela_financeiro #fin_desc_lista{
  overflow-x:auto!important;
}
#tela_financeiro .finance-discount-row{
  display:grid!important;
  grid-template-columns:96px minmax(230px,1.15fr) minmax(260px,1.35fr) 110px 150px 110px!important;
  column-gap:16px!important;
  align-items:center!important;
}
#tela_financeiro .finance-discount-row>span{
  min-width:0!important;
  line-height:1.4!important;
  overflow-wrap:anywhere;
}
#tela_financeiro .finance-discount-row>span:nth-child(2){
  display:flex!important;
  flex-direction:column!important;
  align-items:flex-start!important;
  gap:3px!important;
}
#tela_financeiro .finance-discount-row>span:nth-child(2)>b{
  display:block!important;
  line-height:1.35!important;
}
#tela_financeiro .finance-discount-row>span:nth-child(2)>small{
  display:block!important;
  margin:0!important;
  color:var(--kds-muted)!important;
  font-size:var(--kds-font-metadata)!important;
  line-height:1.35!important;
}
#tela_financeiro .finance-discount-row>span:nth-child(n+4){
  text-align:right!important;
  white-space:nowrap;
}
#tela_financeiro .finance-discount-row.header>span:nth-child(n+4){
  text-align:right!important;
}
#tela_financeiro .finance-discount-legacy{
  display:block!important;
  margin-top:3px!important;
  line-height:1.35!important;
}

@media(max-width:1100px){
  #tela_financeiro #fin_desc_lista{overflow-x:auto!important;}
  #tela_financeiro .finance-discount-row{min-width:980px;}
}
@media(max-width:700px){
  #tela_financeiro .finance-discount-toolbar{
    grid-template-columns:1fr 1fr!important;
  }
  #tela_financeiro .finance-discount-actions{
    grid-column:1/-1!important;
  }
  #tela_financeiro .finance-discount-actions>button{
    flex:1 1 auto!important;
  }
}
@media(max-width:430px){
  #tela_financeiro .finance-discount-toolbar{
    grid-template-columns:1fr!important;
  }
  #tela_financeiro .finance-discount-actions{
    grid-column:auto!important;
    display:grid!important;
    grid-template-columns:1fr 1fr!important;
  }
}
'''
          css_path.write_text(css.rstrip() + block + '\n', encoding='utf-8')

          index_path = Path('index.html')
          html = index_path.read_text(encoding='utf-8')
          old = 'financeiro_alignment.css?v=20260909-align-r1'
          new = 'financeiro_alignment.css?v=20260909-align-r2'
          if html.count(old) != 1:
              raise SystemExit(f'Expected exactly one {old}; found {html.count(old)}')
          index_path.write_text(html.replace(old, new), encoding='utf-8')

          # Structural sanity for the edited CSS.
          out = css_path.read_text(encoding='utf-8')
          if out.count('{') != out.count('}'):
              raise SystemExit('CSS brace balance failed')
          PY
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add financeiro_alignment.css index.html
          git commit -m "Fix Financeiro discounts alignment and spacing"
          git push
