name: Inspect clinical synthesis
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/inspect-clinical-synthesis.yml'
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect clinical synthesis path
        run: |
          python - <<'PY'
          from pathlib import Path
          files=['script-1.18.0.js','clinical_reasoning_hma-3.0.0.js','clinical_reasoning_shoulder-3.1.0.js','index.html']
          needles=['function avancarParaDiagnostico','function statusHipoteseKineSys','function ordenarHipotesesRegiaoKineSys','function inferirFenotipoOperacionalKineSys','sintese','diagnost','laudo','resultados[','estadoMapeamento','testesPrioritarios']
          for fn in files:
              p=Path(fn)
              if not p.exists(): continue
              lines=p.read_text(encoding='utf-8').splitlines()
              print(f'===== {fn} ({len(lines)} lines) =====')
              seen=[]
              for n in needles:
                  for i,line in enumerate(lines):
                      if n.lower() in line.lower():
                          key=(max(0,i-12),min(len(lines),i+45))
                          if key in seen: continue
                          seen.append(key)
                          print(f'--- {n} @ line {i+1} ---')
                          for j in range(*key): print(f'{j+1:05d}: {lines[j]}')
                          print()
          PY
