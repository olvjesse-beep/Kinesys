name: Core Modularization Phase 4C Temp

on:
  push:
    branches:
      - performance/core-modularization-phase4c
    paths:
      - tools/core_phase4c_patch_temp.py
      - .github/workflows/core-phase4c-temp.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: performance/core-modularization-phase4c
      - name: Apply Phase 4C patch
        run: python tools/core_phase4c_patch_temp.py
      - name: Validate Phase 4C
        run: |
          set -euo pipefail
          node --check html_escape-1.0.0.js
          node --check script-1.18.0.js
          node --check tests/html_escape_modularization.contract.js
          node tests/html_escape_modularization.contract.js
          node tests/operation_guard_modularization.contract.js
          node tests/menu_dropdown_modularization.contract.js
          node tests/screen_loader.contract.js
          git diff --check
      - name: Commit Phase 4C source changes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add script-1.18.0.js index.html
          git commit -m "Extract HTML escape utility from core for Phase 4C" || exit 0
          git push origin HEAD:performance/core-modularization-phase4c
