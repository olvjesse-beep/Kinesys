name: Financeiro Pendencia Contract

on:
  pull_request:
    paths:
      - 'src/finance/financeiro_agendamento-1.21.0.js'
      - 'styles/financeiro_agendamento-1.21.0.css'
      - 'index.html'
      - 'src/ui/screen_loader-1.25.0.js'
      - 'SUPABASE_SQL/SUPABASE_MIGRACAO_FINANCEIRO_BAIXA_COBRANCA_AGENDAMENTO_20260911.sql'
      - 'SUPABASE_SQL/SUPABASE_MIGRACAO_FINANCEIRO_BAIXA_COBRANCA_GUARD_20260911.sql'
      - 'tests/financeiro_pendencia_agendamento.contract.js'
      - '.github/workflows/financeiro-pendencia-contract.yml'
  push:
    branches: [main]
    paths:
      - 'src/finance/financeiro_agendamento-1.21.0.js'
      - 'styles/financeiro_agendamento-1.21.0.css'
      - 'index.html'
      - 'src/ui/screen_loader-1.25.0.js'
      - 'SUPABASE_SQL/SUPABASE_MIGRACAO_FINANCEIRO_BAIXA_COBRANCA_AGENDAMENTO_20260911.sql'
      - 'SUPABASE_SQL/SUPABASE_MIGRACAO_FINANCEIRO_BAIXA_COBRANCA_GUARD_20260911.sql'
      - 'tests/financeiro_pendencia_agendamento.contract.js'
      - '.github/workflows/financeiro-pendencia-contract.yml'

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax check
        run: |
          node --check src/finance/financeiro_agendamento-1.21.0.js
          node --check tests/financeiro_pendencia_agendamento.contract.js
      - name: Financeiro pending appointment contract
        run: node tests/financeiro_pendencia_agendamento.contract.js
      - name: Diff whitespace check
        run: git diff --check
