name: Fix residual AA contrast

on:
  push:
    paths:
      - '.github/workflows/fix-residual-contrast.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace residual low-contrast literals
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('design_screens.css')
          text = path.read_text(encoding='utf-8')
          replacements = {
              'color:#7E9290!important': 'color:var(--kds-muted)!important',
              'color:#C27A73!important': 'color:var(--kds-danger)!important',
              'color:#476067': 'color:var(--kds-text-secondary)'
          }
          changed = 0
          for old, new in replacements.items():
              count = text.count(old)
              if count:
                  text = text.replace(old, new)
                  changed += count
          if changed == 0:
              raise SystemExit('No residual contrast literals found')
          path.write_text(text, encoding='utf-8')
          print(f'Replaced {changed} residual color declarations')
          PY
      - name: Validate residual contrast cleanup
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path('design_screens.css').read_text(encoding='utf-8')
          for forbidden in ('color:#7E9290!important', 'color:#C27A73!important', 'color:#476067'):
              if forbidden in text:
                  raise SystemExit(f'Residual value remains: {forbidden}')
          for required in ('color:var(--kds-muted)!important', 'color:var(--kds-danger)!important', 'color:var(--kds-text-secondary)'):
              if required not in text:
                  raise SystemExit(f'Expected tokenized color missing: {required}')
          print('Residual contrast declarations tokenized')
          PY
      - name: Remove one-off workflow and commit
        run: |
          git rm .github/workflows/fix-residual-contrast.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add design_screens.css
          git commit -m 'Improve residual AA contrast and token usage'
          git push
