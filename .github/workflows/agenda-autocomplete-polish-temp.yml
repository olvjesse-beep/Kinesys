name: Agenda Autocomplete Polish Temp

on:
  push:
    branches: [fix/agenda-patient-autocomplete-polish]
    paths:
      - 'tools/agenda_autocomplete_polish_temp.py'
      - '.github/workflows/agenda-autocomplete-polish-temp.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/agenda-patient-autocomplete-polish
      - name: Patch Agenda autocomplete and modal polish
        run: python tools/agenda_autocomplete_polish_temp.py
      - name: Validate syntax and whitespace
        run: |
          node --check agenda-1.20.0.js
          git diff --check
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add agenda-1.20.0.js index.html design_agenda.css
          git commit -m "Fix Agenda patient autocomplete and modal polish" || exit 0
          git push origin HEAD:fix/agenda-patient-autocomplete-polish
