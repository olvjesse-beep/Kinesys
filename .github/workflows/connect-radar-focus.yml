name: One-time connect Radar clinical focus

on:
  push:
    paths:
      - '.github/workflows/connect-radar-focus.yml'

permissions:
  contents: write

jobs:
  connect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Connect Radar focus CSS last
        shell: bash
        run: |
          set -euo pipefail
          python -c "from pathlib import Path; p=Path('index.html'); s=p.read_text(encoding='utf-8'); marker='    <link rel=\"stylesheet\" href=\"clinical_reasoning_hma-3.0.0.css?v=20260910-r1\">\\n'; line='    <link rel=\"stylesheet\" href=\"radar_clinico_focus-3.0.0.css?v=20260910-r1\">\\n'; assert s.count(marker)==1, 'clinical reasoning CSS marker not unique'; s=s if 'radar_clinico_focus-3.0.0.css' in s else s.replace(marker,marker+line,1); p.write_text(s,encoding='utf-8')"
          test -s radar_clinico_focus-3.0.0.css
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Load Radar clinical focus layer last"
          git push
