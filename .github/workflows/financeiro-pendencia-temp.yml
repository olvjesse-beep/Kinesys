name: Financeiro Pendencia Temp

on:
  push:
    branches: [financeiro/settle-remove-pending-charge]
    paths:
      - 'tools/financeiro_pendencia_temp.py'
      - '.github/workflows/financeiro-pendencia-temp.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: financeiro/settle-remove-pending-charge
      - name: Patch Financeiro pending actions
        run: python tools/financeiro_pendencia_temp.py
      - name: Validate
        run: |
          node --check financeiro_agendamento-1.21.0.js
          git diff --check
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add financeiro_agendamento-1.21.0.js financeiro_agendamento-1.21.0.css index.html
          git commit -m "Add settle and remove pending finance actions" || exit 0
          git push origin HEAD:financeiro/settle-remove-pending-charge
