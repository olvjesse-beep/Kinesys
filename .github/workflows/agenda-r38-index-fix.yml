name: Agenda r39 index source fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/agenda-r38-index-fix.yml'

permissions:
  contents: write

jobs:
  patch-index:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 10
    defaults:
      run:
        shell: 'C:\PROGRA~1\Git\bin\bash.exe --noprofile --norc -eo pipefail {0}'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Update real Screen Loader URL in index
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = 'src/ui/screen_loader-1.25.0.js?v=20260910-phase4d-r1&agenda_edit=20260911-r3&agenda_compact=20260910-r2&agenda_patient=20260911-r1&runtime_cache=20260912-r1'
          new = 'src/ui/screen_loader-1.25.0.js?v=20260914-agenda-postgrid-r39'
          count = s.count(old)
          if count != 1:
              raise SystemExit(f'Expected exactly one old Screen Loader URL, found {count}')
          p.write_text(s.replace(old, new), encoding='utf-8')
          PY

      - name: Verify exact index change
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const s=fs.readFileSync('index.html','utf8');
          if(!s.includes('src/ui/screen_loader-1.25.0.js?v=20260914-agenda-postgrid-r39')) process.exit(1);
          if(s.includes('src/ui/screen_loader-1.25.0.js?v=20260910-phase4d-r1&agenda_edit=')) process.exit(1);
          console.log('Agenda Screen Loader primary URL is r39.');
          NODE

      - name: Commit index and remove one-shot workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git rm .github/workflows/agenda-r38-index-fix.yml
          git commit -m 'fix: update Agenda Screen Loader source URL r39'
          git push origin HEAD:main
