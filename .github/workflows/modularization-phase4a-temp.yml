name: Phase 4A temporary patch
on:
  push:
    branches: [performance/modularization-phase4a]
    paths:
      - '.github/workflows/modularization-phase4a-temp.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: performance/modularization-phase4a
      - name: Patch extracted menu block
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('script-1.18.0.js')
          s=p.read_text()
          start='/* =========================================================================='+'\n   CONTROLE DO MENU DROPDOWN (JS com atraso para melhor usabilidade)\n   ========================================================================== */'
          end='/* =========================================================================='+'\n   KINESYS - SCRIPT DEFINITIVO (ID ÚNICO E SEM DUPLICATAS) - PARTE 1 DE 4'
          i=s.find(start); j=s.find(end)
          if i<0 or j<0 or j<=i: raise SystemExit('menu block boundary not found')
          s=s[:i]+s[j:]
          p.write_text(s)

          p=Path('index.html'); s=p.read_text()
          needle='    <script defer src="script-1.18.0.js?v=20260910-hma-perf-r3&patient_self_service=20260910-r1&access_admin=20260910-r1&data_cache=20260911-r1"></script>'
          insert='    <script defer src="menu_dropdown-1.0.0.js?v=20260911-phase4a-r1"></script>\n'+needle
          if needle not in s: raise SystemExit('core script tag not found')
          s=s.replace(needle,insert,1)
          p.write_text(s)
          PY
          node --check menu_dropdown-1.0.0.js
          node --check script-1.18.0.js
          node --check tests/menu_dropdown_modularization.contract.js
          node tests/menu_dropdown_modularization.contract.js
          git diff --check
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add script-1.18.0.js index.html
          git commit -m "Extract menu dropdown from monolithic core" || exit 0
          git push origin HEAD:performance/modularization-phase4a
