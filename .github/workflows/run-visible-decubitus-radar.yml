name: Make shoulder decubitus visible in Radar
on:
  push:
    paths:
      - '.github/workflows/run-visible-decubitus-radar.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python .tmp_make_decubitus_visible.py
      - run: node --check script-1.18.0.js
      - run: git diff --check
      - run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('script-1.18.0.js').read_text(encoding='utf-8')
          assert "Comportamento ao deitar/dormir" in s
          assert "C2ISO1" in s and "C2ISO2" in s
          print('visible Radar guards OK')
          PY
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add script-1.18.0.js
          git commit -m "Show decubitus behavior explicitly in HMA Radar" || exit 0
          git push
