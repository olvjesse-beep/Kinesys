name: Patient Registration Modularization Contract

on:
  push:
    branches: [main]
    paths:
      - 'src/patient/patient_registration_core-1.0.0.js'
      - 'src/core/script-1.18.0.js'
      - 'src/patient/patient_chart_read_core-1.0.0.js'
      - 'index.html'
      - 'tests/patient_registration_modularization.contract.js'
      - '.github/workflows/patient-registration-modularization.yml'
  pull_request:
    paths:
      - 'src/patient/patient_registration_core-1.0.0.js'
      - 'src/core/script-1.18.0.js'
      - 'src/patient/patient_chart_read_core-1.0.0.js'
      - 'index.html'
      - 'tests/patient_registration_modularization.contract.js'
      - '.github/workflows/patient-registration-modularization.yml'

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Syntax
        run: |
          node --check src/patient/patient_registration_core-1.0.0.js
          node --check src/core/script-1.18.0.js
          node --check tests/patient_registration_modularization.contract.js
      - name: Registration boundary contract
        run: node tests/patient_registration_modularization.contract.js
