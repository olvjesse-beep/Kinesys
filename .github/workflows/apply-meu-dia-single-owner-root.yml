name: Apply Meu Dia single owner root fix

on:
  push:
    branches:
      - fix/meu-dia-single-owner-root
    paths:
      - '.github/workflows/apply-meu-dia-single-owner-root.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/meu-dia-single-owner-root
          fetch-depth: 0

      - name: Apply root fix
        run: python tools/apply_meu_dia_single_owner_root.py

      - name: Validate root fix
        run: |
          node tests/meu_dia_single_owner.contract.js
          node tests/fisio_home_patient_self_service.contract.js
          node --check src/core/operational_resume_refresh-1.0.0.js
          node --check src/home/home_fisioterapeuta_util-1.24.0.js
          node --check src/home/home_profissional_polish-1.0.0.js
          node --check src/core/script-1.18.0.js

      - name: Commit root fix and remove temporary tools
        run: |
          rm -f .github/workflows/apply-meu-dia-single-owner-root.yml
          rm -f tools/apply_meu_dia_single_owner_root.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(home): make Meu Dia single-owner at source'
          git push origin HEAD:fix/meu-dia-single-owner-root
