name: Self-hosted Workflow Migration Temp

on:
  push:
    branches:
      - chore/handoff-organization
    paths:
      - 'tools/selfhost_workflow_migrate_temp.js'
      - '.github/workflows/selfhost-workflow-migrate-temp.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/handoff-organization
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate Windows self-hosted workflow copies
        shell: cmd
        run: node tools\selfhost_workflow_migrate_temp.js
      - name: Commit generated copies outside workflow directory
        shell: cmd
        run: >-
          git config user.name "github-actions[bot]" &&
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com" &&
          git add tools/selfhost_workflow_output_temp &&
          git commit -m "CI: generate self-hosted workflow migration copies" &&
          git push origin HEAD:chore/handoff-organization
