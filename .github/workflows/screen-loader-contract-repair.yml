name: Screen Loader Contract Repair

on:
  push:
    branches: [fix/runtime-asset-cache-versioning]
    paths:
      - '.github/workflows/screen-loader-contract-repair.yml'

permissions:
  contents: write

defaults:
  run:
    shell: 'C:\PROGRA~1\Git\bin\bash.exe --noprofile --norc -eo pipefail {0}'

jobs:
  repair:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/runtime-asset-cache-versioning
          fetch-depth: 0
      - name: Update stale assertions
        run: |
          node <<'NODE'
          const fs=require('fs');
          const path='tests/screen_loader.contract.js';
          let s=fs.readFileSync(path,'utf8');
          const replacements=[
            ["assert.match(loader,/fetch\\(bundle\\.fragment/,'fragmento deve ser buscado somente sob demanda');", "assert.match(loader,/const fragmentUrl=urlAbsoluta\\(bundle\\.fragment\\)/,'fragmento deve receber a revisão global antes da busca');\nassert.match(loader,/fetch\\(fragmentUrl,\\{credentials:'same-origin',cache:'no-cache'\\}\\)/,'fragmento deve ser buscado somente sob demanda com revalidação');"],
            ["assert.match(loader,/reservado\\.href=src/,'Screen Loader deve ativar o href no placeholder em vez de anexar a folha ao fim do head');", "assert.match(loader,/reservado\\.href=href/,'Screen Loader deve ativar no placeholder a URL já versionada em vez de anexar a folha ao fim do head');"],
            ["assert.match(html,/src\\/ui\\/screen_loader-1\\.25\\.0\\.js\\?v=20260910-phase4d-r1/,'index deve invalidar o cache do Screen Loader na Fase 4D');", "assert.match(html,/src\\/ui\\/screen_loader-1\\.25\\.0\\.js\\?v=[^\\\"']+/,'index deve manter cache-buster explícito do Screen Loader');"]
          ];
          for(const [oldText,newText] of replacements){
            if(!s.includes(oldText))throw new Error('assertion not found: '+oldText);
            s=s.replace(oldText,newText);
          }
          fs.writeFileSync(path,s,'utf8');
          NODE
          node --check tests/screen_loader.contract.js
          node tests/screen_loader.contract.js
          rm .github/workflows/screen-loader-contract-repair.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/screen_loader.contract.js .github/workflows/screen-loader-contract-repair.yml
          git commit -m "test: align screen loader contract with cache revision" || exit 0
          git push origin HEAD:fix/runtime-asset-cache-versioning
