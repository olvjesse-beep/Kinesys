name: Data Loading Contract

on:
  pull_request:
    branches: [main]
    paths:
      - 'script-1.18.0.js'
      - 'tests/data_loading.contract.js'
      - '.github/workflows/data-loading-contract.yml'
  push:
    branches: [main]
    paths:
      - 'script-1.18.0.js'
      - 'tests/data_loading.contract.js'
      - '.github/workflows/data-loading-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    name: On-demand patient data contract
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: JavaScript syntax
        run: |
          node --check script-1.18.0.js
          node --check tests/data_loading.contract.js
      - name: Patient data loading contract
        run: node tests/data_loading.contract.js
