name: Runtime Asset Cache Repair

on:
  push:
    branches:
      - fix/runtime-asset-cache-versioning

permissions:
  contents: write

jobs:
  repair:
    if: ${{ !contains(github.event.head_commit.message, '[runtime-cache-repair]') }}
    runs-on: [self-hosted, Windows, X64]
    defaults:
      run:
        shell: 'C:\\PROGRA~1\\Git\\bin\\bash.exe --noprofile --norc -eo pipefail {0}'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/runtime-asset-cache-versioning
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply runtime cache repair
        run: |
          node <<'NODE'
          const fs = require('fs');

          function patch(path, changes) {
            let text = fs.readFileSync(path, 'utf8');
            for (const [from, to] of changes) {
              if (!text.includes(from)) throw new Error(`${path}: trecho esperado não encontrado: ${from}`);
              text = text.replace(from, to);
            }
            fs.writeFileSync(path, text, 'utf8');
          }

          patch('index.html', [
            [
              'src/ui/screen_loader-1.25.0.js?v=20260910-phase4d-r1&agenda_edit=20260911-r3&agenda_compact=20260910-r2&agenda_patient=20260911-r1',
              'src/ui/screen_loader-1.25.0.js?v=20260910-phase4d-r1&agenda_edit=20260911-r3&agenda_compact=20260910-r2&agenda_patient=20260911-r1&runtime_cache=20260912-r1'
            ],
            [
              'src/core/operational_resume_refresh-1.0.0.js?v=20260911-r1',
              'src/core/operational_resume_refresh-1.0.0.js?v=20260912-runtime-r3'
            ]
          ]);

          patch('src/ui/screen_loader-1.25.0.js', [
            [
              "const VERSION='1.25.4-phase4d';",
              "const VERSION='1.25.4-phase4d';\n    const ASSET_REVISION='20260912-runtime-r1';"
            ],
            [
              'function urlAbsoluta(src){return new URL(src,document.baseURI).href;}',
              "function urlAbsoluta(src){const url=new URL(src,document.baseURI);url.searchParams.set('ksv',ASSET_REVISION);return url.href;}"
            ],
            ['reservado.href=src;', 'reservado.href=href;'],
            ["link.rel='stylesheet';link.href=src;link.dataset.kinesysLazy='1';", "link.rel='stylesheet';link.href=href;link.dataset.kinesysLazy='1';"],
            ["script.src=src;script.async=false;script.dataset.kinesysLazy='1';", "script.src=href;script.async=false;script.dataset.kinesysLazy='1';"],
            [
              "const resposta=await fetch(bundle.fragment,{credentials:'same-origin',cache:'default'});",
              "const fragmentUrl=urlAbsoluta(bundle.fragment);\n            const resposta=await fetch(fragmentUrl,{credentials:'same-origin',cache:'no-cache'});"
            ]
          ]);

          patch('src/core/operational_resume_refresh-1.0.0.js', [
            ["const PROFESSIONAL_HOME_ASSET_VERSION='20260912-r2';", "const PROFESSIONAL_HOME_ASSET_VERSION='20260912-runtime-r3';"]
          ]);
          NODE

      - name: Validate cache contract
        run: |
          node --check src/ui/screen_loader-1.25.0.js
          node --check src/core/operational_resume_refresh-1.0.0.js
          node --check tests/runtime_asset_cache.contract.js
          node tests/runtime_asset_cache.contract.js
          git diff --check

      - name: Commit repair to branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/runtime-asset-cache-repair.yml
          git add index.html src/ui/screen_loader-1.25.0.js src/core/operational_resume_refresh-1.0.0.js tests/runtime_asset_cache.contract.js
          git commit -m "fix: centralize runtime cache invalidation [runtime-cache-repair]"
          git push origin HEAD:fix/runtime-asset-cache-versioning
