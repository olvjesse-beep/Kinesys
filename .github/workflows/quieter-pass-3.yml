name: KineSys quieter visual pass 3

on:
  push:
    paths:
      - '.github/workflows/quieter-pass-3.yml'

permissions:
  contents: write

jobs:
  quieter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply quieter source cleanup
        shell: bash
        run: |
          set -euo pipefail
          python .github/scripts/quieter_pass_3.py
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            design_base.css \
            design_tokens.css \
            design_typography.css \
            design_features.css \
            design_navigation.css \
            design_agenda.css \
            agenda_referencia-1.20.0.css \
            design_clinical.css \
            design_clinical_direction-1.17.0.css \
            design_utilities.css \
            financeiro_workspace-1.20.1.css \
            financeiro_lancamentos-1.20.0.css \
            login_access-1.18.0.css \
            design_evaluation_workspace-1.18.0.css \
            design_home_activity-1.18.5.css \
            design_evaluation_context-1.18.3.css
          git diff --cached --stat
          git commit -m "Quiet KineSys typography and operational surfaces"
          git push
