name: Professional Home Mobile Repair V2

on:
  push:
    branches: [fix/professional-home-mobile]
    paths:
      - '.github/workflows/professional-home-mobile-repair-v2.yml'

permissions:
  contents: write

defaults:
  run:
    shell: 'C:\PROGRA~1\Git\bin\bash.exe --noprofile --norc -eo pipefail {0}'

jobs:
  repair:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/professional-home-mobile
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply focused mobile fix
        run: |
          node <<'NODE'
          const fs=require('fs');
          function read(p){return fs.readFileSync(p,'utf8')}
          function write(p,s){fs.writeFileSync(p,s,'utf8')}
          function replaceOnce(s,oldText,newText,label){
            if(!s.includes(oldText))throw new Error('pattern not found: '+label);
            if(s.indexOf(oldText)!==s.lastIndexOf(oldText))throw new Error('pattern not unique: '+label);
            return s.replace(oldText,newText);
          }

          const dashboardPath='src/home/home_profissional_dashboard-1.0.0.js';
          let dashboard=read(dashboardPath);
          const recentLine="        const recente=document.getElementById('lista_pacientes_recentes')?.closest('.card');";
          dashboard=replaceOnce(dashboard,recentLine,
            "        const overview=home.querySelector('.ks-home-overview');\n        if(overview){overview.hidden=true;overview.dataset.profHomeLegacyHidden='1';}\n        const cadastro24h=home.querySelector('[data-ks-home-detail=\"recentes\"]');\n        if(cadastro24h){cadastro24h.hidden=true;cadastro24h.dataset.profHomeLegacyHidden='1';}\n"+recentLine,
            'dashboard legacy overview');
          write(dashboardPath,dashboard);

          const polishPath='src/home/home_profissional_polish-1.0.0.js';
          let polish=read(polishPath);
          const countLine="        const count=document.getElementById('ks_home_recent_count');";
          polish=replaceOnce(polish,countLine,
            "        const resumo=home.querySelector('[data-ks-home-detail=\"recentes\"]');\n        if(resumo){resumo.hidden=true;resumo.dataset.profHomeLegacyHidden='1';}\n        const overview=home.querySelector('.ks-home-overview');\n        if(overview){overview.hidden=true;overview.dataset.profHomeLegacyHidden='1';}\n"+countLine,
            'polish explicit recent summary');
          polish=replaceOnce(polish,"            const card=count.closest('.card,article,section');","            const card=count.closest('[data-ks-home-detail=\"recentes\"],.card,article');",'polish safe closest');
          polish=replaceOnce(polish,"                const card=titulo.closest('.card,article,section');","                const card=titulo.closest('[data-ks-home-detail=\"recentes\"],.card,article');",'polish safe title closest');
          write(polishPath,polish);

          const cssPath='styles/home_profissional_dashboard-1.0.0.css';
          let css=read(cssPath);
          const mobileBlock=`\n\n/* Home profissional — composição compacta para telefone. */\n.ks-prof-home-active .ks-home-overview{display:none!important}\n@media(max-width:620px){\n  .ks-prof-home-active{--ks-prof-gap:10px}\n  .ks-prof-home-active #ks_home_hero{display:none!important}\n  .ks-prof-home-active #card_painel_fisioterapeuta{margin-bottom:10px!important}\n  .ks-prof-home-active #card_painel_fisioterapeuta>.card-header{gap:9px!important;padding:12px 14px 7px!important}\n  .ks-prof-home-active #card_painel_fisioterapeuta .ks-fisio-header-actions{width:100%;gap:6px;justify-content:flex-start}\n  .ks-prof-home-active #card_painel_fisioterapeuta .ks-fisio-header-actions button{min-height:44px;padding:7px 10px}\n  .ks-prof-home-active #card_painel_fisioterapeuta #painel_fisio_resumo{padding:0 14px 8px!important}\n  .ks-prof-home-active #card_painel_fisioterapeuta .ks-fisio-painel-vazio{padding:13px 14px!important}\n  .ks-prof-home-grid{gap:10px}\n  .ks-prof-module-head{gap:12px;padding:14px 14px 7px}\n  .ks-prof-module-title{padding:14px 14px 8px}\n  .ks-prof-module-sub{padding:0 14px 14px}\n  .ks-prof-expand-panel{padding:6px 14px 11px}\n  .ks-prof-notification-list{padding:0 8px 8px}\n  .ks-prof-notification-item{padding:9px 6px}\n  .ks-prof-month-number{font-size:1.75rem}\n  .ks-prof-home-active #card_crm{margin-top:0}\n}\n`;
          if(!css.includes('/* Home profissional — composição compacta para telefone. */'))css+=mobileBlock;
          write(cssPath,css);

          const bootstrapPath='src/core/operational_resume_refresh-1.0.0.js';
          let bootstrap=read(bootstrapPath);
          bootstrap=replaceOnce(bootstrap,"const PROFESSIONAL_HOME_ASSET_VERSION='20260912-runtime-r3';","const PROFESSIONAL_HOME_ASSET_VERSION='20260912-home-mobile-r4';",'professional home asset version');
          write(bootstrapPath,bootstrap);

          const indexPath='index.html';
          let index=read(indexPath);
          index=replaceOnce(index,'src/core/operational_resume_refresh-1.0.0.js?v=20260912-runtime-r3','src/core/operational_resume_refresh-1.0.0.js?v=20260912-home-mobile-r4','operational resume cache bust');
          write(indexPath,index);

          const runtimeTestPath='tests/runtime_asset_cache.contract.js';
          let runtimeTest=read(runtimeTestPath);
          runtimeTest=replaceOnce(runtimeTest,'src/core/operational_resume_refresh-1.0.0.js?v=20260912-runtime-r3','src/core/operational_resume_refresh-1.0.0.js?v=20260912-home-mobile-r4','runtime test bootstrap version');
          runtimeTest=replaceOnce(runtimeTest,"const PROFESSIONAL_HOME_ASSET_VERSION='20260912-runtime-r3';","const PROFESSIONAL_HOME_ASSET_VERSION='20260912-home-mobile-r4';",'runtime test home version');
          write(runtimeTestPath,runtimeTest);

          const polishTestPath='tests/professional_home_polish.contract.js';
          let polishTest=read(polishTestPath);
          polishTest=replaceOnce(polishTest,
            "assert.match(polish,/ks_home_recent_count/,'polish deve remover o card legado de cadastros 24h');",
            "assert.match(polish,/data-ks-home-detail=\\\"recentes\\\"/,'polish deve remover o resumo estrutural de cadastros 24h');\nassert.match(polish,/ks-home-overview/,'polish deve retirar o overview legado inteiro da Home profissional');\nassert.doesNotMatch(polish,/closest\\('\\.card,article,section'\\)/,'polish não pode subir até a própria seção tela_home ao procurar o card legado');",
            'polish test recent card');
          polishTest=replaceOnce(polishTest,
            "assert.match(css,/:has\\(#ks_home_recent_count\\)/,'CSS deve ocultar defensivamente o card legado de cadastros');",
            "assert.match(css,/:has\\(#ks_home_recent_count\\)/,'CSS deve ocultar defensivamente o card legado de cadastros');\nassert.match(css,/\\.ks-prof-home-active \\.ks-home-overview\\{display:none!important\\}/,'Home profissional deve ocultar estruturalmente o overview operacional legado');\nassert.match(css,/@media\\(max-width:620px\\)[\\s\\S]*#ks_home_hero\\{display:none!important\\}/,'telefone deve remover o hero redundante e liberar espaço vertical');\nassert.match(css,/min-height:44px/,'ações móveis devem manter alvo de toque de pelo menos 44px');",
            'polish test mobile css');
          write(polishTestPath,polishTest);

          const focusTestPath='tests/professional_home_focus.contract.js';
          let focusTest=read(focusTestPath);
          focusTest=replaceOnce(focusTest,
            "assert.match(dashboard,/lista_pacientes_recentes/,'Home profissional deve retirar o card legado de recentes\\/24h');",
            "assert.match(dashboard,/lista_pacientes_recentes/,'Home profissional deve retirar o card legado de recentes\\/24h');\nassert.match(dashboard,/data-ks-home-detail=\\\"recentes\\\"/,'Home profissional deve retirar também o resumo de cadastros criado pelo Design System');",
            'focus test design system summary');
          write(focusTestPath,focusTest);
          NODE

          node --check src/home/home_profissional_dashboard-1.0.0.js
          node --check src/home/home_profissional_polish-1.0.0.js
          node --check src/core/operational_resume_refresh-1.0.0.js
          node --check tests/professional_home_polish.contract.js
          node --check tests/professional_home_focus.contract.js
          node --check tests/runtime_asset_cache.contract.js
          node tests/professional_home_polish.contract.js
          node tests/professional_home_focus.contract.js
          node tests/runtime_asset_cache.contract.js
          git diff --check

          rm .github/workflows/professional-home-mobile-repair.yml .github/workflows/professional-home-mobile-repair-v2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: compact professional home on mobile"
          git push origin HEAD:fix/professional-home-mobile
