name: Core Modularization Phase 4F Audit Temp

on:
  push:
    branches:
      - performance/core-modularization-phase4f
    paths:
      - .github/workflows/core-phase4f-audit-temp.yml

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Audit low-risk modularization candidates
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          lines=Path('script-1.18.0.js').read_text(encoding='utf-8').splitlines()
          print('LINES',len(lines))
          print('SECTION_HEADERS')
          for i,l in enumerate(lines,1):
              if re.search(r'/\*\s*=+|KINESYS v|PARTE \d',l):
                  s=l.strip()
                  if s:
                      print(i,s[:180])
          print('FUNCTION_BLOCKS')
          funcs=[]
          for i,l in enumerate(lines,1):
              m=re.match(r'\s*(?:async\s+)?function\s+([A-Za-z_$][A-Za-z0-9_$]*)\s*\(',l)
              if m: funcs.append((i,m.group(1)))
          for idx,(ln,name) in enumerate(funcs):
              end=(funcs[idx+1][0]-1) if idx+1<len(funcs) else len(lines)
              size=end-ln+1
              if size>=18:
                  block='\n'.join(lines[ln-1:end])
                  banned=re.search(r'auth|login|permiss|agenda|supabase|hma|motor|clinical|avaliacao|evolucao|relatorio|financeiro|equipe|usuarioLogado|pacienteAtualId',block,re.I)
                  if not banned:
                      print(f'{ln}-{end} {size:4d} {name}')
          print('STATE_DECLS_AFTER_2000')
          for i,l in enumerate(lines,1):
              if i<2000: continue
              if re.match(r'\s*(?:let|const|var)\s+[A-Za-z_$][A-Za-z0-9_$]*',l) and len(l)<180:
                  if not re.search(r'agenda|avali|hma|clinical|motor|finance|supabase|auth|login|permiss',l,re.I):
                      print(i,l.strip())
          PY
