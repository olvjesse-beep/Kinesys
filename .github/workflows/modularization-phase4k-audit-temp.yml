name: Modularization Phase 4K Audit Temp

on:
  push:
    branches: [performance/modularization-phase4k]
    paths:
      - '.github/workflows/modularization-phase4k-audit-temp.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Audit pre-registration module candidate
        shell: bash
        run: |
          set -euo pipefail
          awk '/\/\* ================= 3\. IDADE E FILTRO DE 2 HORAS/{f=1} /\/\* ==========================================================================/&&f{f=0} f' script-1.18.0.js > /tmp/sec3.js
          echo '=== SECTION 3 SIZE / FUNCTIONS ==='
          wc -l -c /tmp/sec3.js
          grep -nE '^(async )?function |^(const|let|var) [A-Za-z_$][A-Za-z0-9_$]*\s*=' /tmp/sec3.js || true
          echo '=== SECTION 3 DEPENDENCIES ==='
          for p in _supabase usuarioLogado usuarioEhMaster obterPacientesSalvos obterPacienteCompletoPorId idadeNumericaPaciente pacienteAtualId cargasPacienteAvaliacaoKineSys processarRadarEmTempoReal escapeHTML localStorage alternarCamposResponsavel; do count=$(grep -o "$p" /tmp/sec3.js 2>/dev/null | wc -l || true); echo "$p: $count"; done
          echo '=== REFERENCES IN CURRENT PRODUCTION FILES ==='
          grep -RInE 'calcularIdadeCadastro|removerAcentos|obterTextoExibicao|alternarFiltroPreCadastro|fecharBuscaPacientesPreCadastro|sincronizarBuscaPacientePreCadastro|selecionarPacienteBuscaPreCadastro|filtrarPacientesPreCadastro|navegarBuscaPacientesPreCadastro|atualizarSelectPacientesPreCadastro|carregarPacientePreCadastradoNaAvaliacao|exibindoTodosPreCadastros' --include='*.js' --include='*.html' . | grep -v '^./.git/' | grep -v '^./script-1.17' | grep -v '^./script.js:' | grep -v '^./supabase/' || true
          echo '=== TOP-LEVEL CALLS / DOM READY CONTEXT ==='
          grep -n -B4 -A5 -E 'atualizarSelectPacientesPreCadastro\(|carregarPacientePreCadastradoNaAvaliacao\(|filtrarPacientesPreCadastro\(|calcularIdadeCadastro\(' script-1.18.0.js | head -n 260 || true
          echo '=== INDEX INLINE HANDLERS ==='
          grep -nE 'calcularIdadeCadastro|alternarFiltroPreCadastro|filtrarPacientesPreCadastro|navegarBuscaPacientesPreCadastro|carregarPacientePreCadastradoNaAvaliacao|sincronizarBuscaPacientePreCadastro' index.html || true
