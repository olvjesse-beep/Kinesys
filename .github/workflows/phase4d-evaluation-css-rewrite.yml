name: Phase 4D Evaluation CSS lazy rewrite

on:
  push:
    branches: [performance/evaluation-css-phase4d]
    paths:
      - '.github/workflows/phase4d-evaluation-css-rewrite.yml'

permissions:
  contents: write

jobs:
  rewrite:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: performance/evaluation-css-phase4d
          fetch-depth: 0

      - name: Apply Phase 4D rewrite
        run: |
          python - <<'PY'
          from pathlib import Path
          index=Path('index.html')
          loader_path=Path('screen_loader-1.25.0.js')
          test_path=Path('tests/screen_loader.contract.js')
          html=index.read_text(encoding='utf-8')
          loader=loader_path.read_text(encoding='utf-8')
          test=test_path.read_text(encoding='utf-8')

          replacements={
            '<link rel="stylesheet" href="design_clinical.css?v=1.19.0-hma-layout-r14">':'<link rel="stylesheet" data-kinesys-lazy-href="design_clinical.css?v=1.19.0-hma-layout-r14">',
            '<link rel="stylesheet" href="design_clinical_direction-1.17.0.css">':'<link rel="stylesheet" data-kinesys-lazy-href="design_clinical_direction-1.17.0.css">',
            'screen_loader-1.25.0.js?v=20260910-phase4c-r1':'screen_loader-1.25.0.js?v=20260910-phase4d-r1'
          }
          for old,new in replacements.items():
              if html.count(old)!=1:
                  raise SystemExit(f'Expected exactly one HTML anchor: {old}')
              html=html.replace(old,new)

          if loader.count("const VERSION='1.25.3-phase4c';")!=1:
              raise SystemExit('Phase 4C Screen Loader version missing')
          loader=loader.replace("const VERSION='1.25.3-phase4c';","const VERSION='1.25.4-phase4d';")

          style_anchor="""            styles:Object.freeze([\n                'design_evaluation_workspace-1.18.0.css',"""
          style_replacement="""            styles:Object.freeze([\n                'design_clinical.css?v=1.19.0-hma-layout-r14',\n                'design_clinical_direction-1.17.0.css',\n                'design_evaluation_workspace-1.18.0.css',"""
          if loader.count(style_anchor)!=1:
              raise SystemExit('Evaluation style bundle anchor missing')
          loader=loader.replace(style_anchor,style_replacement)

          existing_block="""        const existente=Array.from(document.querySelectorAll('link[rel=\"stylesheet\"][href]')).find(link=>link.href===href);\n        if(existente){\n            const pronta=Promise.resolve(existente);\n            estilos.set(href,pronta);\n            return pronta;\n        }\n        const promessa=new Promise((resolve,reject)=>{"""
          placeholder_block="""        const existente=Array.from(document.querySelectorAll('link[rel=\"stylesheet\"][href]')).find(link=>link.href===href);\n        if(existente){\n            const pronta=Promise.resolve(existente);\n            estilos.set(href,pronta);\n            return pronta;\n        }\n        const reservado=Array.from(document.querySelectorAll('link[rel=\"stylesheet\"][data-kinesys-lazy-href]')).find(link=>{\n            const reservadoSrc=link.dataset.kinesysLazyHref||'';\n            return reservadoSrc&&urlAbsoluta(reservadoSrc)===href;\n        });\n        if(reservado){\n            const promessa=new Promise((resolve,reject)=>{\n                reservado.addEventListener('load',()=>resolve(reservado),{once:true});\n                reservado.addEventListener('error',()=>reject(new Error('Falha ao carregar estilo: '+src)),{once:true});\n                reservado.dataset.kinesysLazy='1';\n                reservado.href=src;\n            });\n            estilos.set(href,promessa);\n            promessa.catch(()=>estilos.delete(href));\n            return promessa;\n        }\n        const promessa=new Promise((resolve,reject)=>{"""
          if loader.count(existing_block)!=1:
              raise SystemExit('carregarEstilo anchor missing')
          loader=loader.replace(existing_block,placeholder_block)

          lazy_anchor="""const lazyStyles=[\n  'design_evaluation_workspace-1.18.0.css',"""
          lazy_replacement="""const lazyStyles=[\n  'design_clinical.css',\n  'design_clinical_direction-1.17.0.css',\n  'design_evaluation_workspace-1.18.0.css',"""
          if test.count(lazy_anchor)!=1:
              raise SystemExit('lazyStyles contract anchor missing')
          test=test.replace(lazy_anchor,lazy_replacement)

          old_version="assert.match(loader,/VERSION='1\\.25\\.3-phase4c'/,'Screen Loader deve identificar a Fase 4C');"
          new_version="assert.match(loader,/VERSION='1\\.25\\.4-phase4d'/,'Screen Loader deve identificar a Fase 4D');"
          if test.count(old_version)!=1:
              raise SystemExit('Phase 4C version assertion missing')
          test=test.replace(old_version,new_version)

          old_cache="assert.match(html,/screen_loader-1\\.25\\.0\\.js\\?v=20260910-phase4c-r1/,'index deve invalidar o cache do Screen Loader na Fase 4C');"
          new_cache="assert.match(html,/screen_loader-1\\.25\\.0\\.js\\?v=20260910-phase4d-r1/,'index deve invalidar o cache do Screen Loader na Fase 4D');"
          if test.count(old_cache)!=1:
              raise SystemExit('Phase 4C cache assertion missing')
          test=test.replace(old_cache,new_cache)

          marker="""for(const file of lazyStyles){\n  const escaped=file.replace(/[.*+?^${}()|[\\]\\\\]/g,'\\\\$&');\n  const eager=new RegExp(`<link[^>]+href=[\"'][^\"']*${escaped}[^\"']*[\"']`,'i');\n  assert.ok(!eager.test(html),`${file} não pode voltar ao CSS inicial`);\n  assert.ok(loader.includes(file),`${file} deve permanecer no bundle de estilos sob demanda`);\n  assert.ok(fs.existsSync(file),`${file} deve existir fisicamente no repositório`);\n}\n"""
          extra=r'''
const phase4dClinicalStyles=['design_clinical.css','design_clinical_direction-1.17.0.css'];
for(const file of phase4dClinicalStyles){
  const escaped=file.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
  assert.match(html,new RegExp(`<link[^>]+rel=["']stylesheet["'][^>]+data-kinesys-lazy-href=["'][^"']*${escaped}[^"']*["']`,'i'),`${file} deve manter placeholder na posição histórica do head`);
}
assert.ok(html.indexOf('data-kinesys-lazy-href="design_clinical.css')<html.indexOf('data-kinesys-lazy-href="design_clinical_direction-1.17.0.css'),'cascade clínico deve preservar design_clinical antes de clinical_direction');
assert.match(loader,/data-kinesys-lazy-href/,'Screen Loader deve reconhecer placeholders CSS lazy');
assert.match(loader,/reservado\.href=src/,'Screen Loader deve ativar o href no placeholder em vez de anexar a folha ao fim do head');
const phase4dCssDeferredBytes=phase4dClinicalStyles.reduce((total,file)=>total+fs.statSync(file).size,0);
assert.ok(phase4dCssDeferredBytes>=100000,`Fase 4D deve adiar pelo menos 100 KB brutos de CSS clínico; atual ${phase4dCssDeferredBytes} bytes`);
'''
          if test.count(marker)!=1:
              raise SystemExit('lazyStyles loop marker missing')
          test=test.replace(marker,marker+extra+'\n')

          old_log_start='console.log(`Screen Loader contract Phase 4C:'
          if old_log_start not in test:
              raise SystemExit('Phase 4C log marker missing')
          line=[x for x in test.splitlines() if x.startswith(old_log_start)][0]
          replacement="console.log(`Screen Loader contract Phase 4D: CSS clínico da Avaliação adia ${phase4dCssDeferredBytes} bytes brutos adicionais preservando cascade; bases clínicas lazy somam ${evaluationDatabaseDeferredBytes} bytes; Agenda continua lazy (${agendaLazyBytes} bytes).`);"
          test=test.replace(line,replacement)

          index.write_text(html,encoding='utf-8')
          loader_path.write_text(loader,encoding='utf-8')
          test_path.write_text(test,encoding='utf-8')
          PY

      - name: Validate Phase 4D
        run: |
          set -euo pipefail
          node --check screen_loader-1.25.0.js
          node tests/screen_loader.contract.js
          node tests/data_loading.contract.js
          node tests/operational_data_loading.contract.js
          node tests/clinical_reasoning_shoulder_elbow.regression.js
          git diff --check

      - name: Commit permanent Phase 4D code
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html screen_loader-1.25.0.js tests/screen_loader.contract.js
          git commit -m 'Lazy-load evaluation clinical CSS preserving cascade'
          git push origin HEAD:performance/evaluation-css-phase4d
