name: Phase 4D Evaluation CSS lazy rewrite

on:
  push:
    branches: [performance/evaluation-css-phase4d]
    paths:
      - '.github/workflows/phase4d-evaluation-css-rewrite.yml'

permissions:
  contents: write

jobs:
  rewrite:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: performance/evaluation-css-phase4d
          fetch-depth: 0

      - name: Extend lazy CSS quality contract
        run: python .github/scripts/phase4d_css_quality_contract.py

      - name: Validate Phase 4D
        run: |
          set -euo pipefail
          node --check screen_loader-1.25.0.js
          node tests/screen_loader.contract.js
          node tests/data_loading.contract.js
          node tests/operational_data_loading.contract.js
          node tests/clinical_reasoning_shoulder_elbow.regression.js
          git diff --check

      - name: Commit permanent Phase 4D quality contract
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/screen_loader.contract.js
          git commit -m 'Keep quality checks for lazy clinical CSS'
          git push origin HEAD:performance/evaluation-css-phase4d
