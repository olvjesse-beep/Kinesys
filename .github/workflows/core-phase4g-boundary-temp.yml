name: Core Modularization Phase 4G Boundary Temp

on:
  push:
    branches:
      - performance/core-modularization-phase4g
    paths:
      - .github/workflows/core-phase4g-boundary-temp.yml

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Audit CRM boundary
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          lines=Path('script-1.18.0.js').read_text(encoding='utf-8').splitlines()
          start=next(i for i,l in enumerate(lines,1) if 'MÓDULO CRM E RELACIONAMENTO' in l)-2
          end=next(i for i,l in enumerate(lines,1) if '13. MAPEAMENTO ANATÔMICO' in l)-1
          print('BOUNDARY',start,end)
          funcs=[]
          for i in range(start-1,end):
              m=re.match(r'\s*(?:async\s+)?function\s+([A-Za-z_$][A-Za-z0-9_$]*)\s*\(',lines[i])
              if m: funcs.append((i+1,m.group(1)))
          for ln,name in funcs:
              hits=[i+1 for i,l in enumerate(lines) if re.search(r'\b'+re.escape(name)+r'\b',l)]
              outside=[n for n in hits if n<start or n>end]
              print('FUNC',ln,name,'outside=',outside)
          for name in ['pacienteCRM']:
              hits=[i+1 for i,l in enumerate(lines) if re.search(r'\b'+re.escape(name)+r'\b',l)]
              outside=[n for n in hits if n<start or n>end]
              print('STATE',name,'outside=',outside)
          PY
