name: Retry KineSys quieter visual pass 3

on:
  push:
    paths:
      - '.github/workflows/quieter-pass-3-retry.yml'

permissions:
  contents: write

jobs:
  quieter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch scoped guard and apply quieter pass 3
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('.github/scripts/quieter_pass_3.py')
          text = p.read_text(encoding='utf-8')
          old = '''if clinical.count("border:1px solid transparent!important;") != 1:
              raise SystemExit("Patient strip transparent border guard failed")
          clinical = clinical.replace("border:1px solid transparent!important;", "border:0!important;")'''
          new = '''patient_strip_fields = """#tela_avaliacao .patient-strip-cards .input-group,
          #tela_avaliacao .patient-strip-cards .patient-plain-field,
          #tela_avaliacao .patient-strip-cards .input-group.patient-plain-field{
              margin:0!important;
              padding:0!important;
              border:1px solid transparent!important;
              border-radius:0!important;
              background:transparent!important;
              box-shadow:none!important;
              outline:0!important;
          }"""
          patient_strip_fields_new = patient_strip_fields.replace("border:1px solid transparent!important;", "border:0!important;")
          if clinical.count(patient_strip_fields) != 1:
              raise SystemExit(f"Patient strip scoped guard failed: {clinical.count(patient_strip_fields)}")
          clinical = clinical.replace(patient_strip_fields, patient_strip_fields_new)'''
          if text.count(old) != 1:
              raise SystemExit(f'Guard patch expected 1 occurrence, found {text.count(old)}')
          p.write_text(text.replace(old, new), encoding='utf-8')
          PY

          python .github/scripts/quieter_pass_3.py
          python - <<'PY'
          from pathlib import Path
          targets = [
              'design_base.css',
              'design_tokens.css',
              'design_typography.css',
              'design_features.css',
              'design_navigation.css',
              'design_agenda.css',
              'agenda_referencia-1.20.0.css',
              'design_clinical.css',
              'design_clinical_direction-1.17.0.css',
              'design_utilities.css',
              'financeiro_workspace-1.20.1.css',
              'financeiro_lancamentos-1.20.0.css',
              'login_access-1.18.0.css',
              'design_evaluation_workspace-1.18.0.css',
              'design_home_activity-1.18.5.css',
              'design_evaluation_context-1.18.3.css',
          ]
          for name in targets:
              p = Path(name)
              text = p.read_text(encoding='utf-8')
              cleaned = '\n'.join(line.rstrip() for line in text.split('\n'))
              p.write_text(cleaned, encoding='utf-8')
          PY
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            design_base.css \
            design_tokens.css \
            design_typography.css \
            design_features.css \
            design_navigation.css \
            design_agenda.css \
            agenda_referencia-1.20.0.css \
            design_clinical.css \
            design_clinical_direction-1.17.0.css \
            design_utilities.css \
            financeiro_workspace-1.20.1.css \
            financeiro_lancamentos-1.20.0.css \
            login_access-1.18.0.css \
            design_evaluation_workspace-1.18.0.css \
            design_home_activity-1.18.5.css \
            design_evaluation_context-1.18.3.css
          git diff --cached --stat
          git commit -m "Quiet KineSys typography and operational surfaces"
          git push
