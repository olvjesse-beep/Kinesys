name: One-time physiotherapist day workspace connector

on:
  push:
    paths:
      - '.github/workflows/connect-physio-day-workspace.yml'

permissions:
  contents: write

jobs:
  connect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Connect runtime assets
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          css_anchor='    <link rel="stylesheet" href="financeiro_alignment.css?v=20260909-align-r4">'
          css_new=css_anchor+'\n    <link rel="stylesheet" href="home_fisioterapeuta_util-1.23.0.css?v=20260909-r1">'
          if s.count(css_anchor)!=1:
              raise SystemExit(f'CSS anchor count={s.count(css_anchor)}')
          s=s.replace(css_anchor,css_new)
          js_anchor='    <script defer src="ui_experience.js?v=20260909-ux-r1"></script>'
          js_new=js_anchor+'\n    <script defer src="home_fisioterapeuta_util-1.23.0.js?v=20260909-r1"></script>'
          if s.count(js_anchor)!=1:
              raise SystemExit(f'JS anchor count={s.count(js_anchor)}')
          s=s.replace(js_anchor,js_new)
          p.write_text(s,encoding='utf-8')
          PY
          node --check home_fisioterapeuta_util-1.23.0.js
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Connect physiotherapist daily clinical workspace"
          git push
