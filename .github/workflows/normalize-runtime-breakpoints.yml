name: Normalize runtime breakpoints

on:
  push:
    paths:
      - '.github/workflows/normalize-runtime-breakpoints.yml'

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Normalize module breakpoints to KDS contract
        run: |
          python - <<'PY'
          from pathlib import Path

          replacements = {
              'financeiro_workspace-1.20.1.css': [('@media(max-width:1050px)', '@media(max-width:1100px)')],
              'financeiro_lancamentos-1.20.0.css': [
                  ('@media(max-width:950px)', '@media(max-width:980px)'),
                  ('@media(max-width:650px)', '@media(max-width:700px)')
              ],
              'agenda_referencia-1.20.0.css': [('@media(max-width:600px)', '@media(max-width:620px)')],
              'design_clinical_direction-1.17.0.css': [('@media(max-width:600px)', '@media(max-width:620px)')],
              'design_evaluation_workspace-1.18.0.css': [('@media(max-width:540px)', '@media(max-width:560px)')],
              'login_access-1.18.0.css': [('@media(max-width:360px)', '@media(max-width:430px)')],
              'design_home_activity-1.18.5.css': [
                  ('@media(max-width:600px)', '@media(max-width:620px)'),
                  ('@media(max-width:800px)', '@media(max-width:820px)')
              ],
              'design_evaluation_context-1.18.3.css': [('@media(max-width:600px)', '@media(max-width:620px)')]
          }

          total = 0
          for filename, pairs in replacements.items():
              path = Path(filename)
              text = path.read_text(encoding='utf-8')
              for old, new in pairs:
                  count = text.count(old)
                  if count != 1:
                      raise SystemExit(f'{filename}: expected 1 occurrence of {old}, found {count}')
                  text = text.replace(old, new, 1)
                  total += 1
              path.write_text(text, encoding='utf-8')
          print(f'Normalized {total} breakpoint declarations')
          PY
      - name: Validate runtime breakpoint contract
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          html = Path('index.html').read_text(encoding='utf-8')
          hrefs = re.findall(r'<link[^>]+rel="stylesheet"[^>]+href="([^"]+)"', html, re.I)
          allowed = {1280,1180,1100,980,900,820,760,700,620,560,520,430}
          failures = []
          for href in hrefs:
              p = Path(href.split('?',1)[0])
              if not p.exists() or p.suffix.lower() != '.css':
                  continue
              text = re.sub(r'/\*.*?\*/','',p.read_text(encoding='utf-8'),flags=re.S)
              for m in re.finditer(r'@media[^\{]*\((max|min)-width\s*:\s*([0-9]+)px\)', text, re.I):
                  kind = m.group(1).lower()
                  value = int(m.group(2))
                  if value not in allowed and not (kind == 'min' and value == 701):
                      failures.append(f'{p}:{value}px:{m.group(0).strip()}')
          if failures:
              raise SystemExit('Non-contract breakpoints remain:\n' + '\n'.join(failures))
          print('NONCONTRACT_BREAKPOINT_COUNT=0')
          PY
      - name: Validate JavaScript syntax
        run: |
          find . -type f -name '*.js' -not -path './.git/*' -print0 | xargs -0 -n1 node --check
      - name: Remove one-off workflow and commit
        run: |
          git rm .github/workflows/normalize-runtime-breakpoints.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add '*.css'
          git commit -m 'Normalize runtime breakpoints to KDS contract'
          git push
