name: Apply Upper Limb Hardening

on:
  push:
    branches: ['audit/clinical-upper-limb-hardening']
    paths:
      - 'tools/apply_upper_limb_hardening.js'
      - '.github/workflows/apply-upper-limb-hardening.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: audit/clinical-upper-limb-hardening
          fetch-depth: 0

      - name: Apply exact hardening patch
        run: node tools/apply_upper_limb_hardening.js

      - name: JavaScript syntax
        run: |
          node --check clinical_reasoning_shoulder-3.1.0.js
          node --check clinical_reasoning_elbow-3.1.0.js
          node --check clinical_reasoning_wrist-3.1.0.js
          node --check screen_loader-1.25.0.js
          node --check tests/clinical_reasoning_shoulder_elbow.regression.js
          node --check tests/clinical_reasoning_wrist.regression.js
          node --check tests/clinical_reasoning_upper_limb.adversarial.js

      - name: Existing shoulder and elbow regression
        run: node tests/clinical_reasoning_shoulder_elbow.regression.js

      - name: Existing wrist and hand regression
        run: node tests/clinical_reasoning_wrist.regression.js

      - name: Adversarial upper-limb audit
        run: node tests/clinical_reasoning_upper_limb.adversarial.js

      - name: Diff integrity
        run: git diff --check

      - name: Commit validated engine changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add clinical_reasoning_shoulder-3.1.0.js clinical_reasoning_elbow-3.1.0.js clinical_reasoning_wrist-3.1.0.js screen_loader-1.25.0.js
          if git diff --cached --quiet; then
            echo 'No engine changes to commit.'
            exit 0
          fi
          git commit -m 'Harden upper-limb clinical differential reasoning'
          git push origin HEAD:audit/clinical-upper-limb-hardening
