name: Document Timeline Phase 4H Temp

on:
  push:
    branches: [performance/core-modularization-phase4h]
    paths:
      - 'tools/document_timeline_phase4h_temp.py'
      - '.github/workflows/document-timeline-phase4h-temp.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: performance/core-modularization-phase4h
      - name: Apply Phase 4H patch
        run: python tools/document_timeline_phase4h_temp.py
      - name: Validate
        run: |
          node --check document_timeline_core-1.0.0.js
          node --check script-1.18.0.js
          node --check tests/document_timeline_modularization.contract.js
          node tests/document_timeline_modularization.contract.js
          git diff --check
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add script-1.18.0.js index.html
          git commit -m "Extract document timeline core for Phase 4H" || exit 0
          git push origin HEAD:performance/core-modularization-phase4h
