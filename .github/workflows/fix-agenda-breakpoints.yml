name: Agenda Breakpoint Contract Fix

on:
  push:
    branches:
      - fix/login-agenda-compact-home-4h

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/login-agenda-compact-home-4h
          fetch-depth: 0
      - name: Apply breakpoint fix
        run: python .github/scripts/fix_agenda_breakpoints.py
      - name: Validate agenda contracts
        shell: bash
        run: |
          set -euo pipefail
          node --check agenda-1.20.0.js
          node --check tests/access_agenda_home4h.contract.js
          node tests/access_agenda_home4h.contract.js
          node tests/agenda_editar_atendimento.contract.js
          node tests/screen_loader.contract.js
          git diff --check
      - name: Commit breakpoint fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add design_agenda.css
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Align agenda breakpoints with KDS contract"
          git push origin HEAD:fix/login-agenda-compact-home-4h
