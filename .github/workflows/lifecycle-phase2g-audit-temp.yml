name: Lifecycle Phase 2G Audit Temp

on:
  push:
    branches:
      - performance/lifecycle-phase2g

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inventory lifecycle work
        shell: bash
        run: |
          echo '=== active references: ui_experience ==='
          grep -RIn --exclude-dir=node_modules --exclude-dir=.git --exclude='ui_experience.js' 'ui_experience.js' . || true
          echo '=== active references: financeiro_lancamentos ==='
          grep -RIn --exclude-dir=node_modules --exclude-dir=.git --exclude='financeiro_lancamentos-1.20.0.js' 'financeiro_lancamentos-1.20.0.js' . || true
          echo '=== active references: avaliacao_experiencia ==='
          grep -RIn --exclude-dir=node_modules --exclude-dir=.git --exclude='avaliacao_experiencia-1.22.0.js' 'avaliacao_experiencia-1.22.0.js' . || true
          echo '=== active references: evaluation_context_panels ==='
          grep -RIn --exclude-dir=node_modules --exclude-dir=.git --exclude='evaluation_context_panels-1.18.3.js' 'evaluation_context_panels-1.18.3.js' . || true
          echo '=== active references: design_system-1.20.1 ==='
          grep -RIn --exclude-dir=node_modules --exclude-dir=.git --exclude='design_system-1.20.1.js' 'design_system-1.20.1.js' . || true
          echo '=== active references: agenda_notificacoes_core ==='
          grep -RIn --exclude-dir=node_modules --exclude-dir=.git --exclude='agenda_notificacoes_core-1.20.1.js' 'agenda_notificacoes_core-1.20.1.js' . || true
