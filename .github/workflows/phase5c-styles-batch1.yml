name: Phase 5C Styles Batch 1 Contract

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'design_polish.css'
      - 'design_experience.css'
      - 'styles/design_polish.css'
      - 'styles/design_experience.css'
      - 'DESIGN.md'
      - 'PRODUCT.md'
      - 'tests/phase5c_styles_batch1.contract.js'
      - '.github/workflows/phase5c-styles-batch1.yml'
  pull_request:
    branches: [main]
    paths:
      - 'index.html'
      - 'design_polish.css'
      - 'design_experience.css'
      - 'styles/design_polish.css'
      - 'styles/design_experience.css'
      - 'DESIGN.md'
      - 'PRODUCT.md'
      - 'tests/phase5c_styles_batch1.contract.js'
      - '.github/workflows/phase5c-styles-batch1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: [self-hosted, Windows, X64]
    defaults:
      run:
        shell: 'C:\PROGRA~1\Git\bin\bash.exe --noprofile --norc -eo pipefail {0}'
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Contract syntax
        run: node --check tests/phase5c_styles_batch1.contract.js

      - name: Phase 5C styles batch 1 contract
        run: node tests/phase5c_styles_batch1.contract.js
