name: Phase 5A Batch 4 Preflight Temp

on:
  push:
    branches:
      - cleanup/phase5a-home-legacy-batch4

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prove obsolete Home versions are outside runtime
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';

          const targets=[
            'home_detalhes-1.18.2.js',
            'home_detalhes-1.18.4.js',
            'home_fisioterapeuta_util-1.23.0.js',
            'home_fisioterapeuta_util-1.23.0.css',
            'design_home_activity-1.18.2.css',
            'design_home_activity-1.18.4.css'
          ];
          const successors=[
            'home_detalhes-1.18.5.js',
            'home_fisioterapeuta_util-1.24.0.js',
            'home_fisioterapeuta_util-1.24.0.css',
            'design_home_activity-1.18.5.css'
          ];
          for(const target of [...targets,...successors]) if(!fs.existsSync(target)) throw new Error(`Expected file missing: ${target}`);

          const html=fs.readFileSync('index.html','utf8');
          const strip=x=>String(x||'').split('?')[0].split('#')[0].replace(/^\//,'');
          const local=x=>x&&!/^(?:https?:|data:|\/\/)/i.test(x);
          const roots=[
            ...[...html.matchAll(/<script\b[^>]*\bsrc=["']([^"']+)["'][^>]*>/gi)].map(m=>strip(m[1])),
            ...[...html.matchAll(/<link\b[^>]*\bhref=["']([^"']+)["'][^>]*>/gi)].map(m=>strip(m[1]))
          ].filter(local);
          const reachable=new Set(roots),queue=roots.filter(x=>/\.(?:js|css)$/i.test(x));
          const refPattern=/["'`]([^"'`\n]+?\.(?:js|css))(?:\?[^"'`\n]*)?["'`]/gi;
          while(queue.length){const current=queue.shift();if(!fs.existsSync(current))continue;let txt='';try{txt=fs.readFileSync(current,'utf8');}catch{continue;}for(const m of txt.matchAll(refPattern)){const raw=strip(m[1]);if(!local(raw))continue;const rel=path.normalize(path.join(path.dirname(current),raw)).replace(/\\/g,'/').replace(/^\.\//,'');const found=fs.existsSync(rel)?rel:(fs.existsSync(raw)?raw:null);if(found&&!reachable.has(found)){reachable.add(found);queue.push(found);}}}
          for(const successor of successors) if(!reachable.has(successor)) throw new Error(`${successor} must remain runtime reachable`);

          const textExt=/\.(?:html?|js|mjs|cjs|css|json|md|ya?ml|toml|sql|txt)$/i;
          function walk(dir,out=[]){for(const ent of fs.readdirSync(dir,{withFileTypes:true})){if(['.git','node_modules'].includes(ent.name))continue;const p=path.join(dir,ent.name);if(ent.isDirectory())walk(p,out);else if(textExt.test(ent.name))out.push(p.replace(/^\.\//,''));}return out;}
          const textFiles=walk('.');
          const allowed=new Set(['docs/PHASE4_CLOSEOUT.md','.github/workflows/phase5a-batch4-preflight-temp.yml']);
          for(const target of targets){
            if(reachable.has(target)) throw new Error(`${target} is runtime reachable`);
            const refs=[];
            for(const file of textFiles){if(file===target||allowed.has(file))continue;let txt='';try{txt=fs.readFileSync(file,'utf8');}catch{continue;}if(txt.includes(target))refs.push(file);}
            console.log(`${target}: runtime_reachable=false unexpected_refs=${refs.length}${refs.length?' -> '+refs.join(', '):''}`);
            if(refs.length) throw new Error(`${target} still has unexpected references`);
          }
          for(const successor of successors) console.log(`${successor}: runtime_reachable=true`);
          console.log(`runtime_reachable_total=${reachable.size}`);
          NODE
