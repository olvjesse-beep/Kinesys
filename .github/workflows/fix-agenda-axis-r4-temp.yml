name: Agenda Axis R4 Temp

on:
  push:
    branches:
      - fix/agenda-hour-axis-r4

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/agenda-hour-axis-r4
          fetch-depth: 0
      - name: Apply visual fix
        run: python .github/scripts/fix_agenda_axis_r4.py
      - name: Validate
        shell: bash
        run: |
          set -euo pipefail
          node --check agenda-1.20.0.js
          node tests/access_agenda_home4h.contract.js
          node tests/agenda_editar_atendimento.contract.js
          node tests/screen_loader.contract.js
          grep -q 'AGENDA AXIS + CLEAN GRID FIX R4' design_agenda.css
          grep -q -- '--kds-agenda-hour-axis-width:70px' design_agenda.css
          grep -q 'design_agenda.css?v=20260910-compact-r4' index.html
          git diff --check
      - name: Commit permanent files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add design_agenda.css index.html
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Fix Agenda hour axis and remove subslot dividers"
          git push origin HEAD:fix/agenda-hour-axis-r4
