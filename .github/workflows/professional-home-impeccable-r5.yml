name: Professional Home Impeccable R5

on:
  push:
    branches: [polish/professional-home-mobile-impeccable]
    paths:
      - '.github/workflows/professional-home-impeccable-r5.yml'

permissions:
  contents: write

defaults:
  run:
    shell: 'C:\PROGRA~1\Git\bin\bash.exe --noprofile --norc -eo pipefail {0}'

jobs:
  finalize:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: polish/professional-home-mobile-impeccable
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Finalize mobile polish and contracts
        run: |
          node <<'NODE'
          const fs=require('fs');
          function replaceOnce(path,from,to,label){
            let s=fs.readFileSync(path,'utf8');
            if(!s.includes(from)) throw new Error('pattern not found: '+label);
            if(s.indexOf(from)!==s.lastIndexOf(from)) throw new Error('pattern not unique: '+label);
            fs.writeFileSync(path,s.replace(from,to),'utf8');
          }

          replaceOnce(
            'index.html',
            'src/core/operational_resume_refresh-1.0.0.js?v=20260912-home-mobile-r4',
            'src/core/operational_resume_refresh-1.0.0.js?v=20260912-home-mobile-r5',
            'index operational resume revision'
          );

          replaceOnce(
            'tests/runtime_asset_cache.contract.js',
            'src/core/operational_resume_refresh-1.0.0.js?v=20260912-home-mobile-r4',
            'src/core/operational_resume_refresh-1.0.0.js?v=20260912-home-mobile-r5',
            'runtime index revision'
          );
          replaceOnce(
            'tests/runtime_asset_cache.contract.js',
            "const PROFESSIONAL_HOME_ASSET_VERSION='20260912-home-mobile-r4';",
            "const PROFESSIONAL_HOME_ASSET_VERSION='20260912-home-mobile-r5';",
            'runtime professional asset revision'
          );

          const polishPath='tests/professional_home_polish.contract.js';
          let polish=fs.readFileSync(polishPath,'utf8');
          const anchor="assert.match(css,/ks-prof-greeting-clean/,'CSS deve remover contorno indevido da saudação');";
          if(!polish.includes(anchor)) throw new Error('polish contract anchor not found');
          const extra=`\nassert.match(css,/\\[data-ks-fisio-agenda\\]/,'mobile deve destacar Agenda como ação principal do Meu dia clínico');\nassert.match(css,/#ks_prof_pendencias_badge[\\s\\S]*position:absolute/,'badge de pendências deve funcionar como indicador sobreposto no mobile');\nassert.match(css,/\\.ks-prof-empty-state\\.compact[\\s\\S]*text-align:left!important/,'estado vazio de notificações deve ser compacto e alinhado à leitura mobile');\nassert.match(css,/@media\\(max-width:430px\\)/,'telefone estreito deve ter refinamento responsivo dedicado');`;
          if(!polish.includes('mobile deve destacar Agenda como ação principal')) polish=polish.replace(anchor,anchor+extra);
          fs.writeFileSync(polishPath,polish,'utf8');
          NODE

          node --check src/core/operational_resume_refresh-1.0.0.js
          node --check tests/runtime_asset_cache.contract.js
          node --check tests/professional_home_polish.contract.js
          node tests/runtime_asset_cache.contract.js
          node tests/professional_home_polish.contract.js
          node tests/professional_home_focus.contract.js
          git diff --check

          rm .github/workflows/professional-home-impeccable-r5.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html tests/runtime_asset_cache.contract.js tests/professional_home_polish.contract.js .github/workflows/professional-home-impeccable-r5.yml
          git commit -m "test: lock mobile home polish contract"
          git push origin HEAD:polish/professional-home-mobile-impeccable
