name: Phase 4O Team Management Temp

on:
  push:
    branches:
      - performance/team-management-phase4o
    paths:
      - '.github/workflows/phase4o-team-management-temp.yml'
      - '.github/scripts/phase4o_team_management.py'
      - '.github/scripts/phase4o_contract_fix.py'

permissions:
  contents: write

jobs:
  modularize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: performance/team-management-phase4o
          fetch-depth: 0

      - name: Apply exact extraction
        run: python .github/scripts/phase4o_team_management.py

      - name: Adjust Phase 4O contract assertion
        run: python .github/scripts/phase4o_contract_fix.py

      - name: Validate Phase 4O
        shell: bash
        run: |
          set -euo pipefail
          node --check team_management_core-1.0.0.js
          node --check script-1.18.0.js
          node --check tests/team_management_modularization.contract.js
          node tests/team_management_modularization.contract.js
          node tests/access_management.contract.js
          node tests/screen_loader.contract.js
          node tests/agenda_editar_atendimento.contract.js
          node tests/fisio_home_patient_self_service.contract.js
          node tests/data_loading.contract.js
          node tests/patient_registration_modularization.contract.js
          node tests/patient_deletion_modularization.contract.js
          node tests/clinical_reasoning_shoulder_elbow.regression.js
          node tests/clinical_reasoning_cervical.regression.js
          git diff --check
          wc -c script-1.18.0.js team_management_core-1.0.0.js

      - name: Commit permanent Phase 4O files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add script-1.18.0.js index.html team_management_core-1.0.0.js tests
          if git diff --cached --quiet; then
            echo 'No permanent changes.'
            exit 0
          fi
          git commit -m 'Modularize team management workflow'
          git push origin HEAD:performance/team-management-phase4o
