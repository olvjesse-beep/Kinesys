name: Lifecycle Phase 2D Audit Temp

on:
  push:
    branches:
      - performance/lifecycle-phase2d

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: performance/lifecycle-phase2d
      - name: Inventory repository lifecycle workloads
        run: |
          echo '=== JS setInterval ==='
          grep -RIn --include='*.js' --exclude-dir=node_modules --exclude-dir=.git 'setInterval' . || true
          echo '=== JS MutationObserver ==='
          grep -RIn --include='*.js' --exclude-dir=node_modules --exclude-dir=.git 'MutationObserver' . || true
          echo '=== JS ResizeObserver ==='
          grep -RIn --include='*.js' --exclude-dir=node_modules --exclude-dir=.git 'ResizeObserver' . || true
          echo '=== JS addEventListener visibility/focus/online/resize ==='
          grep -RIn --include='*.js' --exclude-dir=node_modules --exclude-dir=.git -E "addEventListener\(['\"](visibilitychange|focus|online|resize)" . || true
