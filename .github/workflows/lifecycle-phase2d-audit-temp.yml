name: Lifecycle Phase 2D Audit Temp

on:
  push:
    branches:
      - performance/lifecycle-phase2d

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: performance/lifecycle-phase2d
          fetch-depth: 0
      - name: Apply Design System lifecycle patch
        run: |
          node <<'NODE'
          const fs=require('fs');
          const path='design_system-1.20.1.js';
          let s=fs.readFileSync(path,'utf8');
          const old=`    // Atualiza barra lateral quando o login muda sem recarregar a página.\n    const poll=setInterval(()=>{const role=document.getElementById('ks_sidebar_role');if(role&&((typeof usuarioLogado!=='undefined')?usuarioLogado:null)&&typeof window.rotuloPerfil==='function')role.textContent=window.rotuloPerfil(((typeof usuarioLogado!=='undefined')?usuarioLogado:null).tipo);escutarSeletoresPaciente();atualizarGruposNav();},1200);\n    window.addEventListener('beforeunload',()=>clearInterval(poll));`;
          const replacement=`    // Reage ao lifecycle oficial em vez de manter polling global permanente.\n    function sincronizarDesignDinamico(){\n        const role=document.getElementById('ks_sidebar_role');\n        const usuario=(typeof usuarioLogado!=='undefined')?usuarioLogado:null;\n        if(role&&usuario&&typeof window.rotuloPerfil==='function') role.textContent=window.rotuloPerfil(usuario.tipo);\n        escutarSeletoresPaciente();\n        atualizarGruposNav();\n    }\n    document.addEventListener('kinesys:tela-ativada',sincronizarDesignDinamico);\n    document.addEventListener('kinesys:tela-dom-pronta',sincronizarDesignDinamico);`;
          if(!s.includes(old)) throw new Error('Polling ativo do Design System não encontrado');
          s=s.replace(old,replacement);
          fs.writeFileSync(path,s);

          const test=`const assert=require('assert');\nconst fs=require('fs');\nconst index=fs.readFileSync('index.html','utf8');\nconst ds=fs.readFileSync('design_system-1.20.1.js','utf8');\n\nassert.match(index,/design_system-1\\.20\\.1\\.js/,'index deve carregar a versão ativa do Design System');\nassert.doesNotMatch(ds,/const poll=setInterval\\(/,'Design System ativo não deve manter polling global de 1,2 s');\nassert.doesNotMatch(ds,/beforeunload[^\\n]*clearInterval\\(poll\\)/,'cleanup do polling antigo não deve permanecer');\nassert.match(ds,/function sincronizarDesignDinamico\\(\\)/,'deve existir sincronização dinâmica orientada a eventos');\nassert.match(ds,/document\\.addEventListener\\('kinesys:tela-ativada',sincronizarDesignDinamico\\)/,'deve reagir à ativação de telas');\nassert.match(ds,/document\\.addEventListener\\('kinesys:tela-dom-pronta',sincronizarDesignDinamico\\)/,'deve reagir a DOM lazy pronto');\nassert.match(ds,/escutarSeletoresPaciente\\(\\);[\\s\\S]*atualizarGruposNav\\(\\);/,'deve preservar seleção de paciente e grupos de navegação');\nassert.match(ds,/ks_sidebar_role[\\s\\S]*rotuloPerfil/,'deve preservar atualização do rótulo de perfil');\nconsole.log('Design System lifecycle contract OK');\n`;
          fs.writeFileSync('tests/design_system_lifecycle.contract.js',test);
          NODE
      - name: Remove temporary workflow
        run: rm .github/workflows/lifecycle-phase2d-audit-temp.yml
      - name: Validate
        run: |
          node --check design_system-1.20.1.js
          node --check tests/design_system_lifecycle.contract.js
          node tests/design_system_lifecycle.contract.js
          git diff --check
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add design_system-1.20.1.js tests/design_system_lifecycle.contract.js .github/workflows/lifecycle-phase2d-audit-temp.yml
          git commit -m "Performance — Design System Lifecycle Phase 2D"
          git push origin HEAD:performance/lifecycle-phase2d
