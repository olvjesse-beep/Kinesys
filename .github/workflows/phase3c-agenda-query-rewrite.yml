name: Phase 3C Agenda query rewrite

on:
  push:
    branches: [performance/agenda-query-phase3c]
    paths:
      - '.github/workflows/phase3c-agenda-query-rewrite.yml'

permissions:
  contents: write

jobs:
  rewrite:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: performance/agenda-query-phase3c
          fetch-depth: 0

      - name: Apply exact Phase 3C rewrite
        run: python .github/scripts/phase3c_agenda_query.py

      - name: Validate Phase 3C
        shell: bash
        run: |
          set -euo pipefail
          node --check agenda-1.20.0.js
          node --check tests/operational_data_loading.contract.js
          node tests/operational_data_loading.contract.js
          node tests/data_loading.contract.js
          node tests/screen_loader.contract.js
          node tests/clinical_reasoning_shoulder_elbow.regression.js
          git diff --check
          git diff --stat

      - name: Commit permanent Phase 3C code
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add agenda-1.20.0.js tests/operational_data_loading.contract.js
          git commit -m 'Narrow Agenda patient relation payload'
          git push origin HEAD:performance/agenda-query-phase3c
