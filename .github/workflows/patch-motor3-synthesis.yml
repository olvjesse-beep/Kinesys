name: One-time Motor 3 synthesis bridge patch

on:
  push:
    paths:
      - '.github/workflows/patch-motor3-synthesis.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Connect HMA hypotheses to post-exam synthesis
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          js=Path('clinical_reasoning_hma-3.0.0.js')
          s=js.read_text(encoding='utf-8')
          anchor='    function garantirUI(){\n'
          if s.count(anchor)!=1:
              raise SystemExit(f'Motor3 garantirUI anchor count={s.count(anchor)}')

          insert=r'''    function statusSintese(status=''){
        const s=String(status||'').toLowerCase();
        if(s==='positivo') return {codigo:'sustentada',rotulo:'Sustentada pelo exame'};
        if(s==='negativo') return {codigo:'enfraquecida',rotulo:'Enfraquecida / contradita'};
        if(s==='inconclusivo') return {codigo:'inconclusiva',rotulo:'Inconclusiva'};
        if(s==='pendente') return {codigo:'pendente',rotulo:'Exame pendente'};
        return {codigo:'em_aberto',rotulo:'Em aberto'};
    }

    function reconciliarComExame(plano=ultimoPlano||gerarPlano()){
        if(!plano||plano.insuficiente) return {versao:VERSION,disponivel:false,itens:[],grupos:{sustentadas:[],enfraquecidas:[],abertas:[]},modificadores:[],resumo:{}};
        const contexto=contextoAtual();
        const selecionadas=new Set(regioesSelecionadasAtual());
        const cache=new Map();
        const topPorRegiao=new Map();
        plano.hipoteses.forEach(h=>{
            const nAtual=topPorRegiao.get(h.regiaoId)||0;
            if(nAtual<MAX_HIPOTESES_POR_REGIAO) topPorRegiao.set(h.regiaoId,nAtual+1);
        });
        const itens=plano.hipoteses.slice(0,8).map((h,ordem)=>{
            if(!selecionadas.has(h.regiaoId)){
                return {...h,ordemHMA:ordem+1,statusExame:'nao_examinada',estadoSintese:'em_aberto',estadoRotulo:'Região ainda não examinada',suficiencia:0,favoraveis:[],contraditorios:[],naoConclusivos:0};
            }
            let candidatos=cache.get(h.regiaoId);
            if(!candidatos){
                try { candidatos=typeof ordenarHipotesesRegiaoKineSys==='function' ? (ordenarHipotesesRegiaoKineSys(h.regiaoId,contexto)||[]) : []; }
                catch(_) { candidatos=[]; }
                cache.set(h.regiaoId,candidatos);
            }
            const atual=candidatos.find(c=>String(c?.item?.id||'')===String(h.id)&&String(c?.grupo||'')===String(h.grupo));
            if(!atual){
                return {...h,ordemHMA:ordem+1,statusExame:'nao_disponivel',estadoSintese:'em_aberto',estadoRotulo:'Hipótese não disponível no exame atual',suficiencia:0,favoraveis:[],contraditorios:[],naoConclusivos:0};
            }
            let status='pendente';
            try { if(typeof statusHipoteseKineSys==='function') status=statusHipoteseKineSys(h.regiaoId,atual)||'pendente'; } catch(_) {}
            let suf=null;
            try { if(typeof calcularSuficienciaInvestigacaoKineSys==='function') suf=calcularSuficienciaInvestigacaoKineSys(h.regiaoId,atual.item,atual.grupo); } catch(_) {}
            const analise=suf?.analise||{};
            const respostas=Array.isArray(analise.respostas)?analise.respostas:[];
            const testes=arr(atual?.item?.testes).map(textoTeste);
            const favoraveis=[],contraditorios=[];
            respostas.forEach((r,i)=>{
                if(r==='positivo'&&testes[i]) favoraveis.push(testes[i]);
                if(r==='negativo'&&testes[i]) contraditorios.push(testes[i]);
            });
            const st=statusSintese(status);
            return {
                ...h,ordemHMA:ordem+1,statusExame:status,estadoSintese:st.codigo,estadoRotulo:st.rotulo,
                suficiencia:Number(suf?.percentual||0),favoraveis:favoraveis.slice(0,4),contraditorios:contraditorios.slice(0,4),
                naoConclusivos:Number(analise?.naoConclusivos||0),respondidos:Number(analise?.respondidos||0),totalTestes:testes.length
            };
        });
        const sustentadas=itens.filter(x=>x.estadoSintese==='sustentada');
        const enfraquecidas=itens.filter(x=>x.estadoSintese==='enfraquecida');
        const abertas=itens.filter(x=>!['sustentada','enfraquecida'].includes(x.estadoSintese));
        const modificadores=plano.exame?.modificadores||[];
        return {
            versao:VERSION,disponivel:true,geradoEm:new Date().toISOString(),itens,
            grupos:{sustentadas,enfraquecidas,abertas},modificadores,
            resumo:{sustentadas:sustentadas.length,enfraquecidas:enfraquecidas.length,abertas:abertas.length,regioesSelecionadas:Array.from(selecionadas)}
        };
    }

    function resumoAchados(item){
        const partes=[];
        if(item.favoraveis?.length) partes.push(`${item.favoraveis.length} achado(s) favorável(is)`);
        if(item.contraditorios?.length) partes.push(`${item.contraditorios.length} achado(s) contraditório(s)`);
        if(item.naoConclusivos) partes.push(`${item.naoConclusivos} não conclusivo(s)`);
        partes.push(`cobertura ${Number(item.suficiencia||0)}%`);
        return partes.join(' · ');
    }

    function renderGrupoSintese(titulo,itens,classe){
        if(!itens.length)return'';
        return `<section class="ks30-synth-group ${classe}"><div class="ks30-synth-group-title"><strong>${esc(titulo)}</strong><span>${itens.length}</span></div>${itens.slice(0,5).map(item=>`<article class="ks30-synth-item"><div><strong>${esc(item.nome)}</strong><span>${esc(item.regiaoNome)}</span></div><p>${esc(resumoAchados(item))}</p>${item.favoraveis?.length?`<small><b>Favoráveis:</b> ${esc(item.favoraveis.slice(0,2).join(' · '))}</small>`:''}${item.contraditorios?.length?`<small><b>Contraditórios:</b> ${esc(item.contraditorios.slice(0,2).join(' · '))}</small>`:''}</article>`).join('')}</section>`;
    }

    function renderSintese(plano){
        const host=document.getElementById('ks30_synthesis_bridge');if(!host)return;
        if(!plano||plano.insuficiente){host.hidden=true;host.innerHTML='';return;}
        const r=reconciliarComExame(plano);
        host.hidden=false;
        host.innerHTML=`
            <header class="ks30-synth-head"><div><span class="ks30-kicker">Motor Clínico 3.0 · HMA → exame → síntese</span><h2>Reconciliação clínica</h2><p>A história abriu hipóteses; o exame agora mostra quais ganharam suporte, quais foram enfraquecidas e quais ainda precisam permanecer abertas.</p></div><div class="ks30-synth-counts"><span class="is-supported">${r.resumo.sustentadas} sustentada(s)</span><span class="is-weakened">${r.resumo.enfraquecidas} enfraquecida(s)</span><span>${r.resumo.abertas} em aberto</span></div></header>
            ${renderGrupoSintese('Sustentadas pelo exame',r.grupos.sustentadas,'is-supported')}
            ${renderGrupoSintese('Enfraquecidas / contraditas',r.grupos.enfraquecidas,'is-weakened')}
            ${renderGrupoSintese('Em aberto / dados insuficientes',r.grupos.abertas,'is-open')}
            ${r.modificadores.length?`<section class="ks30-synth-modifiers"><strong>Fatores modificadores para a síntese</strong><span>${r.modificadores.map(x=>esc(x.titulo)).join(' · ')}</span></section>`:''}
            <footer class="ks30-disclaimer">Cobertura indica quanto da regra operacional foi examinada; não representa probabilidade diagnóstica. A síntese clínica abaixo continua sendo confirmada ou ajustada pelo fisioterapeuta.</footer>`;
    }

    function snapshotRaciocinio(plano=ultimoPlano||gerarPlano()){
        const r=reconciliarComExame(plano);
        if(!r.disponivel)return null;
        return {
            versao:VERSION,
            geradoEm:r.geradoEm,
            origem:'HMA + contexto clínico + exame registrado',
            regioes:plano.regioes.map(x=>({id:x.id,nome:x.nome,origem:x.origem})),
            hipoteses:r.itens.map(x=>({
                id:x.id,grupo:x.grupo,regiaoId:x.regiaoId,regiaoNome:x.regiaoNome,nome:x.nome,ordemHMA:x.ordemHMA,
                statusExame:x.statusExame,estadoSintese:x.estadoSintese,suficiencia:x.suficiencia,
                favoraveis:x.favoraveis,contraditorios:x.contraditorios,naoConclusivos:x.naoConclusivos
            })),
            modificadores:r.modificadores.map(x=>({tipo:x.tipo,titulo:x.titulo,descricao:x.descricao})),
            lacunas:arr(plano.lacunas).slice(0,10),
            aviso:'Ordem e cobertura são auxiliares de raciocínio. Não representam probabilidade diagnóstica nem substituem decisão profissional.'
        };
    }

'''
          s=s.replace(anchor,insert+anchor)

          old="""        const etapa2=document.getElementById('subtela_mapeamento');
        if(etapa2&&!document.getElementById('ks30_exam_plan')){
            const panel=document.createElement('section');panel.id='ks30_exam_plan';panel.className='ks30-exam-plan';panel.setAttribute('aria-live','polite');
            etapa2.insertAdjacentElement('afterbegin',panel);
        }
"""
          new=old+"""        const etapa3=document.getElementById('subtela_diagnostico');
        if(etapa3&&!document.getElementById('ks30_synthesis_bridge')){
            const panel=document.createElement('section');panel.id='ks30_synthesis_bridge';panel.className='ks30-synthesis-bridge';panel.hidden=true;panel.setAttribute('aria-live','polite');
            etapa3.insertAdjacentElement('afterbegin',panel);
        }
"""
          if s.count(old)!=1:
              raise SystemExit(f'Motor3 stage2 UI block count={s.count(old)}')
          s=s.replace(old,new)

          old='        renderBridge(plano);renderExame(plano);\n'
          new='        renderBridge(plano);renderExame(plano);renderSintese(plano);\n'
          if s.count(old)!=1:
              raise SystemExit(f'Motor3 render call count={s.count(old)}')
          s=s.replace(old,new)

          old="""        tela.addEventListener('change',e=>{
            if(e.target?.matches('#grupo_regioes_mapeamento input,.fatores-piora-compactos input,input[name*=\"comorb\"],input[name*=\"anteced\"]')) agendarAtualizacao();
        });
"""
          new="""        tela.addEventListener('change',e=>{
            if(e.target?.closest('#subtela_mapeamento') || e.target?.matches('#grupo_regioes_mapeamento input,.fatores-piora-compactos input,input[name*=\"comorb\"],input[name*=\"anteced\"]')) agendarAtualizacao();
        });
"""
          if s.count(old)!=1:
              raise SystemExit(f'Motor3 change handler count={s.count(old)}')
          s=s.replace(old,new)

          old="""    window.atualizarMotorClinico3KineSys=atualizar;
    window.executarAuditoriaMotor3HMAKineSys=auditoria;
"""
          new="""    window.atualizarMotorClinico3KineSys=atualizar;
    window.reconciliarMotor3ComExameKineSys=reconciliarComExame;
    window.obterSinteseMotor3KineSys=snapshotRaciocinio;
    window.executarAuditoriaMotor3HMAKineSys=auditoria;
"""
          if s.count(old)!=1:
              raise SystemExit(f'Motor3 export block count={s.count(old)}')
          s=s.replace(old,new)
          js.write_text(s,encoding='utf-8')

          css=Path('clinical_reasoning_hma-3.0.0.css')
          c=css.read_text(encoding='utf-8')
          marker='/* Motor 3.0 synthesis bridge */'
          if marker not in c:
              c += r'''

/* Motor 3.0 synthesis bridge */
#tela_avaliacao #subtela_diagnostico .ks30-synthesis-bridge{
  width:100%;margin:0 0 18px;padding:18px 20px;border:1px solid var(--kds-line);border-radius:var(--kds-radius-md);background:var(--kds-surface);box-shadow:none;
}
#tela_avaliacao .ks30-synth-head{display:flex;align-items:flex-start;justify-content:space-between;gap:18px;padding-bottom:13px;border-bottom:1px solid var(--kds-line-soft)}
#tela_avaliacao .ks30-synth-head>div:first-child{max-width:760px}
#tela_avaliacao .ks30-synth-head h2{margin:0;color:var(--kds-petrol-deep);font-size:var(--kds-font-heading-md);line-height:var(--kds-leading-compact)}
#tela_avaliacao .ks30-synth-head p{margin:6px 0 0;color:var(--kds-muted);font-size:var(--kds-font-content);line-height:var(--kds-leading-text)}
#tela_avaliacao .ks30-synth-counts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
#tela_avaliacao .ks30-synth-counts span{padding:5px 8px;border:1px solid var(--kds-line);border-radius:var(--kds-radius-pill);color:var(--kds-muted);font-size:var(--kds-font-metadata);font-weight:700;white-space:nowrap}
#tela_avaliacao .ks30-synth-counts .is-supported{border-color:var(--kds-focus-line);background:var(--kds-success-soft);color:var(--kds-success)}
#tela_avaliacao .ks30-synth-counts .is-weakened{border-color:var(--kds-line-strong);background:var(--kds-surface-soft);color:var(--kds-text-secondary)}
#tela_avaliacao .ks30-synth-group{padding:13px 0;border-bottom:1px solid var(--kds-line-soft)}
#tela_avaliacao .ks30-synth-group-title{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:5px}
#tela_avaliacao .ks30-synth-group-title strong{color:var(--kds-petrol-deep);font-size:var(--kds-font-clinical)}
#tela_avaliacao .ks30-synth-group-title span{color:var(--kds-muted);font-size:var(--kds-font-label)}
#tela_avaliacao .ks30-synth-item{display:grid;grid-template-columns:minmax(190px,.42fr) minmax(170px,.32fr) minmax(0,1fr);column-gap:14px;row-gap:3px;padding:9px 0;border-bottom:1px solid var(--kds-line-soft)}
#tela_avaliacao .ks30-synth-item:last-child{border-bottom:0}
#tela_avaliacao .ks30-synth-item>div{display:grid;gap:2px}
#tela_avaliacao .ks30-synth-item>div strong{color:var(--kds-text);font-size:var(--kds-font-content)}
#tela_avaliacao .ks30-synth-item>div span{color:var(--kds-muted);font-size:var(--kds-font-metadata)}
#tela_avaliacao .ks30-synth-item p{margin:0;color:var(--kds-text-secondary);font-size:var(--kds-font-label);line-height:var(--kds-leading-ui)}
#tela_avaliacao .ks30-synth-item small{display:block;color:var(--kds-muted);font-size:var(--kds-font-metadata);line-height:var(--kds-leading-ui)}
#tela_avaliacao .ks30-synth-item small b{color:var(--kds-text-secondary)}
#tela_avaliacao .ks30-synth-group.is-supported .ks30-synth-item:first-of-type{padding-left:10px;border-left:3px solid var(--kds-success)}
#tela_avaliacao .ks30-synth-group.is-weakened .ks30-synth-item{opacity:.84}
#tela_avaliacao .ks30-synth-modifiers{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;padding:12px 0;color:var(--kds-muted);font-size:var(--kds-font-label)}
#tela_avaliacao .ks30-synth-modifiers strong{color:var(--kds-text)}
@media (max-width:980px){
  #tela_avaliacao .ks30-synth-head{display:grid;gap:10px}
  #tela_avaliacao .ks30-synth-counts{justify-content:flex-start}
  #tela_avaliacao .ks30-synth-item{grid-template-columns:minmax(180px,.45fr) minmax(0,1fr)}
  #tela_avaliacao .ks30-synth-item small{grid-column:1/-1}
}
@media (max-width:700px){
  #tela_avaliacao #subtela_diagnostico .ks30-synthesis-bridge{padding:15px 14px}
  #tela_avaliacao .ks30-synth-item{grid-template-columns:1fr}
  #tela_avaliacao .ks30-synth-item small{grid-column:auto}
}
'''
          css.write_text(c,encoding='utf-8')

          core=Path('script-1.18.0.js')
          x=core.read_text(encoding='utf-8')
          old='''    mapeamento.clinicaEstruturada=coletarClinicaEstruturada();\n    const realizadoEm=registroEmEdicao?obterRealizadoEmRegistro(registroEmEdicao):realizadoInput;\n'''
          new='''    mapeamento.clinicaEstruturada=coletarClinicaEstruturada();\n    try {\n        const snapshotMotor3=typeof window.obterSinteseMotor3KineSys==='function'?window.obterSinteseMotor3KineSys():null;\n        if(snapshotMotor3)mapeamento.raciocinioClinico3=snapshotMotor3;\n    } catch (_) {}\n    const realizadoEm=registroEmEdicao?obterRealizadoEmRegistro(registroEmEdicao):realizadoInput;\n'''
          if x.count(old)!=1:
              raise SystemExit(f'Core snapshot anchor count={x.count(old)}')
          x=x.replace(old,new)
          core.write_text(x,encoding='utf-8')

          index=Path('index.html')
          h=index.read_text(encoding='utf-8')
          replacements={
            'clinical_reasoning_hma-3.0.0.css?v=20260910-r1':'clinical_reasoning_hma-3.0.0.css?v=20260910-r2',
            'clinical_reasoning_hma-3.0.0.js?v=20260910-r1':'clinical_reasoning_hma-3.0.0.js?v=20260910-r2',
            'script-1.18.0.js?v=20260910-agendamento-clinico-r2':'script-1.18.0.js?v=20260910-motor3-r3'
          }
          for old,new in replacements.items():
              if h.count(old)!=1:
                  raise SystemExit(f'index asset {old} count={h.count(old)}')
              h=h.replace(old,new)
          index.write_text(h,encoding='utf-8')
          PY
          node --check clinical_reasoning_hma-3.0.0.js
          node --check script-1.18.0.js
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add clinical_reasoning_hma-3.0.0.js clinical_reasoning_hma-3.0.0.css script-1.18.0.js index.html
          git commit -m "Connect Motor 3 hypotheses to clinical synthesis"
          git push
