name: Clinical Region Phase 3A Temp

on:
  push:
    branches:
      - performance/clinical-region-lazy-phase3a

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: performance/clinical-region-lazy-phase3a
      - name: Patch Screen Loader and contract
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('fs');
          function replaceExact(path,from,to){
            let s=fs.readFileSync(path,'utf8');
            if(!s.includes(from))throw new Error(`Expected block not found in ${path}`);
            s=s.replace(from,to);
            fs.writeFileSync(path,s);
          }

          replaceExact('screen_loader-1.25.0.js',`                'clinical_reasoning_hma-3.0.0.css?v=20260910-r1',
                'clinical_reasoning_shoulder-3.1.0.css?v=20260910-r2',
                'clinical_reasoning_elbow-3.1.0.css?v=20260910-r1',
                'clinical_reasoning_wrist-3.1.0.css?v=20260910-r1',
                'clinical_reasoning_cervical-3.1.0.css?v=20260911-r1',
                'radar_clinico_focus-3.0.0.css?v=20260910-r1',`,`                'clinical_reasoning_hma-3.0.0.css?v=20260910-r1',
                'radar_clinico_focus-3.0.0.css?v=20260910-r1',`);
          replaceExact('screen_loader-1.25.0.js',`                'clinical_reasoning_hma-3.0.0.js?v=20260910-perf-r2',
                'clinical_reasoning_shoulder-3.1.0.js?v=20260910-lang-r3&upperlimb=20260910-r1',
                'clinical_reasoning_elbow-3.1.0.js?v=20260910-r1&upperlimb=20260910-r1',
                'clinical_reasoning_wrist-3.1.0.js?v=20260910-r1&upperlimb=20260910-r1',
                'clinical_reasoning_cervical-3.1.0.js?v=20260911-r1'`,`                'clinical_reasoning_hma-3.0.0.js?v=20260910-perf-r2',
                'clinical_region_loader-1.0.0.js?v=20260911-phase3a-r1'`);

          let test=fs.readFileSync('tests/screen_loader.contract.js','utf8');
          test=test.replace(`const app=fs.readFileSync('script-1.18.0.js','utf8');`,`const app=fs.readFileSync('script-1.18.0.js','utf8');\nconst regionLoader=fs.readFileSync('clinical_region_loader-1.0.0.js','utf8');`);
          test=test.replace(`  'clinical_reasoning_hma-3.0.0.js',
  'clinical_reasoning_shoulder-3.1.0.js',
  'clinical_reasoning_elbow-3.1.0.js',
  'clinical_reasoning_wrist-3.1.0.js',
  'clinical_reasoning_cervical-3.1.0.js'`,`  'clinical_reasoning_hma-3.0.0.js',
  'clinical_region_loader-1.0.0.js'`);
          test=test.replace(`  'clinical_reasoning_hma-3.0.0.css',
  'clinical_reasoning_shoulder-3.1.0.css',
  'clinical_reasoning_elbow-3.1.0.css',
  'clinical_reasoning_wrist-3.1.0.css',
  'clinical_reasoning_cervical-3.1.0.css',
  'radar_clinico_focus-3.0.0.css',`,`  'clinical_reasoning_hma-3.0.0.css',
  'radar_clinico_focus-3.0.0.css',`);
          const marker=`const lazyStyles=[`;
          if(!test.includes(marker))throw new Error('lazyStyles marker missing');
          const insert=`const regionalScripts=[\n  'clinical_reasoning_shoulder-3.1.0.js',\n  'clinical_reasoning_elbow-3.1.0.js',\n  'clinical_reasoning_wrist-3.1.0.js',\n  'clinical_reasoning_cervical-3.1.0.js'\n];\nconst regionalStyles=[\n  'clinical_reasoning_shoulder-3.1.0.css',\n  'clinical_reasoning_elbow-3.1.0.css',\n  'clinical_reasoning_wrist-3.1.0.css',\n  'clinical_reasoning_cervical-3.1.0.css'\n];\n\n`;
          test=test.replace(marker,insert+marker);
          const orderBlock=`let ultimaPosicao=-1;\nfor(const file of lazyScripts){\n  const posicao=loader.indexOf(file);\n  assert.ok(posicao>ultimaPosicao,\`${'${file}'} deve manter a ordem histórica relativa do bundle da Avaliação\`);\n  ultimaPosicao=posicao;\n}\n`;
          if(!test.includes(orderBlock))throw new Error('order block missing');
          const regionChecks=`\nfor(const file of regionalScripts){\n  const escaped=file.replace(/[.*+?^${'${}'}()|[\\]\\\\]/g,'\\\\$&');\n  const eager=new RegExp(\`<script[^>]+src=["'][^"']*${'${escaped}'}[^"']*["']\`,'i');\n  assert.ok(!eager.test(html),\`${'${file}'} não pode voltar ao carregamento inicial\`);\n  assert.ok(!loader.includes(file),\`${'${file}'} não deve permanecer no bundle base da Avaliação\`);\n  assert.ok(regionLoader.includes(file),\`${'${file}'} deve permanecer no loader regional\`);\n  assert.ok(fs.existsSync(file),\`${'${file}'} deve existir fisicamente no repositório\`);\n}\nlet ultimaRegiao=-1;\nfor(const file of regionalScripts){\n  const posicao=regionLoader.indexOf(file);\n  assert.ok(posicao>ultimaRegiao,\`${'${file}'} deve preservar a ordem histórica no loader regional\`);\n  ultimaRegiao=posicao;\n}\n`;
          test=test.replace(orderBlock,orderBlock+regionChecks);
          const styleLoop=`for(const file of lazyStyles){\n  const escaped=file.replace(/[.*+?^${'${}'}()|[\\]\\\\]/g,'\\\\$&');\n  const eager=new RegExp(\`<link[^>]+\\shref=["'][^"']*${'${escaped}'}[^"']*["']\`,'i');\n  assert.ok(!eager.test(html),\`${'${file}'} não pode voltar ao CSS inicial\`);\n  assert.ok(loader.includes(file),\`${'${file}'} deve permanecer no bundle de estilos sob demanda\`);\n  assert.ok(fs.existsSync(file),\`${'${file}'} deve existir fisicamente no repositório\`);\n}\n`;
          if(!test.includes(styleLoop))throw new Error('style loop missing');
          const regionStyleChecks=`\nfor(const file of regionalStyles){\n  const escaped=file.replace(/[.*+?^${'${}'}()|[\\]\\\\]/g,'\\\\$&');\n  const eager=new RegExp(\`<link[^>]+\\shref=["'][^"']*${'${escaped}'}[^"']*["']\`,'i');\n  assert.ok(!eager.test(html),\`${'${file}'} não pode voltar ao CSS inicial\`);\n  assert.ok(!loader.includes(file),\`${'${file}'} não deve permanecer no bundle base de estilos\`);\n  assert.ok(regionLoader.includes(file),\`${'${file}'} deve permanecer no loader regional\`);\n  assert.ok(fs.existsSync(file),\`${'${file}'} deve existir fisicamente no repositório\`);\n}\n`;
          test=test.replace(styleLoop,styleLoop+regionStyleChecks);
          fs.writeFileSync('tests/screen_loader.contract.js',test);
          NODE
      - name: Validate
        run: |
          node --check screen_loader-1.25.0.js
          node --check clinical_region_loader-1.0.0.js
          node --check tests/screen_loader.contract.js
          node --check tests/clinical_region_loader.contract.js
          node tests/screen_loader.contract.js
          node tests/clinical_region_loader.contract.js
          git diff --check
      - name: Commit patch and remove temporary workflow
        shell: bash
        run: |
          rm -f .github/workflows/clinical-region-phase3a-temp.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add screen_loader-1.25.0.js tests/screen_loader.contract.js .github/workflows/clinical-region-phase3a-temp.yml
          git commit -m 'Performance — Clinical Region Lazy Loading Phase 3A'
          git push origin HEAD:performance/clinical-region-lazy-phase3a
