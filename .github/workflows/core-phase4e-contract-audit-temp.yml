name: Core Modularization Phase 4E Contract Audit Temp

on:
  push:
    branches:
      - performance/core-modularization-phase4e
    paths:
      - .github/workflows/core-phase4e-contract-audit-temp.yml

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Find registration validation assumptions in permanent tests and workflows
        run: |
          python - <<'PY'
          from pathlib import Path
          needles=['somenteDigitos','formatarCPF','validarCPFInput','validarCEPInput','validarTelefoneInput','alternarCamposResponsavel','validarResponsavelCadastro','definirStatusCEP','ultimoCEPPesquisado','configurarValidacoesCadastrais','CEP INTELIGENTE','VALIDAÇÕES CADASTRAIS']
          roots=[Path('tests'),Path('.github/workflows')]
          for root in roots:
              for p in root.rglob('*'):
                  if not p.is_file(): continue
                  try: text=p.read_text(encoding='utf-8')
                  except Exception: continue
                  hits=[n for n in needles if n in text]
                  if hits:
                      print(str(p), '=>', ', '.join(hits))
          PY
