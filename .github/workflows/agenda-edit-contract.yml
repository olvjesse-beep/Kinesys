name: Agenda Edit Contract

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agenda-planos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    name: Agenda e planos - regressao critica
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate scheduling, plans and shared interface contracts
        shell: bash
        run: |
          set -euo pipefail
          node --check src/agenda/agenda-1.20.0.js
          node --check src/ui/screen_loader-1.25.0.js
          node --check src/ui/modal_helpers-1.0.0.js
          node --check src/finance/financeiro-1.19.0.js
          node --check src/finance/financeiro_agendamento-1.21.0.js
          node --check src/core/design_system-1.20.1.js
          node --check src/patient/patient_records_browse_core-1.0.0.js
          node --check tests/agenda_editar_atendimento.contract.js
          node --check tests/agenda_ux_corrections.contract.js
          node tests/agenda_editar_atendimento.contract.js
          node tests/agenda_ux_corrections.contract.js
          node tests/agenda_detalhe_sem_confirmacao.test.cjs
          node tests/agenda_intervalo.contract.js
          node tests/financeiro_modal_bootstrap.test.cjs
          node --check src/core/crm_relationship_core-1.0.0.js
          node --check src/core/iphone_camera-1.0.0.js
          node tests/iphone_camera.test.cjs
          node tests/midias_patient_picker.contract.cjs
          node --check src/ui/documentos_modelo2.js
          node tests/documentos_modelo2.test.cjs
          node tests/crm_relationship_modularization.contract.js
          node tests/screen_loader.contract.js
          node tests/runtime_asset_cache.contract.js
          node tests/agenda_cache.contract.js
          node --check src/admin/configuracoes_agendamento_online-1.0.0.js
          node --check src/admin/configuracoes_agendamento_online_layout-1.0.0.js
          node --check src/core/mensagens_config.js
          node tests/mensagens_config_bootstrap.contract.js
          node tests/agendamento_online_admin_config.contract.js
          node tests/access_management.contract.js
          node --check src/home/home_detalhes-1.18.5.js
          node tests/home_atendimentos_24h.contract.js
          git diff --check
