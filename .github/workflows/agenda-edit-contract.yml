          node --check src/home/home_fisioterapeuta_util-1.24.0.js
          node tests/home_avaliacao_cuidados.test.cjs
          node tests/home_actions_inline.contract.cjs
          node --check src/patient/prontuario_export_impl.js
          node tests/prontuario_clinico.test.cjs
          node tests/patient_summary_edit.test.cjs
          node tests/prontuario_export_lazy.contract.js
          node --check src/ui/input_helpers_core-1.0.0.js
          node --check src/clinical/evaluation_context_panels-1.18.3.js
          node tests/input_helpers_modularization.contract.js
