name: Phase 4N PR Fixes Temp

on:
  push:
    branches:
      - performance/patient-registration-phase4n
    paths:
      - '.github/workflows/phase4n-pr-fixes-temp.yml'
      - '.github/scripts/phase4n_pr_contract_fixes.py'

permissions:
  contents: write

jobs:
  fix-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: performance/patient-registration-phase4n
          fetch-depth: 0

      - name: Apply contract fixes
        run: python .github/scripts/phase4n_pr_contract_fixes.py

      - name: Validate targeted fixes
        shell: bash
        run: |
          set -euo pipefail
          node --check patient_registration_core-1.0.0.js
          node --check tests/screen_loader.contract.js
          node tests/patient_registration_modularization.contract.js
          node tests/screen_loader.contract.js
          node tests/fisio_home_patient_self_service.contract.js
          node tests/agenda_editar_atendimento.contract.js
          node tests/access_management.contract.js
          git diff --check

      - name: Commit fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add patient_registration_core-1.0.0.js tests/screen_loader.contract.js
          if git diff --cached --quiet; then
            echo 'No fixes to commit.'
            exit 0
          fi
          git commit -m 'Fix Phase 4N contract integration'
          git push origin HEAD:performance/patient-registration-phase4n
