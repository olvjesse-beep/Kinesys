name: Inspect clinical synthesis tight
on:
  push:
    paths:
      - '.github/workflows/inspect-clinical-synthesis-tight.yml'
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect focused clinical functions
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('script-1.18.0.js')
          lines=p.read_text(encoding='utf-8').splitlines()
          names=[
            'obterMetaCriteriosKineSys',
            'analisarRespostasItem',
            'avaliarHipoteseEstruturadaKineSys',
            'calcularSuficienciaInvestigacaoKineSys',
            'ordenarHipotesesRegiaoKineSys',
            'statusHipoteseKineSys',
            'inferirFenotipoOperacionalKineSys',
            'gerarSinteseMapeamento',
            'renderizarSinteseDiagnostica',
            'avancarParaDiagnostico'
          ]
          for name in names:
              idx=next((i for i,l in enumerate(lines) if ('function '+name) in l),None)
              if idx is None:
                  print(f'===== {name}: NOT FOUND =====')
                  continue
              print(f'===== {name} @ {idx+1} =====')
              end=min(len(lines),idx+170)
              for j in range(max(0,idx-8),end):
                  print(f'{j+1:05d}: {lines[j]}')
              print()
          for needle in ['KINESYS_HIPOTESES_GATE_2','regraConfirmacao','resultados[','origemHMA','evidenciasAFavor','evidenciasContra']:
              hits=[i for i,l in enumerate(lines) if needle in l]
              print(f'===== HITS {needle}: {len(hits)} =====')
              for i in hits[:30]:
                  print(f'{i+1:05d}: {lines[i]}')
          PY
