name: TEMP Apply Phase 4B Agenda Lazy

on:
  push:
    branches:
      - perf/phase-4b-agenda-lazy
    paths:
      - 'tools/tmp_phase4b_agenda_lazy.py'
      - '.github/workflows/tmp-apply-phase4b-agenda-lazy.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/phase-4b-agenda-lazy
          fetch-depth: 0
      - name: Align transformer with current source
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tools/tmp_phase4b_agenda_lazy.py')
          s=p.read_text(encoding='utf-8')
          dollar='$'
          for old,new in [
            (dollar+'{{fmt(s.valorPendente)}}', dollar+'{fmt(s.valorPendente)}'),
            (dollar+'{{cls}}', dollar+'{cls}'),
            (dollar+'{{esc(titulo)}}', dollar+'{esc(titulo)}')
          ]:
            s=s.replace(old,new)
          a=s.index("old_bundle = \"\"\"")
          b=s.index("# 7) Bootstrap", a)
          section='''old_bundle = """        tela_agenda:Object.freeze({
            id:'agenda',
            styles:Object.freeze([
                'agenda_referencia-1.20.0.css?v=20260901-r1'
            ]),
            scripts:Object.freeze([])
        })
"""
new_bundle = """        tela_agenda:Object.freeze({
            id:'agenda',
            styles:Object.freeze([
                'agenda_referencia-1.20.0.css?v=20260901-r1'
            ]),
            scripts:Object.freeze([
                'agenda-1.20.0.js?v=20260910-phase4b-r1'
            ])
        })
"""
require_once(loader, old_bundle, 'bundle Agenda 4A')
loader = loader.replace(old_bundle, new_bundle)
load_line = "            await Promise.all([estilosProntos,carregarScriptsEmOrdem(bundle.scripts)]);\\n"
require_once(loader, load_line, 'carregar scripts bundle')
load_new = load_line + "            if(idTela==='tela_agenda'){\\n                try{window.instalarIntegracaoFinanceiroAgenda?.();}catch(error){console.error('KineSys Screen Loader: integração Agenda/Financeiro falhou.',error);}\\n                try{window.aplicarProtecoesAgendaKineSys?.();}catch(error){console.error('KineSys Screen Loader: proteções da Agenda falharam.',error);}\\n            }\\n"
loader = loader.replace(load_line, load_new)
loader_path.write_text(loader, encoding='utf-8')

'''
          s=s[:a]+section+s[b:]
          p.write_text(s,encoding='utf-8')
          PY
      - name: Apply exact transformation
        run: python3 tools/tmp_phase4b_agenda_lazy.py
      - name: Normalize generated contract header
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tests/agenda_lazy.contract.js')
          if p.exists():
              s=p.read_text(encoding='utf-8')
              bad="\\'use strict\\';"
              if s.startswith(bad): s="'use strict';"+s[len(bad):]
              p.write_text(s,encoding='utf-8')
          PY
      - name: Syntax and contracts
        shell: bash
        run: |
          node --check agenda_runtime_core-1.20.0.js
          node --check agenda-1.20.0.js
          node --check financeiro_agendamento-1.21.0.js
          node --check screen_loader-1.25.0.js
          node --check script-1.18.0.js
          node tests/agenda_lazy.contract.js
          node tests/screen_loader.contract.js || true
          node tests/data_loading.contract.js || true
          node tests/data_loading_operational.contract.js || true
          node tests/agenda_week_query.contract.js || true
          node tests/clinical_reasoning_shoulder_elbow.regression.js
          git diff --check
      - name: Commit tested Phase 4B code
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add agenda_runtime_core-1.20.0.js agenda-1.20.0.js financeiro_agendamento-1.21.0.js screen_loader-1.25.0.js script-1.18.0.js index.html tests/agenda_lazy.contract.js
          if git diff --cached --quiet; then
            echo 'No functional changes to commit.'
            exit 0
          fi
          git commit -m 'Lazy-load Agenda UI behind runtime core'
          git push origin HEAD:perf/phase-4b-agenda-lazy
