name: Phase 4C Screen Loader cache key fix

on:
  push:
    branches: [performance/evaluation-databases-phase4c]
    paths:
      - '.github/workflows/phase4c-cache-key-fix.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: performance/evaluation-databases-phase4c
          fetch-depth: 0
      - name: Update cache key and contract
        run: |
          python - <<'PY'
          from pathlib import Path
          index=Path('index.html')
          test=Path('tests/screen_loader.contract.js')
          html=index.read_text(encoding='utf-8')
          tests=test.read_text(encoding='utf-8')
          old='screen_loader-1.25.0.js?v=20260910-phase4b-r1'
          new='screen_loader-1.25.0.js?v=20260910-phase4c-r1'
          if html.count(old)!=1:
              raise SystemExit(f'Expected one old Screen Loader cache key; found {html.count(old)}')
          html=html.replace(old,new)
          anchor="assert.match(loader,/VERSION='1\\.25\\.3-phase4c'/,'Screen Loader deve identificar a Fase 4C');"
          assertion="assert.match(html,/screen_loader-1\\.25\\.0\\.js\\?v=20260910-phase4c-r1/,'index deve invalidar o cache do Screen Loader na Fase 4C');"
          if tests.count(anchor)!=1:
              raise SystemExit('Phase 4C version assertion anchor missing')
          if assertion not in tests:
              tests=tests.replace(anchor,anchor+'\n'+assertion)
          index.write_text(html,encoding='utf-8')
          test.write_text(tests,encoding='utf-8')
          PY
          node tests/screen_loader.contract.js
          git diff --check
      - name: Commit cache key fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html tests/screen_loader.contract.js
          git commit -m 'Invalidate Screen Loader cache for Phase 4C'
          git push origin HEAD:performance/evaluation-databases-phase4c
