name: Handoff Reorganization Apply Temp

on:
  push:
    branches:
      - chore/handoff-organization
    paths:
      - 'tools/handoff_reorg_apply_temp.js'
      - 'tools/handoff_reorg_validate_temp.js'
      - 'tests/**'
      - '.github/workflows/handoff-reorg-apply-temp.yml'

permissions:
  contents: write

jobs:
  reorganize:
    runs-on: [self-hosted, Windows, X64]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/handoff-organization
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply path-only reorganization
        shell: cmd
        run: node tools\handoff_reorg_apply_temp.js
      - name: Validate reorganized tree
        shell: cmd
        run: node tools\handoff_reorg_validate_temp.js
      - name: Check patch integrity
        shell: cmd
        run: git diff --check
      - name: Commit validated reorganization
        shell: cmd
        run: >-
          git config user.name "github-actions[bot]" &&
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com" &&
          git add -A &&
          git commit -m "Phase 5D: reorganize runtime files for handoff" &&
          git push origin HEAD:chore/handoff-organization
