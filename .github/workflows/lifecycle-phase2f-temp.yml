name: Lifecycle Phase 2F Temp

on:
  push:
    branches:
      - performance/lifecycle-phase2f

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: performance/lifecycle-phase2f
          fetch-depth: 0
      - name: Apply Evaluation context lifecycle patch
        run: |
          node <<'NODE'
          const fs=require('fs');
          const path='evaluation_context_panels-1.18.3.js';
          let s=fs.readFileSync(path,'utf8');
          const old=`        const navegacao=new MutationObserver(()=>{if(aberto&&(!avaliacao.classList.contains('ativa')||!triagem.classList.contains('ativa')))fechar(false);});\n        navegacao.observe(triagem,{attributes:true,attributeFilter:['class']});navegacao.observe(avaliacao,{attributes:true,attributeFilter:['class']});`;
          const replacement=`        const navegacao=new MutationObserver(()=>{if(aberto&&!triagem.classList.contains('ativa'))fechar(false);});\n        navegacao.observe(triagem,{attributes:true,attributeFilter:['class']});`;
          if(!s.includes(old)) throw new Error('Observer esperado da avaliação não encontrado');
          s=s.replace(old,replacement);
          fs.writeFileSync(path,s);

          const test=`const assert=require('assert');\nconst fs=require('fs');\nconst src=fs.readFileSync('evaluation_context_panels-1.18.3.js','utf8');\n\nassert.match(src,/const navegacao=new MutationObserver\\(\\(\\)=>\\{if\\(aberto&&!triagem\\.classList\\.contains\\('ativa'\\)\\)fechar\\(false\\);\\}\\)/,'observer deve permanecer restrito à subtela de triagem');\nassert.match(src,/navegacao\\.observe\\(triagem,\\{attributes:true,attributeFilter:\\['class'\\]\\}\\)/,'triagem deve continuar observada');\nassert.doesNotMatch(src,/navegacao\\.observe\\(avaliacao/,'tela_avaliacao não deve ser observada de forma redundante');\nassert.match(src,/document\\.addEventListener\\('kinesys:tela-desativada',[\\s\\S]*event\\.detail\\?\\.id==='tela_avaliacao'[\\s\\S]*pararSincronizacaoContexto\\(\\);[\\s\\S]*if\\(aberto\\)fechar\\(false\\);/,'saída da avaliação deve continuar coberta pelo lifecycle oficial');\nassert.match(src,/sincronizacaoTimer=setInterval\\(sincronizarContextoSeAtivo,1000\\)/,'cadência clínica existente de 1 s deve ser preservada');\nassert.match(src,/if\\(sincronizacaoTimer\\)\\{clearInterval\\(sincronizacaoTimer\\);sincronizacaoTimer=null;\\}/,'timer deve continuar sendo suspenso explicitamente');\nassert.match(src,/document\\.visibilityState!=='visible'/,'timer deve continuar condicionado à visibilidade');\nconsole.log('Evaluation context lifecycle contract OK');\n`;
          fs.writeFileSync('tests/evaluation_context_lifecycle.contract.js',test);
          NODE
      - name: Validate
        run: |
          node --check evaluation_context_panels-1.18.3.js
          node --check tests/evaluation_context_lifecycle.contract.js
          node tests/evaluation_context_lifecycle.contract.js
          git diff --check
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add evaluation_context_panels-1.18.3.js tests/evaluation_context_lifecycle.contract.js
          git commit -m "Performance — Evaluation Context Lifecycle Phase 2F"
          git push origin HEAD:performance/lifecycle-phase2f
