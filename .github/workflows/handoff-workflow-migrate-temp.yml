name: Handoff Workflow Migration Temp

on:
  push:
    branches:
      - chore/handoff-organization
    paths:
      - 'tools/handoff_workflow_migrate_temp.js'
      - '.github/workflows/handoff-workflow-migrate-temp.yml'

permissions:
  contents: write

jobs:
  generate:
    runs-on: [self-hosted, Windows, X64]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/handoff-organization
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate migrated workflow copies
        shell: cmd
        run: node tools\handoff_workflow_migrate_temp.js
      - name: Commit generated copies outside workflow directory
        shell: cmd
        run: >-
          git config user.name "github-actions[bot]" &&
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com" &&
          git add tools/handoff_workflow_output_temp &&
          git commit -m "Phase 5D: generate workflow path migration copies" &&
          git push origin HEAD:chore/handoff-organization
