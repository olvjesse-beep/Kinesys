name: Input Helpers Contract

on:
  pull_request:
    branches: [main]
    paths:
      - 'index.html'
      - 'src/core/script-1.18.0.js'
      - 'src/ui/input_helpers_core-1.0.0.js'
      - 'tests/input_helpers_modularization.contract.js'
      - '.github/workflows/input-helpers-contract.yml'
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'src/core/script-1.18.0.js'
      - 'src/ui/input_helpers_core-1.0.0.js'
      - 'tests/input_helpers_modularization.contract.js'
      - '.github/workflows/input-helpers-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: JavaScript syntax
        run: |
          node --check src/ui/input_helpers_core-1.0.0.js
          node --check src/core/script-1.18.0.js
          node --check tests/input_helpers_modularization.contract.js
      - name: Input helpers modularization contract
        run: node tests/input_helpers_modularization.contract.js
