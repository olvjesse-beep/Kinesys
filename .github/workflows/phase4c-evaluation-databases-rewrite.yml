name: Phase 4C Evaluation databases lazy rewrite

on:
  push:
    branches: [performance/evaluation-databases-phase4c]
    paths:
      - '.github/workflows/phase4c-evaluation-databases-rewrite.yml'

permissions:
  contents: write

jobs:
  rewrite:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: performance/evaluation-databases-phase4c
          fetch-depth: 0

      - name: Apply exact Phase 4C rewrite
        run: python .github/scripts/phase4c_evaluation_databases.py

      - name: Validate Phase 4C
        shell: bash
        run: |
          set -euo pipefail
          node --check screen_loader-1.25.0.js
          node --check cirurgias-1.18.0.js
          node --check database/medicamentos.js
          node --check database/irradiacao_clinica.js
          node --check database/mapeamento_clinico.js
          node --check database/condicoes_mobilidade_v23.js
          node --check database/diferenciais_neurais.js
          node tests/screen_loader.contract.js
          node tests/data_loading.contract.js
          node tests/operational_data_loading.contract.js
          node tests/clinical_reasoning_shoulder_elbow.regression.js
          git diff --check

      - name: Commit permanent Phase 4C code
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html screen_loader-1.25.0.js tests/screen_loader.contract.js
          git commit -m 'Lazy-load evaluation clinical databases'
          git push origin HEAD:performance/evaluation-databases-phase4c
