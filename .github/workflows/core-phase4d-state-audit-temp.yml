name: Core Modularization Phase 4D State Audit Temp

on:
  push:
    branches:
      - performance/core-modularization-phase4d
    paths:
      - .github/workflows/core-phase4d-state-audit-temp.yml

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Audit media state references outside candidate block
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          lines=Path('script-1.18.0.js').read_text(encoding='utf-8').splitlines()
          start=6262; end=6660
          names=['KINESYS_LOCAL_URL','kinesysLocalOnline','kinesysLocalStatus','midiasPacienteAtual','midiaComparacaoA','midiaComparacaoB','midiaPollTimer','midiaPollingCapturaSolicitado','kinesysLocalStatusTimer','midiaUltimaQuantidadeLocal','midiaTabelaSupabaseDisponivel']
          for name in names:
              hits=[i+1 for i,l in enumerate(lines) if re.search(r'\b'+re.escape(name)+r'\b',l)]
              outside=[n for n in hits if n<start or n>end]
              print(name, 'hits=',hits,'outside=',outside)
              if outside:
                  raise SystemExit(f'{name} possui referência fora do bloco candidato: {outside}')
          print('MEDIA_STATE_BOUNDARY_OK')
          PY
