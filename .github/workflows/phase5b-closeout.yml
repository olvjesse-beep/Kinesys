name: Phase 5B Closeout Contract

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'screen_loader-1.25.0.js'
      - 'agenda.js'
      - 'agenda-1.20.0.js'
      - 'design_clinical_direction.css'
      - 'design_clinical_direction-1.17.0.css'
      - 'cirurgias-1.17.0.js'
      - 'cirurgias-1.18.0.js'
      - 'clinical_engine_v232.js'
      - 'clinical_engine-1.17.0.js'
      - 'script.js'
      - 'script-1.18.0.js'
      - 'prontuario_export.js'
      - 'prontuario_export_impl.js'
      - 'tests/phase5_cleanup.contract.js'
      - 'tests/phase5b_closeout.contract.js'
      - 'docs/PHASE5B_CLOSEOUT.md'
      - '.github/workflows/phase5b-closeout.yml'
  pull_request:
    branches: [main]
    paths:
      - 'index.html'
      - 'screen_loader-1.25.0.js'
      - 'agenda.js'
      - 'agenda-1.20.0.js'
      - 'design_clinical_direction.css'
      - 'design_clinical_direction-1.17.0.css'
      - 'cirurgias-1.17.0.js'
      - 'cirurgias-1.18.0.js'
      - 'clinical_engine_v232.js'
      - 'clinical_engine-1.17.0.js'
      - 'script.js'
      - 'script-1.18.0.js'
      - 'prontuario_export.js'
      - 'prontuario_export_impl.js'
      - 'tests/phase5_cleanup.contract.js'
      - 'tests/phase5b_closeout.contract.js'
      - 'docs/PHASE5B_CLOSEOUT.md'
      - '.github/workflows/phase5b-closeout.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  closeout:
    runs-on: [self-hosted, Windows, X64]
    defaults:
      run:
        shell: 'C:\PROGRA~1\Git\bin\bash.exe --noprofile --norc -eo pipefail {0}'
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Closeout contract syntax
        run: node --check tests/phase5b_closeout.contract.js

      - name: Phase 5 cleanup contract
        run: node tests/phase5_cleanup.contract.js

      - name: Phase 5B closeout contract
        run: node tests/phase5b_closeout.contract.js
