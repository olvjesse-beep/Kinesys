name: TEMP Agenda Cache Phase 1B

on:
  push:
    branches:
      - performance/query-cache-phase1b
    paths:
      - '.github/workflows/cache-phase1b-temp.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: performance/query-cache-phase1b
          fetch-depth: 0
      - name: Bump Agenda lazy asset revision
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('screen_loader-1.25.0.js')
          s=p.read_text()
          old="agenda-1.20.0.js?v=20260910-agenda-edit-r1&compact_time=20260910-r2"
          new=old+"&data_cache=20260911-r1"
          assert s.count(old)==1, 'Agenda asset revision anchor changed'
          p.write_text(s.replace(old,new,1))
          PY
      - name: Validate cache-busted lazy Agenda
        run: |
          node --check screen_loader-1.25.0.js
          node tests/screen_loader.contract.js
          node tests/agenda_cache.contract.js
          node tests/agenda_editar_atendimento.contract.js
          git diff --check
      - name: Commit cache-bust
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add screen_loader-1.25.0.js
          git diff --cached --quiet && exit 0
          git commit -m 'Bump lazy Agenda revision for cache Phase 1B'
          git push origin HEAD:performance/query-cache-phase1b
