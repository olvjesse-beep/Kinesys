name: Phase 4A operational assets rewrite

on:
  push:
    branches: [performance/operational-assets-phase4a]
    paths:
      - '.github/workflows/phase4a-operational-assets-rewrite.yml'

permissions:
  contents: write

jobs:
  rewrite:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: performance/operational-assets-phase4a
          fetch-depth: 0

      - name: Apply exact Phase 4A rewrite
        run: python .github/scripts/phase4a_operational_assets.py

      - name: Validate Phase 4A
        shell: bash
        run: |
          set -euo pipefail
          node --check screen_loader-1.25.0.js
          node --check tests/screen_loader.contract.js
          node tests/screen_loader.contract.js
          node tests/data_loading.contract.js
          node tests/operational_data_loading.contract.js
          node tests/clinical_reasoning_shoulder_elbow.regression.js
          git diff --check
          git diff --stat

      - name: Commit permanent Phase 4A code
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html screen_loader-1.25.0.js tests/screen_loader.contract.js
          git commit -m 'Lazy-load operational screen assets'
          git push origin HEAD:performance/operational-assets-phase4a
