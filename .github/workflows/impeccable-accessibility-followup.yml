name: Impeccable accessibility follow-up

on:
  push:
    branches:
      - main
    paths:
      - scripts/impeccable_accessibility_followup.py
      - .github/workflows/impeccable-accessibility-followup.yml

permissions:
  contents: write

jobs:
  follow-up:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Apply accessibility follow-up
        run: python scripts/impeccable_accessibility_followup.py

      - name: Validate design system JavaScript
        run: node --check design_system-1.20.1.js

      - name: Remove one-off files
        run: |
          rm -f scripts/impeccable_accessibility_followup.py
          rm -f .github/workflows/impeccable-accessibility-followup.yml

      - name: Commit accessibility follow-up
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Refine accessibility hardening observer"
          git push
