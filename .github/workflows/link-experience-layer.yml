name: One-time link experience layer

on:
  push:
    paths:
      - '.github/workflows/link-experience-layer.yml'

permissions:
  contents: write

jobs:
  link:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Link final CSS and JS experience layers
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          text = p.read_text(encoding='utf-8')

          css_anchor = '    <link rel="stylesheet" href="design_polish.css?v=20260909-clean-r2">'
          css_link = '    <link rel="stylesheet" href="design_experience.css?v=20260909-ux-r1">'
          if css_link not in text:
              if text.count(css_anchor) != 1:
                  raise SystemExit(f'CSS anchor count: {text.count(css_anchor)}')
              text = text.replace(css_anchor, css_anchor + '\n' + css_link)

          js_anchor = '    <script defer src="avaliacao_experiencia-1.22.0.js?v=20260904-tabs-r1"></script>'
          js_link = '    <script defer src="ui_experience.js?v=20260909-ux-r1"></script>'
          if js_link not in text:
              if text.count(js_anchor) != 1:
                  raise SystemExit(f'JS anchor count: {text.count(js_anchor)}')
              text = text.replace(js_anchor, js_anchor + '\n' + js_link)

          p.write_text(text, encoding='utf-8')
          PY
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && { echo 'No changes produced'; exit 1; }
          git commit -m "Load final KineSys experience layer"
          git push
