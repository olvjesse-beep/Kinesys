name: Self-hosted Environment Fix Temp

on:
  push:
    branches:
      - chore/handoff-ci-env-fix-work
    paths:
      - 'tools/selfhost_env_fix_temp.js'
      - '.github/workflows/selfhost-env-fix-temp.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/handoff-ci-env-fix-work
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate environment-safe workflow copies
        shell: cmd
        run: node tools\selfhost_env_fix_temp.js
      - name: Commit generated copies outside workflow directory
        shell: cmd
        run: >-
          git config user.name "github-actions[bot]" &&
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com" &&
          git add tools/selfhost_env_fix_output_temp &&
          git commit -m "CI: generate self-hosted environment fixes" &&
          git push origin HEAD:chore/handoff-ci-env-fix-work
