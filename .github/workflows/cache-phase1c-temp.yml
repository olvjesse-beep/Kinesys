name: TEMP Agenda Auxiliary Cache Phase 1C

on:
  push:
    branches:
      - performance/query-cache-phase1c
    paths:
      - '.github/workflows/cache-phase1c-temp.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: performance/query-cache-phase1c
          fetch-depth: 0

      - name: Integrate procedure catalog cache
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p=Path('agenda-1.20.0.js')
          s=p.read_text()

          anchor="async function obterPacientesBasicosAgenda() {"
          assert s.count(anchor)==1, 'Agenda auxiliary cache anchor changed'
          helper="""const AGENDA_PROCEDIMENTOS_CACHE_TTL_MS = 15000;\n\nfunction chaveCacheProcedimentosAgenda() {\n    const perfilId = String(usuarioLogado?.id || 'sem_perfil').trim() || 'sem_perfil';\n    const clinicaId = String(usuarioLogado?.clinica_id || 'sem_clinica').trim() || 'sem_clinica';\n    return `agenda::aux::procedimentos::${perfilId}::${clinicaId}`;\n}\n\nfunction invalidarCacheProcedimentosAgenda() {\n    try { return !!window.KineSysDataCache?.invalidate?.(chaveCacheProcedimentosAgenda()); }\n    catch (_) { return false; }\n}\n\nfunction clonarProcedimentosAgenda(lista = []) {\n    return (Array.isArray(lista) ? lista : []).map(item => ({\n        ...item,\n        profissionais_ids: Array.isArray(item?.profissionais_ids) ? [...item.profissionais_ids] : item?.profissionais_ids\n    }));\n}\n\n"""
          s=s.replace(anchor,helper+anchor,1)

          old="""async function carregarProcedimentos() {\n    if (!usuarioEhAdministradorAgenda()) {\n        agendaProcedimentosCache = agendaContextoDoUsuarioAtual()?.procedimentos || [];\n        popularSelectProcedimentosModal();\n        return;\n    }\n    if (!_supabase) return;\n    const { data, error } = await _supabase.from('procedimentos').select('*').order('nome');\n    if (error) { console.warn('Erro ao carregar procedimentos:', error); return; }\n    agendaProcedimentosCache = data || [];\n    renderizarListaProcedimentos();\n    popularSelectProcedimentosModal();\n}\n\n"""
          new="""async function carregarProcedimentos() {\n    if (!usuarioEhAdministradorAgenda()) {\n        agendaProcedimentosCache = agendaContextoDoUsuarioAtual()?.procedimentos || [];\n        popularSelectProcedimentosModal();\n        return;\n    }\n    if (!_supabase) return;\n\n    const buscarProcedimentosAgenda = async () => {\n        const { data, error } = await _supabase.from('procedimentos').select('*').order('nome');\n        if (error) throw error;\n        return clonarProcedimentosAgenda(data || []);\n    };\n\n    try {\n        const dados = window.KineSysDataCache?.get\n            ? await window.KineSysDataCache.get({\n                key:chaveCacheProcedimentosAgenda(),\n                ttl:AGENDA_PROCEDIMENTOS_CACHE_TTL_MS,\n                fetcher:buscarProcedimentosAgenda\n            })\n            : await buscarProcedimentosAgenda();\n        agendaProcedimentosCache = clonarProcedimentosAgenda(dados || []);\n        renderizarListaProcedimentos();\n        popularSelectProcedimentosModal();\n    } catch (error) {\n        console.warn('Erro ao carregar procedimentos:', error);\n    }\n}\n\n"""
          assert s.count(old)==1, 'carregarProcedimentos changed'
          s=s.replace(old,new,1)

          old="""        if (error) throw error;\n        fecharModal('modal_procedimento');\n        await carregarProcedimentos();\n"""
          new="""        if (error) throw error;\n        invalidarCacheProcedimentosAgenda();\n        fecharModal('modal_procedimento');\n        await carregarProcedimentos();\n"""
          assert s.count(old)==1, 'salvarProcedimento invalidation anchor changed'
          s=s.replace(old,new,1)

          old="""    if (error) { alert('❌ Erro ao atualizar procedimento.'); return; }\n    await carregarProcedimentos();\n"""
          new="""    if (error) { alert('❌ Erro ao atualizar procedimento.'); return; }\n    invalidarCacheProcedimentosAgenda();\n    await carregarProcedimentos();\n"""
          assert s.count(old)==1, 'alternarAtivoProcedimento invalidation anchor changed'
          s=s.replace(old,new,1)

          old="""    if (error) { alert('❌ Não foi possível excluir (pode haver agendamentos vinculados). Considere apenas desativar.'); return; }\n    await carregarProcedimentos();\n"""
          new="""    if (error) { alert('❌ Não foi possível excluir (pode haver agendamentos vinculados). Considere apenas desativar.'); return; }\n    invalidarCacheProcedimentosAgenda();\n    await carregarProcedimentos();\n"""
          assert s.count(old)==1, 'excluirProcedimento invalidation anchor changed'
          s=s.replace(old,new,1)

          p.write_text(s)

          loader=Path('screen_loader-1.25.0.js')
          t=loader.read_text()
          old_url="agenda-1.20.0.js?v=20260910-agenda-edit-r1&compact_time=20260910-r2&data_cache=20260911-r1"
          new_url="agenda-1.20.0.js?v=20260910-agenda-edit-r1&compact_time=20260910-r2&data_cache=20260911-r2"
          assert t.count(old_url)==1, 'Agenda lazy cache-bust anchor changed'
          loader.write_text(t.replace(old_url,new_url,1))
          PY

      - name: Validate Phase 1C
        run: |
          set -euo pipefail
          node --check agenda-1.20.0.js
          node --check screen_loader-1.25.0.js
          node --check tests/agenda_aux_cache.contract.js
          node tests/agenda_aux_cache.contract.js
          node tests/agenda_cache.contract.js
          node tests/data_cache.contract.js
          node tests/data_cache_integration.contract.js
          node tests/data_loading.contract.js
          node tests/operational_data_loading.contract.js
          node tests/agenda_editar_atendimento.contract.js
          node tests/screen_loader.contract.js
          git diff --check

      - name: Commit verified Phase 1C
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add agenda-1.20.0.js screen_loader-1.25.0.js
          git diff --cached --quiet && exit 0
          git commit -m 'Cache Agenda procedure catalog with explicit invalidation'
          git push origin HEAD:performance/query-cache-phase1c
