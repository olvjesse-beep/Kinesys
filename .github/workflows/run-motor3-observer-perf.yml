name: Narrow Motor 3 observers
on:
  push:
    paths:
      - '.github/workflows/run-motor3-observer-perf.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python .tmp_narrow_motor3_observers.py
      - run: node --check clinical_reasoning_hma-3.0.0.js
      - run: git diff --check
      - run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('clinical_reasoning_hma-3.0.0.js').read_text(encoding='utf-8')
          assert "observe(tela,{subtree:true,attributes:true,attributeFilter:['class']})" not in s
          assert "new MutationObserver(()=>agendarAtualizacao(120))" in s
          assert "m.target===etapaMapeamento" in s
          print('observer guards OK')
          PY
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add clinical_reasoning_hma-3.0.0.js
          git commit -m "Narrow Motor 3 observers to reduce HMA churn" || exit 0
          git push
