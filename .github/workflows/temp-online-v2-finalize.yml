name: Temporary Online V2 Finalize

on:
  push:
    branches:
      - feature/agendamento-online-v2-perfil-publico
    paths:
      - .github/workflows/temp-online-v2-finalize.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: [self-hosted, Windows, X64]
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply V2 final patch
        shell: cmd
        run: node scripts\temp_patch_online_v2.js
      - name: Commit patch and remove temporary files
        shell: cmd
        run: |
          git rm .github/workflows/temp-online-v2-finalize.yml scripts/temp_patch_online_v2.js
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html agendamento/index.html src/admin/configuracoes_agendamento_online_perfil_publico-1.0.0.js supabase/functions/agendamento-publico-perfil/index.ts
          git commit -m "feat: finalizar identidade publica do agendamento online v2"
          git push origin HEAD:feature/agendamento-online-v2-perfil-publico
