name: Retry KineSys quieter visual pass 1

on:
  push:
    paths:
      - '.github/workflows/quieter-pass-1-retry.yml'

permissions:
  contents: write

jobs:
  retry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reuse guarded pass and publish
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import textwrap

          workflow = Path('.github/workflows/quieter-pass-1.yml').read_text(encoding='utf-8')
          start = "          python - <<'PY'\n"
          end = "\n          PY\n"
          if workflow.count(start) != 1:
              raise SystemExit('Could not locate source Python block')
          block = workflow.split(start, 1)[1].split(end, 1)[0]
          exec(textwrap.dedent(block), {})

          # The three standalone removed labels leave whitespace-only lines.
          # Clean only those mapped lines; do not reformat the document.
          index = Path('index.html')
          lines = index.read_text(encoding='utf-8').splitlines()
          for line_no in (77, 626, 981):
              if lines[line_no - 1].strip():
                  raise SystemExit(f'Whitespace cleanup guard failed at index.html:{line_no}')
              lines[line_no - 1] = ''
          index.write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PY

          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html design_typography.css design_screens.css design_features.css design_agenda.css design_clinical.css design_utilities.css avaliacao_experiencia-1.22.0.css design_base.css
          git diff --cached --stat
          git commit -m "Quiet KineSys visual hierarchy pass 1"
          git push
