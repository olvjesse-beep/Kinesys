name: Phase 4E Export Reference Audit

on:
  push:
    branches: [performance/prontuario-export-phase4e]
    paths:
      - '.github/workflows/phase4e-export-audit.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Find prontuario export references
        shell: bash
        run: |
          set -euo pipefail
          echo '=== abrirEscolhaProntuarioPDF ==='
          git grep -n -I 'abrirEscolhaProntuarioPDF' -- ':!prontuario_export.js' || true
          echo '=== gerarProntuarioCompletoPDF ==='
          git grep -n -I 'gerarProntuarioCompletoPDF' -- ':!prontuario_export.js' || true
          echo '=== podeExportarProntuarioDetalhado ==='
          git grep -n -I 'podeExportarProntuarioDetalhado' -- ':!prontuario_export.js' || true
          echo '=== prontuario_export.js loaders ==='
          git grep -n -I 'prontuario_export.js' || true
          echo '=== export/prontuario labels in runtime HTML/JS ==='
          git grep -n -I -E 'Exportar prontuário|Exportar prontuario|Prontuário completo|Prontuario completo|Salvar PDF' -- '*.html' '*.js' || true
