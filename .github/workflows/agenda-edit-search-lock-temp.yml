name: Agenda Edit Search Lock Temp

on:
  push:
    branches:
      - agenda/ux-corrections-sep11
    paths:
      - '.github/workflows/agenda-edit-search-lock-temp.yml'
      - 'tools/agenda_edit_search_lock_temp.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agenda/ux-corrections-sep11
      - name: Apply patch
        run: python tools/agenda_edit_search_lock_temp.py
      - name: Validate
        run: |
          node --check agenda-1.20.0.js
          node --check tests/agenda_ux_corrections.contract.js
          node tests/agenda_editar_atendimento.contract.js
          node tests/agenda_ux_corrections.contract.js
          node tests/screen_loader.contract.js
          git diff --check
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add agenda-1.20.0.js tests/agenda_ux_corrections.contract.js
          git commit -m "Lock patient search while editing Agenda appointment" || exit 0
          git push origin HEAD:agenda/ux-corrections-sep11
