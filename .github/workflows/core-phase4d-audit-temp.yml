name: Core Modularization Phase 4D Audit Temp

on:
  push:
    branches:
      - performance/core-modularization-phase4d
    paths:
      - .github/workflows/core-phase4d-audit-temp.yml

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Audit media block boundaries and references
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('script-1.18.0.js')
          lines=p.read_text(encoding='utf-8').splitlines()
          needles=['let midiaPollTimer','function telaMidiasAtivaKineSys','function iniciarPollingMidias','function iniciarPollingStatusMidias','function ativarLifecycleMidiasKineSys','function suspenderLifecycleMidiasKineSys','kinesys:tela-ativada','kinesys:tela-desativada']
          for n in needles:
              hits=[i+1 for i,l in enumerate(lines) if n in l]
              print(f'{n}: {hits}')
          funcs=[]
          for i,l in enumerate(lines,1):
              m=re.match(r'\s*(?:async\s+)?function\s+([A-Za-z0-9_$]+)\s*\(',l)
              if m and ('midia' in m.group(1).lower() or 'media' in m.group(1).lower()):
                  funcs.append((i,m.group(1)))
          print('MEDIA_FUNCS')
          for x in funcs: print(x)
          print('MEDIA_STATE')
          for i,l in enumerate(lines,1):
              if re.match(r'\s*(?:let|const|var)\s+[^;]*(?:midia|media)',l,re.I): print(i,l.strip())
          names=[name for _,name in funcs]
          print('REFERENCE_COUNTS')
          text='\n'.join(lines)
          for name in names:
              print(name, len(re.findall(r'\b'+re.escape(name)+r'\b',text)))
          PY
