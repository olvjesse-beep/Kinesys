name: Fix static form labels

on:
  push:
    paths:
      - '.github/workflows/fix-static-labels.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Associate plain labels with existing controls
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          pattern = re.compile(r'<label(?![^>]*\bfor=)([^>]*)>([^<]*)</label>(\s*)<(input|select|textarea)\b([^>]*\bid="([^"]+)"[^>]*)>', re.I)

          changed = 0
          def repl(match):
              global changed
              changed += 1
              attrs, label_text, spacing, tag, rest, control_id = match.groups()
              return f'<label{attrs} for="{control_id}">{label_text}</label>{spacing}<{tag}{rest}>'

          updated = pattern.sub(repl, text)
          if changed == 0:
              raise SystemExit('No eligible labels found; refusing empty patch')

          path.write_text(updated, encoding='utf-8')
          print(f'Associated {changed} labels')
          PY
      - name: Validate label targets
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          text = Path('index.html').read_text(encoding='utf-8')
          ids = set(re.findall(r'\bid="([^"]+)"', text))
          fors = re.findall(r'<label[^>]*\bfor="([^"]+)"', text, re.I)
          missing = sorted({target for target in fors if target not in ids})
          if missing:
              raise SystemExit('Labels pointing to missing IDs: ' + ', '.join(missing))

          remaining = re.findall(r'<label(?![^>]*\bfor=)[^>]*>[^<]*</label>\s*<(?:input|select|textarea)\b[^>]*\bid="[^"]+"', text, re.I)
          if remaining:
              raise SystemExit(f'{len(remaining)} eligible labels remain unassociated')

          print(f'Validated {len(fors)} explicit label associations')
          PY
      - name: Remove one-off workflow and commit
        run: |
          git rm .github/workflows/fix-static-labels.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Associate form labels with existing controls'
          git push
