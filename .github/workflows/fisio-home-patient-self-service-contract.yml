name: Fisio Home Patient Self-Service Contract

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  contract:
    runs-on: [self-hosted, Windows, X64]
    defaults:
      run:
        shell: 'C:\PROGRA~1\Git\bin\bash.exe --noprofile --norc -eo pipefail {0}'
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate physiotherapist home and patient self-service
        run: |
          set -euo pipefail
          node --check src/home/home_fisioterapeuta_util-1.24.0.js
          node --check src/home/home_detalhes-1.18.5.js
          node --check src/home/home_profissional_dashboard-1.0.0.js
          node --check src/home/home_profissional_polish-1.0.0.js
          node --check src/agenda/agenda_notificacoes_core-1.20.1.js
          node --check src/core/operational_resume_refresh-1.0.0.js
          node --check src/core/script-1.18.0.js
          node --check src/patient/patient_chart_read_core-1.0.0.js
          node --check src/patient/patient_records_browse_core-1.0.0.js
          node --check tests/fisio_home_patient_self_service.contract.js
          node --check tests/home_atendimentos_24h.contract.js
          node --check tests/home_meu_dia_agenda_stability.contract.js
          node --check tests/performance_leitura_segura.contract.js
          node --check tests/no_business_data_performance_migration.contract.js
          node --check tests/cache_revalidation_meu_dia.contract.js
          node --check tests/frontend_performance_segura.contract.js
          node --check tests/professional_home_focus.contract.js
          node --check tests/professional_home_polish.contract.js
          node tests/fisio_home_patient_self_service.contract.js
          node tests/home_atendimentos_24h.contract.js
          node tests/home_meu_dia_agenda_stability.contract.js
          node tests/performance_leitura_segura.contract.js
          node tests/no_business_data_performance_migration.contract.js
          node tests/cache_revalidation_meu_dia.contract.js
          node tests/frontend_performance_segura.contract.js
          node tests/professional_home_focus.contract.js
          node tests/professional_home_polish.contract.js
          node tests/access_agenda_home4h.contract.js
          node tests/home_lifecycle.contract.js
          node tests/agenda_editar_atendimento.contract.js
          node tests/screen_loader.contract.js
          node tests/data_loading.contract.js
          node tests/operational_data_loading.contract.js
          node tests/prontuario_export_lazy.contract.js
          node tests/mensagens_config_bootstrap.contract.js
          node tests/clinical_reasoning_shoulder_elbow.regression.js
          git diff --check
