name: Fisio Home Patient Self-Service Contract

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Aplicar correção estrutural do Meu dia
        if: github.event_name == 'push' && github.actor != 'github-actions[bot]'
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess

          core_path=Path('src/core/script-1.18.0.js')
          core=core_path.read_text(encoding='utf-8')
          call="        carregarPainelFisioterapeuta();\n"
          if call not in core:
              raise SystemExit('Chamada legada do Meu dia não encontrada no core')
          core=core.replace(call,'',1)
          start=core.find('async function carregarPainelFisioterapeuta(){')
          end=core.find('async function renderizarPendenciasClinicas(){',start)
          if start<0 or end<0:
              raise SystemExit('Implementação legada do Meu dia não encontrada no core')
          core=core[:start]+core[end:]
          core_path.write_text(core,encoding='utf-8')

          index_path=Path('index.html')
          html=index_path.read_text(encoding='utf-8')
          replacements=[
            ('src/core/script-1.18.0.js?v=20260910-hma-perf-r3&patient_self_service=20260910-r1&access_admin=20260910-r1&data_cache=20260911-r1&core_mod=20260911-phase4s-r1','src/core/script-1.18.0.js?v=20260915-meu-dia-single-owner-r7'),
            ('src/home/home_fisioterapeuta_util-1.24.0.js?v=20260910-r3&fisio_home=20260910-r1&home4h=20260910-r1','src/home/home_fisioterapeuta_util-1.24.0.js?v=20260915-meu-dia-single-owner-r7'),
            ('src/core/operational_resume_refresh-1.0.0.js?v=20260912-home-mobile-r5','src/core/operational_resume_refresh-1.0.0.js?v=20260915-agenda-only-r7')
          ]
          for old,new in replacements:
              if old not in html:
                  raise SystemExit('Asset antigo não encontrado: '+old)
              html=html.replace(old,new,1)
          index_path.write_text(html,encoding='utf-8')

          clean=subprocess.check_output(['git','show','d32d20c1560d8f7068f2fd1c04fc7707abc420a0:src/home/home_profissional_polish-1.0.0.js'],text=True)
          Path('src/home/home_profissional_polish-1.0.0.js').write_text(clean,encoding='utf-8')

          test=r'''\
'use strict';
const fs=require('fs');
const assert=require('assert');
const core=fs.readFileSync('src/core/script-1.18.0.js','utf8');
const home=fs.readFileSync('src/home/home_fisioterapeuta_util-1.24.0.js','utf8');
const resume=fs.readFileSync('src/core/operational_resume_refresh-1.0.0.js','utf8');
const polish=fs.readFileSync('src/home/home_profissional_polish-1.0.0.js','utf8');
const html=fs.readFileSync('index.html','utf8');
assert.doesNotMatch(core,/async function carregarPainelFisioterapeuta\s*\(/,'core não pode possuir segunda implementação do Meu dia');
const nav=(core.match(/if \(idTela === 'tela_home'\) \{[\s\S]*?\n    \}/)||[''])[0];
assert.doesNotMatch(nav,/carregarPainelFisioterapeuta\s*\(/,'Home não deve disparar carregador legado');
assert.match(home,/window\.carregarPainelFisioterapeuta=garantirPainelFisioterapeuta/,'módulo Home deve ser o único dono público');
assert.match(home,/lista\.replaceChildren\(fragmento\)/,'renderização deve ser atômica');
assert.match(home,/id==='tela_agenda'[\s\S]*atualizarPainelFisioterapeuta\(\{motivo:'agenda'\}\)/,'Agenda deve atualizar a fotografia do Meu dia');
assert.doesNotMatch(resume,/revalidarMeuDiaClinico|normalizeMeuDia|observeMeuDia/,'resume não pode ser segundo dono');
assert.doesNotMatch(polish,/removerDuplicatasMeuDia|chaveLinhaMeuDia|ksMeuDiaDeduplicado/,'polish não deve conter hotfix de deduplicação');
assert.match(html,/script-1\.18\.0\.js\?v=20260915-meu-dia-single-owner-r7/);
assert.match(html,/home_fisioterapeuta_util-1\.24\.0\.js\?v=20260915-meu-dia-single-owner-r7/);
assert.match(html,/operational_resume_refresh-1\.0\.0\.js\?v=20260915-agenda-only-r7/);
console.log('Meu dia single-owner contract: OK');
'''
          Path('tests/meu_dia_single_owner.contract.js').write_text(test,encoding='utf-8')
          PY

          node --check src/core/script-1.18.0.js
          node --check src/home/home_fisioterapeuta_util-1.24.0.js
          node --check src/home/home_profissional_polish-1.0.0.js
          node --check src/core/operational_resume_refresh-1.0.0.js
          node --check tests/meu_dia_single_owner.contract.js
          node tests/meu_dia_single_owner.contract.js
          git diff --check

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/core/script-1.18.0.js src/home/home_profissional_polish-1.0.0.js index.html tests/meu_dia_single_owner.contract.js
          git commit -m 'fix(home): tornar Meu dia clínico fonte única no runtime'
          git push origin HEAD:main

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate physiotherapist home and patient self-service
        run: |
          set -euo pipefail
          node --check src/home/home_fisioterapeuta_util-1.24.0.js
          node --check src/home/home_detalhes-1.18.5.js
          node --check src/home/home_profissional_dashboard-1.0.0.js
          node --check src/home/home_profissional_polish-1.0.0.js
          node --check src/agenda/agenda_notificacoes_core-1.20.1.js
          node --check src/core/operational_resume_refresh-1.0.0.js
          node --check src/core/script-1.18.0.js
          node --check tests/fisio_home_patient_self_service.contract.js
          node --check tests/home_atendimentos_24h.contract.js
          node --check tests/home_meu_dia_agenda_stability.contract.js
          node tests/fisio_home_patient_self_service.contract.js
          node tests/home_atendimentos_24h.contract.js
          node tests/home_meu_dia_agenda_stability.contract.js
          git diff --check
