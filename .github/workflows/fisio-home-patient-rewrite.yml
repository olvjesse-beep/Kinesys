name: Fisio Home Patient Rewrite

on:
  push:
    branches:
      - fix/fisio-home-patient-self-service

permissions:
  contents: write

jobs:
  rewrite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/fisio-home-patient-self-service
          fetch-depth: 0
      - name: Apply incremental changes
        run: python .github/scripts/fisio_home_patient_transform.py
      - name: Validate new and consolidated contracts
        shell: bash
        run: |
          set -euo pipefail
          node --check home_fisioterapeuta_util-1.24.0.js
          node --check script-1.18.0.js
          node --check tests/fisio_home_patient_self_service.contract.js
          node tests/fisio_home_patient_self_service.contract.js
          node tests/agenda_editar_atendimento.contract.js
          node tests/screen_loader.contract.js
          node tests/data_loading.contract.js
          node tests/operational_data_loading.contract.js
          node tests/prontuario_export_lazy.contract.js
          node tests/mensagens_config_bootstrap.contract.js
          node tests/clinical_reasoning_shoulder_elbow.regression.js
          git diff --check
      - name: Commit permanent implementation only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add home_fisioterapeuta_util-1.24.0.js script-1.18.0.js index.html tests/fisio_home_patient_self_service.contract.js SUPABASE_SQL/SUPABASE_MIGRACAO_EXCLUSAO_PACIENTE_SELF_SERVICE_v1.24.1.sql
          if git diff --cached --quiet; then
            echo 'No permanent changes to commit'
            exit 0
          fi
          git commit -m "Fix physiotherapist home and patient self-service"
          git push origin HEAD:fix/fisio-home-patient-self-service
