name: TEMP Audit Agenda Crossrefs
on:
  push:
    branches:
      - perf/phase-4b-agenda-lazy
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Find cross-module Agenda references
        shell: bash
        run: |
          python3 - <<'PY'
          import re, pathlib
          agenda=pathlib.Path('agenda-1.20.0.js').read_text(encoding='utf-8')
          funcs=sorted(set(re.findall(r'(?m)^(?:async\s+)?function\s+([A-Za-z_$][\w$]*)\s*\(',agenda)))
          tops=sorted(set(re.findall(r'(?m)^(?:let|const|var)\s+([A-Za-z_$][\w$]*)\s*=',agenda)))
          files=[p for p in pathlib.Path('.').glob('*.js') if p.name!='agenda-1.20.0.js']
          print('=== function crossrefs ===')
          for name in funcs:
              hits=[]
              rx=re.compile(r'\b'+re.escape(name)+r'\b')
              for p in files:
                  txt=p.read_text(encoding='utf-8',errors='ignore')
                  if rx.search(txt): hits.append(p.name)
              if hits: print(name+': '+', '.join(hits))
          print('=== top-level variable crossrefs ===')
          for name in tops:
              hits=[]
              rx=re.compile(r'\b'+re.escape(name)+r'\b')
              for p in files:
                  txt=p.read_text(encoding='utf-8',errors='ignore')
                  if rx.search(txt): hits.append(p.name)
              if hits: print(name+': '+', '.join(hits))
          PY
