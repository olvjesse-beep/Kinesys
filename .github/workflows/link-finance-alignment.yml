name: One-time link finance alignment

on:
  push:
    paths:
      - '.github/workflows/link-finance-alignment.yml'

permissions:
  contents: write

jobs:
  link:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Link finance alignment stylesheet last
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          text=p.read_text(encoding='utf-8')
          anchor='    <link rel="stylesheet" href="design_experience.css?v=20260909-ux-r1">'
          link='    <link rel="stylesheet" href="financeiro_alignment.css?v=20260909-align-r1">'
          if link in text:
              raise SystemExit('financeiro_alignment.css already linked')
          if text.count(anchor)!=1:
              raise SystemExit(f'Expected one anchor, found {text.count(anchor)}')
          p.write_text(text.replace(anchor, anchor+'\n'+link),encoding='utf-8')
          PY
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Load Financeiro alignment layer"
          git push
