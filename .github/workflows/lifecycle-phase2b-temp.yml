name: Lifecycle Phase 2B Temp

on:
  push:
    branches:
      - performance/lifecycle-phase2b

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: performance/lifecycle-phase2b
          fetch-depth: 0
      - name: Apply lifecycle patch
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = 'script-1.18.0.js';
          let s = fs.readFileSync(path, 'utf8');

          const varsOld = `let midiaPollTimer = null;\nlet midiaUltimaQuantidadeLocal = 0;`;
          const varsNew = `let midiaPollTimer = null;\nlet midiaPollingCapturaSolicitado = false;\nlet kinesysLocalStatusTimer = null;\nlet midiaUltimaQuantidadeLocal = 0;`;
          if (!s.includes(varsOld)) throw new Error('Bloco de variáveis de Mídias não encontrado');
          s = s.replace(varsOld, varsNew);

          const pollingOld = `function iniciarPollingMidias() {\n    if (midiaPollTimer) clearInterval(midiaPollTimer);\n    midiaPollTimer = setInterval(async()=>{\n        const id=await sincronizarPacienteMidias(false); if(!id) return;\n        try {\n            const locais=await obterMidiasLocais(id);\n            if (locais.length > midiaUltimaQuantidadeLocal) {\n                midiaUltimaQuantidadeLocal = locais.length;\n                const msg=document.getElementById('midia_capture_status'); if(msg) msg.textContent='✓ Foto recebida e vinculada ao prontuário.';\n                await atualizarGaleriaMidias(true);\n            }\n        } catch(_){}\n    },1800);\n}`;
          const pollingNew = `function telaMidiasAtivaKineSys() {\n    return !!document.getElementById('tela_midias')?.classList.contains('ativa');\n}\n\nfunction suspenderPollingCapturaMidias() {\n    if (midiaPollTimer) {\n        clearInterval(midiaPollTimer);\n        midiaPollTimer = null;\n    }\n}\n\nfunction iniciarPollingMidias() {\n    midiaPollingCapturaSolicitado = true;\n    suspenderPollingCapturaMidias();\n    if (!telaMidiasAtivaKineSys()) return;\n    midiaPollTimer = setInterval(async()=>{\n        if (!telaMidiasAtivaKineSys()) return;\n        const id=await sincronizarPacienteMidias(false); if(!id) return;\n        try {\n            const locais=await obterMidiasLocais(id);\n            if (locais.length > midiaUltimaQuantidadeLocal) {\n                midiaUltimaQuantidadeLocal = locais.length;\n                const msg=document.getElementById('midia_capture_status'); if(msg) msg.textContent='✓ Foto recebida e vinculada ao prontuário.';\n                await atualizarGaleriaMidias(true);\n            }\n        } catch(_){}\n    },1800);\n}\n\nfunction iniciarPollingStatusMidias() {\n    if (kinesysLocalStatusTimer || !telaMidiasAtivaKineSys()) return;\n    verificarKinesysLocal(false);\n    kinesysLocalStatusTimer = setInterval(() => {\n        if (telaMidiasAtivaKineSys()) verificarKinesysLocal(false);\n    }, 10000);\n}\n\nfunction suspenderPollingStatusMidias() {\n    if (!kinesysLocalStatusTimer) return;\n    clearInterval(kinesysLocalStatusTimer);\n    kinesysLocalStatusTimer = null;\n}\n\nfunction ativarLifecycleMidiasKineSys() {\n    iniciarPollingStatusMidias();\n    if (midiaPollingCapturaSolicitado) iniciarPollingMidias();\n}\n\nfunction suspenderLifecycleMidiasKineSys() {\n    suspenderPollingStatusMidias();\n    suspenderPollingCapturaMidias();\n}`;
          if (!s.includes(pollingOld)) throw new Error('Função iniciarPollingMidias original não encontrada');
          s = s.replace(pollingOld, pollingNew);

          const globalOld = `// Mantém o indicador do serviço atualizado quando a tela de mídias está aberta.\ndocument.addEventListener('DOMContentLoaded',function(){\n    setTimeout(()=>verificarKinesysLocal(false),900);\n    setInterval(()=>{if(document.getElementById('tela_midias')?.classList.contains('ativa'))verificarKinesysLocal(false);},10000);\n});`;
          const globalNew = `// Mantém o serviço local ativo somente enquanto a tela de Mídias está em uso.\ndocument.addEventListener('kinesys:tela-ativada', event => {\n    if (event.detail?.id === 'tela_midias') ativarLifecycleMidiasKineSys();\n});\ndocument.addEventListener('kinesys:tela-desativada', event => {\n    if (event.detail?.id === 'tela_midias') suspenderLifecycleMidiasKineSys();\n});`;
          if (!s.includes(globalOld)) throw new Error('Polling global de status de Mídias não encontrado');
          s = s.replace(globalOld, globalNew);

          fs.writeFileSync(path, s);
          NODE
      - name: Remove temporary workflow
        run: rm .github/workflows/lifecycle-phase2b-temp.yml
      - name: Validate syntax and diff
        run: |
          node --check script-1.18.0.js
          git diff --check
          git diff -- script-1.18.0.js
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add script-1.18.0.js .github/workflows/lifecycle-phase2b-temp.yml
          git commit -m "Performance — Media lifecycle Phase 2B"
          git push origin HEAD:performance/lifecycle-phase2b
