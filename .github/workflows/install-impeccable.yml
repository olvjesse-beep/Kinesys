name: Install Impeccable for Codex

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/install-impeccable.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install Impeccable for Codex in this project
        run: npx -y impeccable@latest install -y --providers=codex --scope=project --no-hooks

      - name: Commit generated Codex skill files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .agents .codex
          if git diff --cached --quiet; then
            echo "No Impeccable changes to commit."
            exit 0
          fi
          git commit -m "Add Impeccable Codex skill"
          git push
