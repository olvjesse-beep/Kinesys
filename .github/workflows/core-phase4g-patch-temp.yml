name: Core Modularization Phase 4G Patch Temp

on:
  push:
    branches:
      - performance/core-modularization-phase4g
    paths:
      - .github/workflows/core-phase4g-patch-temp.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: performance/core-modularization-phase4g
      - name: Extract CRM relationship core
        run: |
          python - <<'PY'
          from pathlib import Path
          corep=Path('script-1.18.0.js')
          core=corep.read_text(encoding='utf-8')
          start='/* ==========================================================================\n   MÓDULO CRM E RELACIONAMENTO\n   ========================================================================== */'
          end='/* ================= 13. MAPEAMENTO ANATÔMICO (RADAR DE CLUSTERS ORTOPÉDICOS) ================='
          if core.count(start)!=1 or core.count(end)!=1:
              raise SystemExit(f'fronteiras inesperadas start={core.count(start)} end={core.count(end)}')
          a=core.index(start); b=core.index(end,a)
          block=core[a:b]
          Path('crm_relationship_core-1.0.0.js').write_text("/* KineSys — CRM Relationship Core 1.0.0\n * CRM e relacionamento extraídos do core sem alterar contratos históricos.\n */\n'use strict';\n\n"+block,encoding='utf-8')
          corep.write_text(core[:a]+core[b:],encoding='utf-8')
          ip=Path('index.html'); html=ip.read_text(encoding='utf-8')
          anchor='    <script defer src="input_helpers_core-1.0.0.js?v=20260911-phase4f-r1"></script>\n'
          tag='    <script defer src="crm_relationship_core-1.0.0.js?v=20260911-phase4g-r1"></script>\n'
          if html.count(anchor)!=1: raise SystemExit('anchor index inesperado')
          ip.write_text(html.replace(anchor,anchor+tag,1),encoding='utf-8')
          PY
      - name: Add permanent contract and workflow
        run: |
          cat > tests/crm_relationship_modularization.contract.js <<'EOF'
          'use strict';
          const fs=require('fs'); const assert=require('assert');
          const core=fs.readFileSync('script-1.18.0.js','utf8');
          const mod=fs.readFileSync('crm_relationship_core-1.0.0.js','utf8');
          const html=fs.readFileSync('index.html','utf8');
          assert(!core.includes('MÓDULO CRM E RELACIONAMENTO'),'CRM ainda embutido no monólito');
          assert(mod.includes('MÓDULO CRM E RELACIONAMENTO'),'módulo perdeu marcador CRM');
          for(const fn of ['popularSelectCRM','carregarPacienteCRM','enviarWhatsApp','obterProximoAgendamento']) {
            assert(mod.includes(`function ${fn}(`) || mod.includes(`async function ${fn}(`),`módulo perdeu ${fn}`);
          }
          assert(mod.includes('let pacienteCRM = null;'),'módulo perdeu estado pacienteCRM');
          assert(!core.includes('let pacienteCRM = null;'),'estado pacienteCRM permaneceu no core');
          const tag='<script defer src="crm_relationship_core-1.0.0.js?v=20260911-phase4g-r1"></script>';
          const input='<script defer src="input_helpers_core-1.0.0.js?v=20260911-phase4f-r1"></script>';
          const main='<script defer src="script-1.18.0.js';
          assert(html.includes(tag),'index não carrega CRM core');
          assert(html.indexOf(input)<html.indexOf(tag),'CRM deve carregar após input helpers');
          assert(html.indexOf(tag)<html.indexOf(main),'CRM deve carregar antes do core consumidor');
          for(const api of ['popularSelectCRM','carregarPacienteCRM','enviarWhatsApp']) assert(html.includes(api),`HTML perdeu consumidor ${api}`);
          console.log('CRM relationship modularization contract Phase 4G: OK');
          EOF
          cat > .github/workflows/crm-relationship-contract.yml <<'EOF'
          name: CRM Relationship Contract

          on:
            pull_request:
              branches: [main]
              paths:
                - 'index.html'
                - 'script-1.18.0.js'
                - 'crm_relationship_core-1.0.0.js'
                - 'tests/crm_relationship_modularization.contract.js'
                - '.github/workflows/crm-relationship-contract.yml'
            push:
              branches: [main]
              paths:
                - 'index.html'
                - 'script-1.18.0.js'
                - 'crm_relationship_core-1.0.0.js'
                - 'tests/crm_relationship_modularization.contract.js'
                - '.github/workflows/crm-relationship-contract.yml'
            workflow_dispatch:

          permissions:
            contents: read

          jobs:
            contract:
              runs-on: ubuntu-latest
              timeout-minutes: 5
              steps:
                - uses: actions/checkout@v4
                - name: JavaScript syntax
                  run: |
                    node --check crm_relationship_core-1.0.0.js
                    node --check script-1.18.0.js
                    node --check tests/crm_relationship_modularization.contract.js
                - name: CRM relationship modularization contract
                  run: node tests/crm_relationship_modularization.contract.js
          EOF
      - name: Validate extraction
        run: |
          set -euo pipefail
          node --check crm_relationship_core-1.0.0.js
          node --check script-1.18.0.js
          node --check tests/crm_relationship_modularization.contract.js
          node tests/crm_relationship_modularization.contract.js
          node tests/input_helpers_modularization.contract.js
          node tests/cadastro_validacoes_modularization.contract.js
          node tests/midias_core_modularization.contract.js
          node tests/html_escape_modularization.contract.js
          node tests/operation_guard_modularization.contract.js
          node tests/menu_dropdown_modularization.contract.js
          node tests/screen_loader.contract.js
          node tests/data_loading.contract.js
          git diff --check
      - name: Commit source changes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add script-1.18.0.js index.html crm_relationship_core-1.0.0.js tests/crm_relationship_modularization.contract.js .github/workflows/crm-relationship-contract.yml
          git commit -m "Extract CRM relationship core for Phase 4G" || exit 0
          git push origin HEAD:performance/core-modularization-phase4g
