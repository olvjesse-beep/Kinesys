name: Cache Phase 4I Audit Temp

on:
  push:
    branches: [performance/cache-modularization-phase4i]
    paths:
      - '.github/workflows/cache-phase4i-audit-temp.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Audit cache boundaries
        shell: bash
        run: |
          set -euo pipefail
          echo '=== MAIN CORE SIZE ==='
          wc -l -c script-1.18.0.js kinesys_data_cache-1.0.0.js
          echo '=== SECTION MARKERS AROUND PATIENT/DATA ==='
          grep -nE '^/\*.*(PACIENT|CACHE|DADOS|PRONT|BUSCA|HOME)|^/\* =+.*(PACIENT|CACHE|DADOS|PRONT|BUSCA|HOME)' script-1.18.0.js | head -n 120 || true
          echo '=== DATA CACHE REFERENCES ==='
          grep -nE 'KineSysDataCache|KINESYS_PACIENTES_BASICOS_CACHE|chaveCachePacientesBasicos|invalidarCachePacientesBasicos|obterPacientesBasicos|consultarPacientesBasicosNaNuvem|lerPacientesLocaisComSeguranca' script-1.18.0.js || true
          echo '=== EXTERNAL REFERENCES ==='
          grep -RInE 'chaveCachePacientesBasicos|invalidarCachePacientesBasicos|obterPacientesBasicos|consultarPacientesBasicosNaNuvem|lerPacientesLocaisComSeguranca' --include='*.js' --include='*.html' . | grep -v '^./script-1.18.0.js:' | grep -v '^./.git/' || true
          echo '=== MUTATION INVALIDATION CONTEXT ==='
          grep -n -B4 -A5 'invalidarCachePacientesBasicos' script-1.18.0.js || true
          echo '=== CACHE CONTRACTS ==='
          ls tests/*cache* 2>/dev/null || true
          grep -RIn 'pacientes::basicos' tests .github/workflows --exclude='cache-phase4i-audit-temp.yml' || true
          echo '=== CORE SECTION HEADERS ==='
          grep -nE '^/\*.*={5,}|^// ={5,}' script-1.18.0.js | head -n 220 || true
