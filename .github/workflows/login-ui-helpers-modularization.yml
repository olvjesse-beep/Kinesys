name: Login UI Helpers Modularization Contract

on:
  push:
    branches: [main]
    paths:
      - 'login_ui_helpers_core-1.0.0.js'
      - 'login_access-1.18.0.js'
      - 'script-1.18.0.js'
      - 'index.html'
      - 'tests/login_ui_helpers_modularization.contract.js'
      - '.github/workflows/login-ui-helpers-modularization.yml'
  pull_request:
    paths:
      - 'login_ui_helpers_core-1.0.0.js'
      - 'login_access-1.18.0.js'
      - 'script-1.18.0.js'
      - 'index.html'
      - 'tests/login_ui_helpers_modularization.contract.js'
      - '.github/workflows/login-ui-helpers-modularization.yml'

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: JavaScript syntax
        run: |
          node --check login_ui_helpers_core-1.0.0.js
          node --check login_access-1.18.0.js
          node --check script-1.18.0.js
          node --check tests/login_ui_helpers_modularization.contract.js
      - name: Login UI helpers modularization contract
        run: node tests/login_ui_helpers_modularization.contract.js
      - name: Whitespace integrity
        run: git diff --check HEAD^
