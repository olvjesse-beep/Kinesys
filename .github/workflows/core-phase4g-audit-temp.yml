name: Core Modularization Phase 4G Audit Temp

on:
  push:
    branches:
      - performance/core-modularization-phase4g
    paths:
      - .github/workflows/core-phase4g-audit-temp.yml

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Audit next low-risk boundaries
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          lines=Path('script-1.18.0.js').read_text(encoding='utf-8').splitlines()
          print('LINES',len(lines))
          print('SECTIONS')
          for i,l in enumerate(lines,1):
              if re.search(r'/\*\s*=+|KINESYS v|PARTE \d',l):
                  s=l.strip()
                  if s: print(i,s[:180])
          print('LOW_RISK_FUNCS')
          funcs=[]
          for i,l in enumerate(lines,1):
              m=re.match(r'\s*(?:async\s+)?function\s+([A-Za-z_$][A-Za-z0-9_$]*)\s*\(',l)
              if m: funcs.append((i,m.group(1)))
          banned=r'auth|login|permiss|agenda|supabase|hma|motor|clinical|avaliacao|evolucao|relatorio|financeiro|equipe|usuarioLogado|pacienteAtualId|BANCO_MAPEAMENTO|radar|score|hipotese|diagnost'
          for idx,(ln,name) in enumerate(funcs):
              end=(funcs[idx+1][0]-1) if idx+1<len(funcs) else len(lines)
              size=end-ln+1
              if 8<=size<=140:
                  block='\n'.join(lines[ln-1:end])
                  if not re.search(banned,block,re.I):
                      print(f'{ln}-{end} {size:4d} {name}')
          PY
