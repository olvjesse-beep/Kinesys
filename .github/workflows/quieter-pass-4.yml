name: KineSys quieter visual pass 4

on:
  push:
    paths:
      - '.github/workflows/quieter-pass-4.yml'

permissions:
  contents: write

jobs:
  quieter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply final low-risk visual cleanup
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new, label):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 occurrence, found {count}')
              p.write_text(text.replace(old, new), encoding='utf-8')

          replace_once(
              'design_features.css',
              '.ks-config-note{font-size:var(--kds-font-metadata);color:var(--kds-text-subtle);line-height:1.5;background:#F8FAF9;border-left:3px solid #7FAFA4;padding:10px 12px;margin-top:12px}',
              '.ks-config-note{font-size:var(--kds-font-metadata);color:var(--kds-text-subtle);line-height:1.5;background:var(--kds-surface-soft);border:1px solid var(--kds-line-soft);border-radius:var(--kds-radius-sm);padding:10px 12px;margin-top:12px}',
              'config note surface'
          )

          replace_once(
              'design_agenda.css',
              '#tela_agenda .agenda-celula.bloqueado .agenda-bloqueio-texto{padding:5px 6px;color:#fff;font-size:var(--kds-font-metadata);line-height:1.2;font-weight:800}',
              '#tela_agenda .agenda-celula.bloqueado .agenda-bloqueio-texto{padding:5px 6px;color:#fff;font-size:var(--kds-font-metadata);line-height:var(--kds-leading-ui);font-weight:800}',
              'agenda blocked text leading'
          )

          replace_once(
              'design_base.css',
              'box-shadow: 0 8px 30px rgba(23,59,69,0.12);',
              'box-shadow: 0 8px 24px rgba(0,0,0,.10);',
              'document preview neutral elevation'
          )
          PY

          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add design_features.css design_agenda.css design_base.css
          git diff --cached --stat
          git diff --cached --exit-code >/dev/null && { echo 'No changes produced'; exit 1; } || true
          git commit -m "Refine final KineSys visual surfaces"
          git push
