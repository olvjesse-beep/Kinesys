name: Core Modularization Phase 4F Patch Temp

on:
  push:
    branches:
      - performance/core-modularization-phase4f
    paths:
      - .github/workflows/core-phase4f-patch-temp.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: performance/core-modularization-phase4f
      - name: Extract EVA and autocomplete UI core
        run: |
          python - <<'PY'
          from pathlib import Path
          corep=Path('script-1.18.0.js')
          core=corep.read_text(encoding='utf-8')
          start='/* ================= 5. TERMÔMETRO DA DOR (ESCALA EVA) ================= */'
          end='/* ==========================================================================' + '\n   KINESYS - SCRIPT DEFINITIVO (ID ÚNICO E SEM DUPLICATAS) - PARTE 3 DE 4'
          if core.count(start)!=1 or core.count(end)!=1:
              raise SystemExit(f'fronteiras inesperadas start={core.count(start)} end={core.count(end)}')
          a=core.index(start); b=core.index(end,a)
          block=core[a:b]
          Path('input_helpers_core-1.0.0.js').write_text("/* KineSys — Input Helpers Core 1.0.0\n * EVA e autocompletes extraídos do core sem alterar contratos históricos.\n */\n'use strict';\n\n"+block,encoding='utf-8')
          corep.write_text(core[:a]+core[b:],encoding='utf-8')
          ip=Path('index.html'); html=ip.read_text(encoding='utf-8')
          anchor='    <script defer src="cadastro_validacoes_core-1.0.0.js?v=20260911-phase4e-r1"></script>\n'
          tag='    <script defer src="input_helpers_core-1.0.0.js?v=20260911-phase4f-r1"></script>\n'
          if html.count(anchor)!=1: raise SystemExit('anchor index inesperado')
          ip.write_text(html.replace(anchor,anchor+tag,1),encoding='utf-8')
          PY
      - name: Add permanent contract
        run: |
          cat > tests/input_helpers_modularization.contract.js <<'EOF'
          'use strict';
          const fs=require('fs'); const assert=require('assert');
          const core=fs.readFileSync('script-1.18.0.js','utf8');
          const mod=fs.readFileSync('input_helpers_core-1.0.0.js','utf8');
          const html=fs.readFileSync('index.html','utf8');
          assert(!core.includes('TERMÔMETRO DA DOR (ESCALA EVA)'), 'EVA ainda embutido no monólito');
          assert(!core.includes('AUTOCOMPLETES (RESTAURADOS E ORIGINAIS)'), 'autocompletes ainda embutidos no monólito');
          assert(mod.includes('TERMÔMETRO DA DOR (ESCALA EVA)'), 'módulo perdeu EVA');
          assert(mod.includes('AUTOCOMPLETES (RESTAURADOS E ORIGINAIS)'), 'módulo perdeu autocompletes');
          for(const fn of ['aplicarClasseEvaKineSys','toggleCirurgias','expandirSugestoesIndividuais','adicionarTagCirurgia','adicionarTagMedicamento']) assert(mod.includes(`function ${fn}(`),`módulo perdeu ${fn}`);
          for(const state of ['OPCOES_INDIVIDUAIS_OCUPACAO_ESPORTE','OPCOES_INDIVIDUAIS_CIRURGIAS']) assert(mod.includes(`const ${state} =`),`módulo perdeu ${state}`);
          assert(!core.includes('OPCOES_INDIVIDUAIS_OCUPACAO_ESPORTE'), 'estado autocomplete vazou para core');
          assert(!core.includes('OPCOES_INDIVIDUAIS_CIRURGIAS'), 'estado cirurgias vazou para core');
          const tag='<script defer src="input_helpers_core-1.0.0.js?v=20260911-phase4f-r1"></script>';
          const cadastro='<script defer src="cadastro_validacoes_core-1.0.0.js?v=20260911-phase4e-r1"></script>';
          const media='<script defer src="midias_core-1.0.0.js?v=20260911-phase4d-r1"></script>';
          const main='<script defer src="script-1.18.0.js';
          assert(html.includes(tag),'index não carrega input helpers');
          assert(html.indexOf(cadastro)<html.indexOf(tag),'input helpers deve carregar após cadastro validations');
          assert(html.indexOf(tag)<html.indexOf(media),'input helpers deve carregar antes de mídias');
          assert(html.indexOf(tag)<html.indexOf(main),'input helpers deve carregar antes do core consumidor');
          console.log('Input helpers modularization contract Phase 4F: OK');
          EOF
      - name: Validate extraction
        run: |
          set -euo pipefail
          node --check input_helpers_core-1.0.0.js
          node --check script-1.18.0.js
          node --check tests/input_helpers_modularization.contract.js
          node tests/input_helpers_modularization.contract.js
          node tests/cadastro_validacoes_modularization.contract.js
          node tests/midias_core_modularization.contract.js
          node tests/html_escape_modularization.contract.js
          node tests/operation_guard_modularization.contract.js
          node tests/menu_dropdown_modularization.contract.js
          node tests/screen_loader.contract.js
          node tests/data_loading.contract.js
          git diff --check
      - name: Commit source changes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add script-1.18.0.js index.html input_helpers_core-1.0.0.js tests/input_helpers_modularization.contract.js
          git commit -m "Extract input helpers core for Phase 4F" || exit 0
          git push origin HEAD:performance/core-modularization-phase4f
