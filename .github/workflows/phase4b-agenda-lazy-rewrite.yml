name: Phase 4B Agenda lazy rewrite

on:
  push:
    branches: [performance/agenda-lazy-phase4b]
    paths:
      - '.github/workflows/phase4b-agenda-lazy-rewrite.yml'

permissions:
  contents: write

jobs:
  rewrite:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: performance/agenda-lazy-phase4b
          fetch-depth: 0

      - name: Apply exact Phase 4B rewrite
        run: python .github/scripts/phase4b_agenda_lazy.py

      - name: Validate Phase 4B with captured diagnostics
        shell: bash
        run: |
          set -uo pipefail
          log=.github/phase4b-validation.txt
          : > "$log"
          status=0
          run_check() {
            echo "===== $* =====" | tee -a "$log"
            "$@" >> "$log" 2>&1
            code=$?
            echo "EXIT=$code" | tee -a "$log"
            echo >> "$log"
            if [ "$code" -ne 0 ]; then status=1; fi
          }

          run_check node --check screen_loader-1.25.0.js
          run_check node --check agenda-1.20.0.js
          run_check node --check agenda_notificacoes_core-1.20.1.js
          run_check node --check financeiro_agendamento-1.21.0.js
          run_check node --check tests/screen_loader.contract.js
          run_check node tests/screen_loader.contract.js
          run_check node tests/data_loading.contract.js
          run_check node tests/operational_data_loading.contract.js
          run_check node tests/clinical_reasoning_shoulder_elbow.regression.js
          if [ -f tests/clinical_reasoning_shoulder_elbow.robustness.js ]; then run_check node tests/clinical_reasoning_shoulder_elbow.robustness.js; fi
          if [ -f tests/clinical_reasoning_hma.integration.js ]; then run_check node tests/clinical_reasoning_hma.integration.js; fi
          run_check git diff --check

          if [ "$status" -ne 0 ]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add "$log"
            git commit -m 'Record Phase 4B validation diagnostics'
            git push origin HEAD:performance/agenda-lazy-phase4b
            exit 1
          fi

          git diff --stat | tee -a "$log"
          rm -f "$log"

      - name: Commit permanent Phase 4B code
        shell: bash
        run: |
          if git diff --quiet && [ -z "$(git ls-files --others --exclude-standard)" ]; then
            echo 'No changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            index.html \
            screen_loader-1.25.0.js \
            agenda-1.20.0.js \
            agenda_notificacoes_core-1.20.1.js \
            financeiro_agendamento-1.21.0.js \
            tests/screen_loader.contract.js \
            .github/workflows/screen-loader-contract.yml
          git commit -m 'Lazy-load Agenda while preserving notification core'
          git push origin HEAD:performance/agenda-lazy-phase4b
