name: Fix checkbox keyboard accessibility

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fix-checkbox-keyboard.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch focusable checkbox pills
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('design_components.css')
          s = p.read_text(encoding='utf-8')
          old = '''.agenda-dia-pill input[type="radio"]{\n  position:absolute!important;'''
          new = '''.agenda-dia-pill input[type="radio"]{\n  display:block!important;\n  position:absolute!important;'''
          if old not in s:
              raise SystemExit('Expected accessibility block not found')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Validate fix
        shell: bash
        run: |
          grep -A14 'agenda-dia-pill input\[type="radio"\]' design_components.css | grep 'display:block!important'
          grep -q '.checkbox-pill input{ display: none; }' design_base.css

      - name: Remove one-off workflow and commit
        shell: bash
        run: |
          rm -f .github/workflows/fix-checkbox-keyboard.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix checkbox pill keyboard accessibility"
          git push
