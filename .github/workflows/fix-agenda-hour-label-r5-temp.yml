name: Agenda Hour Label R5 Temp

on:
  push:
    branches:
      - fix/agenda-hour-label-vertical-r5

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/agenda-hour-label-vertical-r5
          fetch-depth: 0
      - name: Apply hour-label fix
        run: python .github/scripts/fix_agenda_hour_label_r5.py
      - name: Validate
        shell: bash
        run: |
          set -euo pipefail
          node --check agenda-1.20.0.js
          node tests/access_agenda_home4h.contract.js
          node tests/agenda_editar_atendimento.contract.js
          node tests/screen_loader.contract.js
          node tests/data_loading.contract.js
          grep -q 'AGENDA HOUR LABEL VERTICAL FIX R5' design_agenda.css
          grep -q 'grid-row-end:span 3!important' design_agenda.css
          grep -q 'z-index:8!important' design_agenda.css
          grep -q 'design_agenda.css?v=20260910-compact-r5' index.html
          git diff --check
      - name: Commit permanent files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add design_agenda.css index.html
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Fix vertical clipping of Agenda hour labels"
          git push origin HEAD:fix/agenda-hour-label-vertical-r5
