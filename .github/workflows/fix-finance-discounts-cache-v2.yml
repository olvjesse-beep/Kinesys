name: One-time discounts cache bust v2

on:
  push:
    paths:
      - '.github/workflows/fix-finance-discounts-cache-v2.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply discounts markup and cache bust
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          js_path = Path('descontos_financeiros-1.20.0.js')
          js = js_path.read_text(encoding='utf-8')
          old_small = '<small>Criado por: ${escapeHTML(autor)}</small>'
          new_small = '<br><small class="finance-discount-patient-author">Criado por: ${escapeHTML(autor)}</small>'
          if js.count(old_small) != 1:
              raise SystemExit(f'Expected one author markup; found {js.count(old_small)}')
          js = js.replace(old_small, new_small)
          old_patient = '<span><b>${escapeHTML(paciente)}</b>${criadoPor}</span>'
          new_patient = '<span class="finance-discount-patient"><b class="finance-discount-patient-name">${escapeHTML(paciente)}</b>${criadoPor}</span>'
          if js.count(old_patient) != 1:
              raise SystemExit(f'Expected one patient cell markup; found {js.count(old_patient)}')
          js = js.replace(old_patient, new_patient)
          js_path.write_text(js, encoding='utf-8')

          css_path = Path('financeiro_alignment.css')
          css = css_path.read_text(encoding='utf-8')
          marker = '/* Descontos v2 — separacao estrutural paciente/autor */'
          if marker not in css:
              css += '\n\n' + marker + '\n'
              css += '#tela_financeiro .finance-discount-patient{display:block!important;min-width:0!important;}\n'
              css += '#tela_financeiro .finance-discount-patient-name{display:block!important;line-height:1.35!important;}\n'
              css += '#tela_financeiro .finance-discount-patient-author{display:block!important;margin-top:4px!important;color:var(--kds-muted)!important;line-height:1.35!important;}\n'
          css_path.write_text(css, encoding='utf-8')

          index_path = Path('index.html')
          html = index_path.read_text(encoding='utf-8')
          replacements = {
              'financeiro_alignment.css?v=20260909-align-r1': 'financeiro_alignment.css?v=20260909-align-r3',
              'descontos_financeiros-1.20.0.js?v=20260901-r1': 'descontos_financeiros-1.20.0.js?v=20260909-r2',
          }
          for old, new in replacements.items():
              if html.count(old) != 1:
                  raise SystemExit(f'Expected one {old}; found {html.count(old)}')
              html = html.replace(old, new)
          index_path.write_text(html, encoding='utf-8')

          if css_path.read_text(encoding='utf-8').count('{') != css_path.read_text(encoding='utf-8').count('}'):
              raise SystemExit('CSS brace balance failed')
          PY
          node --check descontos_financeiros-1.20.0.js
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html financeiro_alignment.css descontos_financeiros-1.20.0.js
          git commit -m "Fix discounts cache bust and patient spacing"
          git push
