name: Run Motor 3.1.1 shoulder patch
on:
  push:
    paths:
      - '.github/workflows/run-motor311-shoulder-patch.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python .tmp_patch_motor311.py
      - run: node --check clinical_reasoning_shoulder-3.1.0.js
      - run: node --check clinical_reasoning_hma-3.0.0.js
      - run: git diff --check
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add clinical_reasoning_shoulder-3.1.0.js clinical_reasoning_shoulder-3.1.0.css index.html
          git commit -m "Refine Motor 3.1 shoulder vocabulary and exam matrix" || exit 0
          git push
