name: Core Modularization Phase 4F Boundary Temp

on:
  push:
    branches:
      - performance/core-modularization-phase4f
    paths:
      - .github/workflows/core-phase4f-boundary-temp.yml

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Audit EVA and autocomplete boundary
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          lines=Path('script-1.18.0.js').read_text(encoding='utf-8').splitlines()
          start=1116; end=1567
          funcs=[]
          for i in range(start-1,end):
              m=re.match(r'\s*(?:async\s+)?function\s+([A-Za-z_$][A-Za-z0-9_$]*)\s*\(',lines[i])
              if m: funcs.append((i+1,m.group(1)))
          print('FUNCS')
          for ln,name in funcs:
              hits=[i+1 for i,l in enumerate(lines) if re.search(r'\b'+re.escape(name)+r'\b',l)]
              outside=[n for n in hits if n<start or n>end]
              print(ln,name,'outside=',outside)
          print('TOP_LEVEL_STATE')
          names=[]
          for i in range(start-1,end):
              m=re.match(r'\s*(?:const|let|var)\s+([A-Za-z_$][A-Za-z0-9_$]*)\s*=',lines[i])
              if m:
                  name=m.group(1); names.append((i+1,name))
          for ln,name in names:
              hits=[i+1 for i,l in enumerate(lines) if re.search(r'\b'+re.escape(name)+r'\b',l)]
              outside=[n for n in hits if n<start or n>end]
              print(ln,name,'outside=',outside)
          PY
