name: Agenda UX Corrections Temp

on:
  push:
    branches:
      - agenda/ux-corrections-sep11
    paths:
      - tools/agenda_ux_patch_temp.py
      - tools/agenda_ux_trigger.tmp

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agenda/ux-corrections-sep11
      - name: Apply patch
        run: python tools/agenda_ux_patch_temp.py
      - name: Validate
        run: |
          node --check agenda-1.20.0.js
          node --check screen_loader-1.25.0.js
          node --check tests/agenda_editar_atendimento.contract.js
          node --check tests/agenda_ux_corrections.contract.js
          node tests/agenda_editar_atendimento.contract.js
          node tests/agenda_ux_corrections.contract.js
          node tests/screen_loader.contract.js
          git diff --check
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add agenda-1.20.0.js index.html screen_loader-1.25.0.js tests/agenda_editar_atendimento.contract.js
          git commit -m "Improve Agenda editing patient search and retroactive booking" || exit 0
          git push origin HEAD:agenda/ux-corrections-sep11
