          q_text=q_text.replace(old_append,new_append,1)

          old_kds_html="""          index_html = Path('index.html').read_text(encoding='utf-8')
          used_kds.update(re.findall(r'var\\(\\s*(--kds-[a-z0-9-]+)', index_html, re.I))
"""
          new_kds_html="""          html_runtime = '\\n'.join(path.read_text(encoding='utf-8') for path in [Path('index.html'), *sorted(Path('screens').glob('*.html'))])
          used_kds.update(re.findall(r'var\\(\\s*(--kds-[a-z0-9-]+)', html_runtime, re.I))
"""
          if q_text.count(old_kds_html)!=1:
