name: Phase 2C exact Evaluation DOM extraction

on:
  push:
    branches: [performance/screen-dom-phase2c]
    paths:
      - '.github/workflows/phase2c-extract-evaluation-dom.yml'

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: performance/screen-dom-phase2c
          fetch-depth: 0

      - name: Apply exact Phase 2C changes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def replace_once(path, old, new, label):
              p=Path(path)
              text=p.read_text(encoding='utf-8')
              count=text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one match, found {count}')
              p.write_text(text.replace(old,new,1),encoding='utf-8')

          # ------------------------------------------------------------------
          # 1) Extract ONLY the inner HTML of #tela_avaliacao.
          #    The shell keeps the exact public screen ID/class as placeholder.
          # ------------------------------------------------------------------
          index_path=Path('index.html')
          html=index_path.read_text(encoding='utf-8')
          start_marker='        <!-- TELA AVALIAÇÃO -->'
          next_marker='        <!-- TELA BUSCAR / PRONTUÁRIOS -->'
          if html.count(start_marker)!=1 or html.count(next_marker)!=1:
              raise SystemExit('Evaluation screen markers are not unique')
          start=html.index(start_marker)
          end=html.index(next_marker,start)
          block=html[start:end]
          opening='        <section id="tela_avaliacao" class="tela">\n'
          if block.count(opening)!=1:
              raise SystemExit(f'Evaluation outer section opening expected once, found {block.count(opening)}')
          open_pos=block.index(opening)
          close_pos=block.rfind('</section>')
          if close_pos < open_pos:
              raise SystemExit('Evaluation outer section closing tag not found')
          if block[close_pos+len('</section>'):].strip():
              raise SystemExit('Unexpected content after Evaluation outer closing section')
          inner=block[open_pos+len(opening):close_pos].rstrip()+"\n"
          if 'id="paciente_hma"' not in inner or 'id="subtela_diagnostico"' not in inner:
              raise SystemExit('Extracted Evaluation fragment is missing key clinical controls')
          if re.search(r'<script\b',inner,re.I):
              raise SystemExit('Evaluation fragment must not contain scripts')
          if re.search(r'\bid=["\']tela_avaliacao["\']',inner,re.I):
              raise SystemExit('Evaluation fragment must not duplicate the outer screen ID')
          Path('screens').mkdir(exist_ok=True)
          Path('screens/tela_avaliacao.html').write_text(inner,encoding='utf-8')
          placeholder=(
              '        <!-- TELA AVALIAÇÃO — DOM sob demanda (Fase 2C) -->\n'
              '        <section id="tela_avaliacao" class="tela" data-kinesys-fragment="screens/tela_avaliacao.html?v=20260910-phase2c-r1" data-kinesys-fragment-state="idle"></section>\n\n'
          )
          html=html[:start]+placeholder+html[end:]

          # Evaluation-only CSS now belongs to the lazy bundle too.
          lazy_styles=[
              'design_evaluation_workspace-1.18.0.css',
              'design_evaluation_context-1.18.3.css',
              'avaliacao_experiencia-1.22.0.css?v=20260904-tabs-r1',
              'clinical_reasoning_hma-3.0.0.css?v=20260910-r1',
              'clinical_reasoning_shoulder-3.1.0.css?v=20260910-r2',
              'clinical_reasoning_elbow-3.1.0.css?v=20260910-r1',
              'radar_clinico_focus-3.0.0.css?v=20260910-r1',
              'dialog_rascunho_focus-1.0.0.css?v=20260910-r1',
          ]
          for href in lazy_styles:
              pattern=re.compile(r'^[ \t]*<link\s+rel="stylesheet"\s+href="'+re.escape(href)+r'">\s*\n',re.M)
              html,count=pattern.subn('',html,count=1)
              if count!=1:
                  raise SystemExit(f'Expected one eager Evaluation stylesheet for {href}, found {count}')
          old_loader='<script defer src="screen_loader-1.25.0.js?v=20260910-phase2b-r1"></script>'
          new_loader='<script defer src="screen_loader-1.25.0.js?v=20260910-phase2c-r1"></script>'
          if html.count(old_loader)!=1:
              raise SystemExit(f'Screen Loader cache-buster expected once, found {html.count(old_loader)}')
          html=html.replace(old_loader,new_loader,1)
          index_path.write_text(html,encoding='utf-8')

          # ------------------------------------------------------------------
          # 2) Screen Loader: fragment -> CSS/JS -> DOM ready event -> navigation.
          # ------------------------------------------------------------------
          loader_path=Path('screen_loader-1.25.0.js')
          loader=loader_path.read_text(encoding='utf-8')
          replacements=[
              (" * Fase 2A: preserva IDs, funções públicas, contratos e regras clínicas."," * Fase 2C: preserva IDs, funções públicas, contratos e regras clínicas.",'loader phase comment'),
              ("const VERSION='1.25.0-phase2b';","const VERSION='1.25.0-phase2c';",'loader version'),
              ("    const estilos=new Map();\n    const bundles=new Map();","    const estilos=new Map();\n    const fragmentos=new Map();\n    const bundles=new Map();",'fragment cache map'),
              ("            id:'avaliacao',\n            styles:Object.freeze([","            id:'avaliacao',\n            fragment:'screens/tela_avaliacao.html?v=20260910-phase2c-r1',\n            styles:Object.freeze([",'Evaluation fragment registration'),
          ]
          for old,new,label in replacements:
              count=loader.count(old)
              if count!=1:
                  raise SystemExit(f'{label}: expected exactly one match, found {count}')
              loader=loader.replace(old,new,1)

          insertion_anchor="""    async function carregarScriptsEmOrdem(lista){
        for(const src of lista)await carregarScript(src);
    }

"""
          fragment_loader="""    async function carregarScriptsEmOrdem(lista){
        for(const src of lista)await carregarScript(src);
    }

    function carregarFragmento(idTela,bundle){
        if(!bundle?.fragment)return Promise.resolve(null);
        const alvo=document.getElementById(idTela);
        if(!alvo)return Promise.reject(new Error('Tela não encontrada para montagem: '+idTela));
        if(alvo.dataset.kinesysFragmentState==='mounted')return Promise.resolve(alvo);
        if(fragmentos.has(bundle.id))return fragmentos.get(bundle.id);

        alvo.dataset.kinesysFragmentState='loading';
        const promessa=(async()=>{
            const resposta=await fetch(bundle.fragment,{credentials:'same-origin',cache:'default'});
            if(!resposta.ok)throw new Error('Falha ao carregar tela '+idTela+' ('+resposta.status+')');
            const html=await resposta.text();
            if(!html.trim())throw new Error('Fragmento vazio para '+idTela);
            if(/<script\\b/i.test(html))throw new Error('Fragmento de tela não pode conter scripts: '+idTela);
            if(html.includes('id="'+idTela+'"')||html.includes("id='"+idTela+"'"))throw new Error('Fragmento duplicou o ID da tela: '+idTela);
            const template=document.createElement('template');
            template.innerHTML=html;
            alvo.replaceChildren(template.content.cloneNode(true));
            alvo.dataset.kinesysFragmentState='mounted';
            return alvo;
        })().catch(error=>{
            alvo.dataset.kinesysFragmentState='error';
            fragmentos.delete(bundle.id);
            throw error;
        });
        fragmentos.set(bundle.id,promessa);
        return promessa;
    }

"""
          if loader.count(insertion_anchor)!=1:
              raise SystemExit(f'fragment loader anchor expected once, found {loader.count(insertion_anchor)}')
          loader=loader.replace(insertion_anchor,fragment_loader,1)

          old_ensure="""        const promessa=(async()=>{
            await Promise.all([
                Promise.all(bundle.styles.map(carregarEstilo)),
                carregarScriptsEmOrdem(bundle.scripts)
            ]);
            bundle.afterLoad?.();
            bundles.set(bundle.id,'loaded');
            document.dispatchEvent(new CustomEvent('kinesys:tela-modulos-prontos',{detail:{id:idTela,bundle:bundle.id,versao:VERSION}}));
            return true;
        })().catch(error=>{
"""
          new_ensure="""        const promessa=(async()=>{
            const estilosProntos=Promise.all(bundle.styles.map(carregarEstilo));
            await carregarFragmento(idTela,bundle);
            await Promise.all([estilosProntos,carregarScriptsEmOrdem(bundle.scripts)]);
            if(bundle.fragment){
                document.dispatchEvent(new CustomEvent('kinesys:tela-dom-pronta',{detail:{id:idTela,bundle:bundle.id,fragmento:bundle.fragment,versao:VERSION}}));
            }
            bundle.afterLoad?.();
            bundles.set(bundle.id,'loaded');
            document.dispatchEvent(new CustomEvent('kinesys:tela-modulos-prontos',{detail:{id:idTela,bundle:bundle.id,versao:VERSION}}));
            return true;
        })().catch(error=>{
"""
          if loader.count(old_ensure)!=1:
              raise SystemExit(f'ensure sequence expected once, found {loader.count(old_ensure)}')
          loader=loader.replace(old_ensure,new_ensure,1)

          old_public="""        isLoaded(idTela){const bundle=bundleDaTela(idTela);return !bundle||bundles.get(bundle.id)==='loaded';},
        current(){return document.querySelector('.tela.ativa')?.id||telaAtiva||'';}
"""
          new_public="""        isLoaded(idTela){const bundle=bundleDaTela(idTela);return !bundle||bundles.get(bundle.id)==='loaded';},
        isMounted(idTela){const bundle=bundleDaTela(idTela);return !bundle?.fragment||document.getElementById(idTela)?.dataset.kinesysFragmentState==='mounted';},
        current(){return document.querySelector('.tela.ativa')?.id||telaAtiva||'';}
"""
          if loader.count(old_public)!=1:
              raise SystemExit(f'public loader contract expected once, found {loader.count(old_public)}')
          loader=loader.replace(old_public,new_public,1)
          loader_path.write_text(loader,encoding='utf-8')

          # ------------------------------------------------------------------
          # 3) Global app: bind Evaluation DOM only after fragment exists.
          # ------------------------------------------------------------------
          app_path=Path('script-1.18.0.js')
          app=app_path.read_text(encoding='utf-8')
          observer_anchor="""function instalarObservadorCicloVidaRadar() {
    const tela = document.getElementById('tela_avaliacao');
