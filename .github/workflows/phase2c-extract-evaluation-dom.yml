name: Phase 2C exact Evaluation DOM extraction

on:
  push:
    branches: [performance/screen-dom-phase2c]
    paths:
      - '.github/workflows/phase2c-extract-evaluation-dom.yml'

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: performance/screen-dom-phase2c
          fetch-depth: 0

      - name: Apply exact Phase 2C changes
        run: python .github/scripts/phase2c_rewrite.py

      - name: Validate Phase 2C
        shell: bash
        run: |
          set -euo pipefail
          node --check screen_loader-1.25.0.js
          node --check script-1.18.0.js
          node --check evaluation_workspace-1.17.0.js
          node --check proms_escalas.js
          node --check tests/screen_loader.contract.js
          node tests/screen_loader.contract.js
          node tests/clinical_reasoning_shoulder_elbow.regression.js
          git diff --check
          git diff --stat

      - name: Commit permanent Phase 2C code changes
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html screens/tela_avaliacao.html screen_loader-1.25.0.js script-1.18.0.js tests/screen_loader.contract.js
          if git diff --cached --quiet; then
            echo 'No staged code changes required.'
            exit 0
          fi
          git commit -m 'Externalize Evaluation DOM for Phase 2C'
          git push origin HEAD:performance/screen-dom-phase2c
