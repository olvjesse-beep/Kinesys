name: Temporary Online V2 Professional First

on:
  push:
    branches:
      - feature/agendamento-online-v2-perfil-publico
    paths:
      - .github/workflows/temp-online-v2-professional-first.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: [self-hosted, Windows, X64]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Put professional selector before publication list
        shell: cmd
        run: node -e "const fs=require('fs');const p='src/admin/configuracoes_agendamento_online_perfil_publico-1.0.0.js';let s=fs.readFileSync(p,'utf8');const a=\"profissionais.insertAdjacentHTML('afterend', markupPerfil());\";const b=\"profissionais.insertAdjacentHTML('beforebegin', markupPerfil());\";if(!s.includes(a))throw new Error('anchor missing');fs.writeFileSync(p,s.replace(a,b),'utf8');"
      - name: Commit and remove temporary workflow
        shell: cmd
        run: |
          git rm .github/workflows/temp-online-v2-professional-first.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/admin/configuracoes_agendamento_online_perfil_publico-1.0.0.js
          git commit -m "design: selecionar profissional antes da configuracao online"
          git push origin HEAD:feature/agendamento-online-v2-perfil-publico
