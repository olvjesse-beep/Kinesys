name: Remove temporary visual refinement artifacts

on:
  push:
    paths:
      - '.github/workflows/cleanup-quieter-artifacts.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove one-time quieter-pass workflows and scripts
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm --ignore-unmatch \
            .github/workflows/quieter-pass-1.yml \
            .github/workflows/quieter-pass-1-retry.yml \
            .github/workflows/quieter-pass-2-retry.yml \
            .github/workflows/quieter-pass-3.yml \
            .github/workflows/quieter-pass-3-retry.yml \
            .github/workflows/quieter-pass-4.yml \
            .github/workflows/quieter-pass-5.yml \
            .github/scripts/quieter_pass_2.py \
            .github/scripts/quieter_pass_3.py \
            .github/scripts/map_visual_sources.py \
            .github/workflows/cleanup-quieter-artifacts.yml
          git diff --cached --check
          git diff --cached --stat
          git commit -m "Remove temporary visual refinement tooling"
          git push
