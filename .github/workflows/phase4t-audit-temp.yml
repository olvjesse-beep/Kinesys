name: Phase 4T Closeout Audit Temp

on:
  push:
    branches:
      - audit/phase4t-modularization-closeout

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Audit Phase 4 closeout
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          import crypto from 'node:crypto';

          const html = fs.readFileSync('index.html','utf8');
          const strip = value => String(value || '').split('#')[0].split('?')[0];
          const local = value => value && !/^(?:https?:|data:|\/\/)/i.test(value);
          const scripts = [...html.matchAll(/<script\b[^>]*\bsrc=["']([^"']+)["'][^>]*>/gi)].map(m=>m[1]).filter(local);
          const styles = [...html.matchAll(/<link\b[^>]*\bhref=["']([^"']+)["'][^>]*>/gi)].map(m=>m[1]).filter(local);
          const assets = [...new Set([...scripts,...styles].map(strip))];
          const missing = assets.filter(p=>!fs.existsSync(p));
          console.log('=== ACTIVE LOCAL ASSETS ===');
          console.log(`scripts=${scripts.length} styles=${styles.length} unique=${assets.length}`);
          for (const p of assets) console.log(`ACTIVE ${p}`);
          if (missing.length) {
            console.error('MISSING:', missing.join(', '));
            process.exitCode = 1;
          }

          const rootFiles = fs.readdirSync('.', {withFileTypes:true}).filter(x=>x.isFile()).map(x=>x.name).sort();
          const activeSet = new Set(assets);
          const candidates = rootFiles.filter(n=>/\.(?:js|css|zip)$/i.test(n) && !activeSet.has(n));
          console.log('\n=== ROOT FILES NOT DIRECTLY REFERENCED BY index.html ===');
          for (const n of candidates) console.log(`UNREFERENCED_ROOT ${n} ${fs.statSync(n).size}`);

          console.log('\n=== DUPLICATE CONTENT SHA256 (ROOT JS/CSS ONLY) ===');
          const groups=new Map();
          for(const n of rootFiles.filter(n=>/\.(?:js|css)$/i.test(n))){
            const h=crypto.createHash('sha256').update(fs.readFileSync(n)).digest('hex');
            if(!groups.has(h)) groups.set(h,[]);
            groups.get(h).push(n);
          }
          for(const [h,names] of groups){if(names.length>1) console.log(`${h.slice(0,12)} ${names.join(' | ')}`);}

          const core='script-1.18.0.js';
          const coreText=fs.readFileSync(core,'utf8');
          console.log('\n=== MONOLITH BASELINE ===');
          console.log(`bytes=${fs.statSync(core).size}`);
          console.log(`function_declarations=${(coreText.match(/\bfunction\s+[A-Za-z_$][\w$]*\s*\(/g)||[]).length}`);
          console.log(`async_function_declarations=${(coreText.match(/\basync\s+function\s+[A-Za-z_$][\w$]*\s*\(/g)||[]).length}`);
          console.log(`supabase_mentions=${(coreText.match(/_supabase/g)||[]).length}`);
          console.log(`salvarPacienteNaNuvem_mentions=${(coreText.match(/salvarPacienteNaNuvem/g)||[]).length}`);
          console.log(`avaliacao_mentions=${(coreText.match(/avalia[cç][aã]o/gi)||[]).length}`);
          console.log(`evolucao_mentions=${(coreText.match(/evolu[cç][aã]o/gi)||[]).length}`);

          const textExt = /\.(?:html?|js|mjs|cjs|css|json|md|ya?ml|toml|sql|txt)$/i;
          function walk(dir, out=[]) {
            for (const ent of fs.readdirSync(dir,{withFileTypes:true})) {
              if (['.git','node_modules'].includes(ent.name)) continue;
              const p=path.join(dir,ent.name);
              if(ent.isDirectory()) walk(p,out);
              else if(textExt.test(ent.name)) out.push(p.replace(/^\.\//,''));
            }
            return out;
          }
          const textFiles=walk('.');

          console.log('\n=== RUNTIME REACHABILITY GRAPH ===');
          const direct = new Set(assets);
          const reachable = new Set(assets);
          const queue = assets.filter(p=>/\.(?:js|css)$/i.test(p));
          const refPattern = /["'`]([^"'`\n]+?\.(?:js|css))(?:\?[^"'`\n]*)?["'`]/gi;
          while(queue.length){
            const current=queue.shift();
            if(!fs.existsSync(current)) continue;
            let txt='';
            try{txt=fs.readFileSync(current,'utf8');}catch{continue;}
            for(const m of txt.matchAll(refPattern)){
              let raw=strip(m[1]);
              if(!local(raw)) continue;
              const resolved=path.normalize(path.join(path.dirname(current),raw)).replace(/\\/g,'/').replace(/^\.\//,'');
              const candidate=fs.existsSync(resolved)?resolved:(fs.existsSync(raw)?raw:null);
              if(!candidate || reachable.has(candidate)) continue;
              reachable.add(candidate);
              queue.push(candidate);
            }
          }
          for(const p of [...reachable].sort()) if(!direct.has(p)) console.log(`INDIRECT_RUNTIME ${p}`);
          console.log(`runtime_reachable_total=${reachable.size} indirect=${[...reachable].filter(p=>!direct.has(p)).length}`);

          console.log('\n=== CLEANUP CANDIDATES: NOT RUNTIME REACHABLE ===');
          const runtimeText=[...reachable].filter(p=>/\.(?:js|css|html?)$/i.test(p)&&fs.existsSync(p));
          const nonRuntimeRoot=rootFiles.filter(n=>/\.(?:js|css|zip)$/i.test(n)&&!reachable.has(n));
          for(const target of nonRuntimeRoot){
            const runtimeRefs=runtimeText.filter(f=>{try{return fs.readFileSync(f,'utf8').includes(target);}catch{return false;}});
            const otherRefs=textFiles.filter(f=>f!==target && !f.endsWith('phase4t-audit-temp.yml') && !runtimeText.includes(f) && fs.readFileSync(f,'utf8').includes(target));
            console.log(`CANDIDATE ${target} bytes=${fs.statSync(target).size} runtime_refs=${runtimeRefs.length} other_refs=${otherRefs.length}${otherRefs.length?' -> '+otherRefs.slice(0,8).join(', '):''}`);
          }

          console.log('\n=== TEMP PHASE ARTIFACTS ===');
          const temp = textFiles.filter(p=>/phase4[a-z0-9_-]*(?:temp|extract|preflight)/i.test(p));
          for(const p of temp) console.log(`TEMP ${p}`);
          const disallowed = temp.filter(p=>!p.includes('phase4t-audit-temp.yml'));
          if(disallowed.length){
            console.error('Unexpected Phase 4 temp artifacts:',disallowed.join(', '));
            process.exitCode=1;
          }
          NODE
      - name: Syntax check active runtime JS
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          import {spawnSync} from 'node:child_process';
          const html=fs.readFileSync('index.html','utf8');
          const strip=x=>String(x||'').split('?')[0].split('#')[0];
          const local=x=>x&&!/^(?:https?:|data:|\/\/)/i.test(x);
          const roots=[...html.matchAll(/<(?:script\b[^>]*\bsrc|link\b[^>]*\bhref)=["']([^"']+)["'][^>]*>/gi)].map(m=>strip(m[1])).filter(local);
          const reachable=new Set(roots),queue=roots.filter(x=>/\.(?:js|css)$/i.test(x));
          const refPattern=/["'`]([^"'`\n]+?\.(?:js|css))(?:\?[^"'`\n]*)?["'`]/gi;
          while(queue.length){const current=queue.shift();if(!fs.existsSync(current))continue;let txt='';try{txt=fs.readFileSync(current,'utf8');}catch{continue;}for(const m of txt.matchAll(refPattern)){const raw=strip(m[1]);if(!local(raw))continue;const rel=path.normalize(path.join(path.dirname(current),raw)).replace(/\\/g,'/').replace(/^\.\//,'');const p=fs.existsSync(rel)?rel:(fs.existsSync(raw)?raw:null);if(p&&!reachable.has(p)){reachable.add(p);queue.push(p);}}}
          let checked=0;
          for(const src of [...reachable].sort()){
            if(!src.endsWith('.js'))continue;
            const r=spawnSync(process.execPath,['--check',src],{encoding:'utf8'});
            if(r.status!==0){console.error(`SYNTAX_FAIL ${src}\n${r.stderr}`);process.exit(1);}checked++;
          }
          console.log(`runtime_js_syntax_ok=${checked}`);
          NODE
