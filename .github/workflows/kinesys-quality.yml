name: KineSys Quality Gate

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - '**/*.css'
      - '**/*.js'
      - 'design_tokens.css'
      - 'DESIGN.md'
      - '.impeccable/**'
      - '.agents/skills/impeccable/**'
      - '.github/workflows/kinesys-quality.yml'
  pull_request:
    branches: [main]
    paths:
      - 'index.html'
      - '**/*.css'
      - '**/*.js'
      - 'design_tokens.css'
      - 'DESIGN.md'
      - '.impeccable/**'
      - '.agents/skills/impeccable/**'
      - '.github/workflows/kinesys-quality.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kinesys-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Runtime contracts
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 10
    env:
      PSExecutionPolicyPreference: Bypass
    defaults:
      run:
        shell: 'C:\PROGRA~1\Git\bin\bash.exe --noprofile --norc -eo pipefail {0}'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: JavaScript syntax
        run: |
          set -euo pipefail
          count=0
          while IFS= read -r -d '' file; do
            node --check "$file"
            count=$((count + 1))
          done < <(find . -type f -name '*.js' -not -path './.git/*' -print0)
          echo "Validated JavaScript files: $count"
          echo "### JavaScript" >> "$GITHUB_STEP_SUMMARY"
          echo "- Syntax valid in **$count** files." >> "$GITHUB_STEP_SUMMARY"

      - name: HTML, forms and runtime asset contracts
        run: |
          python - <<'PY'
          import os
          from collections import Counter
          from html.parser import HTMLParser
          from pathlib import Path
          from urllib.parse import urlsplit

          html_path = Path('index.html')
          html = html_path.read_text(encoding='utf-8')

          class KineSysHTMLAudit(HTMLParser):
              def __init__(self):
                  super().__init__(convert_charrefs=True)
                  self.stack = []
                  self.ids = []
                  self.labels_for = set()
                  self.controls = []
                  self.form_buttons_without_type = []
                  self.style_blocks = 0
                  self.stylesheets = []
                  self.scripts = []

              @staticmethod
              def attrs_dict(attrs):
                  return {str(k).lower(): ('' if v is None else str(v)) for k, v in attrs}

              @staticmethod
              def hidden_here(tag, attrs):
                  style = attrs.get('style', '').replace(' ', '').lower()
                  return (
                      'hidden' in attrs or
                      attrs.get('aria-hidden', '').lower() == 'true' or
                      'display:none' in style or
                      'visibility:hidden' in style
                  )

              def handle_starttag(self, tag, attrs_list):
                  tag = tag.lower()
                  attrs = self.attrs_dict(attrs_list)
                  ancestor_hidden = any(frame['hidden'] for frame in self.stack)
                  hidden = ancestor_hidden or self.hidden_here(tag, attrs)
                  inside_label = any(frame['tag'] == 'label' for frame in self.stack)
                  inside_form = any(frame['tag'] == 'form' for frame in self.stack)

                  if attrs.get('id'):
                      self.ids.append(attrs['id'])
                  if tag == 'label' and attrs.get('for'):
                      self.labels_for.add(attrs['for'])
                  if tag == 'style':
                      self.style_blocks += 1
                  if tag == 'link' and 'stylesheet' in attrs.get('rel', '').lower() and attrs.get('href'):
                      self.stylesheets.append(attrs['href'])
                  if tag == 'script' and attrs.get('src'):
                      self.scripts.append(attrs)

                  if tag in {'input', 'select', 'textarea'}:
                      input_type = attrs.get('type', 'text').lower() if tag == 'input' else ''
                      if input_type != 'hidden' and 'disabled' not in attrs and not hidden:
                          self.controls.append({
                              'tag': tag,
                              'id': attrs.get('id', ''),
                              'aria-label': attrs.get('aria-label', ''),
                              'aria-labelledby': attrs.get('aria-labelledby', ''),
                              'wrapped': inside_label,
                          })

                  if tag == 'button' and inside_form and not attrs.get('type'):
                      self.form_buttons_without_type.append(attrs.get('id') or '<button>')

                  if tag not in {'area','base','br','col','embed','hr','img','input','link','meta','param','source','track','wbr'}:
                      self.stack.append({'tag': tag, 'hidden': hidden})

              def handle_endtag(self, tag):
                  tag = tag.lower()
                  for index in range(len(self.stack) - 1, -1, -1):
                      if self.stack[index]['tag'] == tag:
                          del self.stack[index:]
                          break

          parser = KineSysHTMLAudit()
          parser.feed(html)

          duplicates = sorted(key for key, count in Counter(parser.ids).items() if count > 1)
          unnamed = []
          for control in parser.controls:
              cid = control['id']
              named = bool(
                  control['aria-label'] or
                  control['aria-labelledby'] or
                  control['wrapped'] or
                  (cid and cid in parser.labels_for)
              )
              if not named:
                  unnamed.append(cid or f"<{control['tag']} without id>")

          missing_assets = []
          for href in parser.stylesheets:
              parsed = urlsplit(href)
              if parsed.scheme or parsed.netloc:
                  continue
              local = parsed.path.lstrip('/')
              if local and not Path(local).exists():
                  missing_assets.append(local)
          for attrs in parser.scripts:
              src = attrs.get('src', '')
              parsed = urlsplit(src)
              if not parsed.scheme and not parsed.netloc:
                  local = parsed.path.lstrip('/')
                  if local and not Path(local).exists():
                      missing_assets.append(local)

          scripts_without_nonblocking = []
          for attrs in parser.scripts:
              if 'defer' not in attrs and attrs.get('type', '').lower() != 'module':
                  scripts_without_nonblocking.append(attrs.get('src', '<unknown>'))

          print(f'HTML_ID_COUNT={len(parser.ids)}')
          print(f'DUPLICATE_ID_COUNT={len(duplicates)}')
          print(f'INLINE_STYLE_BLOCK_COUNT={parser.style_blocks}')
          print(f'VISIBLE_UNNAMED_FORM_CONTROL_COUNT={len(unnamed)}')
          print(f'FORM_BUTTON_WITHOUT_TYPE_COUNT={len(parser.form_buttons_without_type)}')
          print(f'LOCAL_RUNTIME_ASSET_MISSING_COUNT={len(missing_assets)}')
          print(f'EXTERNAL_SCRIPT_COUNT={len(parser.scripts)}')
          print(f'SCRIPT_WITHOUT_DEFER_OR_MODULE_COUNT={len(scripts_without_nonblocking)}')

          failures = []
          if duplicates:
              failures.append('Duplicate HTML IDs: ' + ', '.join(duplicates))
          if parser.style_blocks:
              failures.append(f'index.html contains {parser.style_blocks} inline <style> block(s)')
          if unnamed:
              failures.append('Visible controls without accessible names: ' + ', '.join(unnamed))
          if parser.form_buttons_without_type:
              failures.append('Form buttons without explicit type: ' + ', '.join(parser.form_buttons_without_type))
          if missing_assets:
              failures.append('Missing local runtime assets: ' + ', '.join(sorted(set(missing_assets))))
          if scripts_without_nonblocking:
              failures.append('Scripts without defer/type=module: ' + ', '.join(scripts_without_nonblocking))

          summary = (
              '### HTML and accessibility\n'
              f'- IDs: **{len(parser.ids)}**; duplicates: **{len(duplicates)}**.\n'
              f'- Inline `<style>` blocks: **{parser.style_blocks}**.\n'
              f'- Visible form controls without accessible name: **{len(unnamed)}**.\n'
              f'- Form buttons without explicit `type`: **{len(parser.form_buttons_without_type)}**.\n'
              f'- Missing local runtime assets: **{len(missing_assets)}**.\n'
              f'- Runtime scripts: **{len(parser.scripts)}**; blocking classic scripts: **{len(scripts_without_nonblocking)}**.\n'
          )
          with Path(os.environ['GITHUB_STEP_SUMMARY']).open('a', encoding='utf-8') as handle:
              handle.write(summary)

          if failures:
              raise SystemExit('\n'.join(failures))
          PY

      - name: KDS runtime CSS contracts
        run: |
          python - <<'PY'
          import os
          from html.parser import HTMLParser
          from pathlib import Path
          from urllib.parse import urlsplit
          import re

          class Stylesheets(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.hrefs = []
              def handle_starttag(self, tag, attrs):
                  if tag.lower() != 'link':
                      return
                  data = {str(k).lower(): ('' if v is None else str(v)) for k,v in attrs}
                  if 'stylesheet' in data.get('rel','').lower() and data.get('href'):
                      self.hrefs.append(data['href'])

          parser = Stylesheets()
          parser.feed(Path('index.html').read_text(encoding='utf-8'))
          css_files = []
          for href in parser.hrefs:
              parsed = urlsplit(href)
              if parsed.scheme or parsed.netloc:
                  continue
              p = Path(parsed.path.lstrip('/'))
              if p.exists() and p.suffix.lower() == '.css':
                  css_files.append(p)

          allowed_breakpoints = {1280,1180,1100,980,900,820,760,700,620,560,520,430}
          microtype = []
          noncontract_breakpoints = []
          used_kds = set()

          for path in css_files:
              original = path.read_text(encoding='utf-8')
              text = re.sub(r'/\*.*?\*/', '', original, flags=re.S)
              for m in re.finditer(r'font-size\s*:\s*([0-9]*\.?[0-9]+)px', text, re.I):
                  if float(m.group(1)) < 12.5:
                      line = text.count('\n', 0, m.start()) + 1
                      microtype.append(f'{path}:{line}:{m.group(1)}px')
              for m in re.finditer(r'@media[^\{]*\((max|min)-width\s*:\s*([0-9]+)px\)', text, re.I):
                  kind = m.group(1).lower()
                  value = int(m.group(2))
                  if value not in allowed_breakpoints and not (kind == 'min' and value == 701):
                      line = text.count('\n', 0, m.start()) + 1
                      noncontract_breakpoints.append(f'{path}:{line}:{kind}-width:{value}px')
              used_kds.update(re.findall(r'var\(\s*(--kds-[a-z0-9-]+)', original, re.I))

          index_html = Path('index.html').read_text(encoding='utf-8')
          used_kds.update(re.findall(r'var\(\s*(--kds-[a-z0-9-]+)', index_html, re.I))

          token_text = Path('design_tokens.css').read_text(encoding='utf-8')
          static_defined_kds = set(re.findall(r'(--kds-[a-z0-9-]+)\s*:', token_text, re.I))

          runtime_defined_kds = set()
          for js_path in Path('.').rglob('*.js'):
              if '.git' in js_path.parts:
                  continue
              js_text = js_path.read_text(encoding='utf-8', errors='ignore')
              runtime_defined_kds.update(
                  re.findall(r"setProperty\(\s*['\"](--kds-[a-z0-9-]+)['\"]", js_text, re.I)
              )

          defined_kds = static_defined_kds | runtime_defined_kds
          undefined_kds = sorted(used_kds - defined_kds)

          print(f'RUNTIME_CSS_FILES={len(css_files)}')
          print(f'MICROTYPE_UNDER_12_5_COUNT={len(microtype)}')
          print(f'NONCONTRACT_BREAKPOINT_COUNT={len(noncontract_breakpoints)}')
          print(f'KDS_TOKEN_USED_COUNT={len(used_kds)}')
          print(f'KDS_TOKEN_STATIC_DEFINED_COUNT={len(static_defined_kds)}')
          print(f'KDS_TOKEN_RUNTIME_DEFINED_COUNT={len(runtime_defined_kds)}')
          print(f'KDS_TOKEN_UNDEFINED_COUNT={len(undefined_kds)}')

          summary = (
              '### KineSys Design System contracts\n'
              f'- Runtime CSS files checked: **{len(css_files)}**.\n'
              f'- Font sizes below 12.5px: **{len(microtype)}**.\n'
              f'- Breakpoints outside the official contract: **{len(noncontract_breakpoints)}**.\n'
              f'- Static KDS tokens: **{len(static_defined_kds)}**; runtime-injected KDS tokens: **{len(runtime_defined_kds)}**.\n'
              f'- Undefined `--kds-*` tokens used at runtime: **{len(undefined_kds)}**.\n'
          )
          with Path(os.environ['GITHUB_STEP_SUMMARY']).open('a', encoding='utf-8') as handle:
              handle.write(summary)

          failures = []
          if microtype:
              failures.append('Microtype below 12.5px:\n' + '\n'.join(microtype))
          if noncontract_breakpoints:
              failures.append('Non-contract breakpoints:\n' + '\n'.join(noncontract_breakpoints))
          if undefined_kds:
              failures.append('Undefined KDS tokens: ' + ', '.join(undefined_kds))
          if failures:
              raise SystemExit('\n\n'.join(failures))
          PY

      - name: Impeccable detector advisory summary
        run: |
          set -uo pipefail
          impeccable_json='.kinesys-impeccable.json'
          impeccable_err='.kinesys-impeccable.err'
          chmod +x .agents/skills/impeccable/scripts/impeccable || true
          set +e
          .agents/skills/impeccable/scripts/impeccable detect --json \
            index.html \
            design_tokens.css \
            design_components.css \
            design_responsive.css \
            design_screens.css \
            avaliacao_experiencia-1.22.0.css \
            > "$impeccable_json" 2>"$impeccable_err"
          code=$?
          set -e
          python - "$code" <<'PY'
          import json
          import os
          import sys
          from collections import Counter
          from pathlib import Path

          code = int(sys.argv[1])
          raw = Path('.kinesys-impeccable.json').read_text(encoding='utf-8').strip()
          try:
              findings = json.loads(raw) if raw else []
          except Exception:
              findings = []
          if not isinstance(findings, list):
              findings = []
          severity = Counter((f.get('severity') or 'unknown') for f in findings)
          kinds = Counter((f.get('antipattern') or f.get('name') or 'unknown') for f in findings)

          lines = [
              '### Impeccable detector — advisory only',
              f'- Exit code: **{code}**.',
              f'- Findings: **{len(findings)}**.',
          ]
          for key in sorted(severity):
              lines.append(f'- {key}: **{severity[key]}**.')
          if kinds:
              lines.append('- Most frequent categories: ' + ', '.join(f'`{k}` ({v})' for k,v in kinds.most_common(8)) + '.')
          lines.append('- Detector findings do **not** block this workflow; KineSys clinical semantics and documented design decisions require contextual review.')
          with Path(os.environ['GITHUB_STEP_SUMMARY']).open('a', encoding='utf-8') as handle:
              handle.write('\n'.join(lines) + '\n')
          PY
          if [ -s "$impeccable_err" ]; then
            echo "Impeccable stderr (informational):"
            cat "$impeccable_err"
          fi
          rm -f "$impeccable_json" "$impeccable_err"
          exit 0

# validation touch: quieter visual pass 4