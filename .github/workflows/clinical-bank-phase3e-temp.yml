name: Clinical Bank Phase 3E Temp

on:
  push:
    branches:
      - performance/clinical-bank-base-regional-phase3e

permissions:
  contents: write

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: performance/clinical-bank-base-regional-phase3e
      - name: Generate regional base banks
        run: node .github/phase3e_generate.js
      - name: Apply integration patch
        run: node .github/phase3e_patch.js
      - name: Validate patched sources
        run: |
          node --check database/mapeamento_clinico_core-1.0.0.js
          for f in database/regioes/*-base-1.0.0.js; do node --check "$f"; done
          node --check clinical_region_loader-1.0.0.js
          node --check screen_loader-1.25.0.js
          node --check script-1.18.0.js
          node --check tests/screen_loader.contract.js
          node tests/screen_loader.contract.js
          git diff --check
      - name: Commit Phase 3E generated and patched files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add database/regioes database/mapeamento_clinico_core-1.0.0.js screen_loader-1.25.0.js script-1.18.0.js tests/screen_loader.contract.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'perf: integrate regional clinical base banks'
          git push origin HEAD:performance/clinical-bank-base-regional-phase3e
