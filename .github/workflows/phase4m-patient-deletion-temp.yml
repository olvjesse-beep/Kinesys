name: Phase 4M Patient Deletion Temp

on:
  push:
    branches:
      - performance/patient-deletion-phase4m
    paths:
      - '.github/workflows/phase4m-patient-deletion-temp.yml'
      - '.github/scripts/phase4m_patient_deletion.py'
      - '.github/scripts/phase4m_update_phase4i_contract.py'

permissions:
  contents: write

jobs:
  modularize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: performance/patient-deletion-phase4m
          fetch-depth: 0

      - name: Apply exact extraction
        run: |
          python .github/scripts/phase4m_patient_deletion.py
          python .github/scripts/phase4m_update_phase4i_contract.py

      - name: Validate Phase 4M
        shell: bash
        run: |
          set -euo pipefail
          node --check patient_deletion_core-1.0.0.js
          node --check script-1.18.0.js
          node --check tests/patient_deletion_modularization.contract.js
          node --check tests/patient_index_cache_modularization.contract.js
          node tests/patient_deletion_modularization.contract.js
          node tests/fisio_home_patient_self_service.contract.js
          node tests/patient_index_cache_modularization.contract.js
          node tests/patient_chart_read_modularization.contract.js
          node tests/patient_records_browse_modularization.contract.js
          node tests/data_loading.contract.js
          node tests/clinical_reasoning_shoulder_elbow.regression.js
          node tests/clinical_reasoning_cervical.regression.js
          git diff --check
          wc -c script-1.18.0.js patient_deletion_core-1.0.0.js

      - name: Commit permanent Phase 4M files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add script-1.18.0.js index.html patient_deletion_core-1.0.0.js tests/patient_deletion_modularization.contract.js tests/fisio_home_patient_self_service.contract.js tests/patient_index_cache_modularization.contract.js
          if git diff --cached --quiet; then
            echo 'No permanent changes.'
            exit 0
          fi
          git commit -m 'Modularize patient deletion core'
          git push origin HEAD:performance/patient-deletion-phase4m
