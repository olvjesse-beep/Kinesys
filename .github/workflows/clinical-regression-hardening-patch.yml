name: Harden clinical recognition from regression

on:
  push:
    paths:
      - '.github/workflows/clinical-regression-hardening-patch.yml'

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Apply final clinical recognition hardening
        run: python tools/finalize_shoulder_elbow_regression_patch.py
      - name: Validate syntax and regression corpus
        run: |
          node --check clinical_reasoning_shoulder-3.1.0.js
          node --check clinical_reasoning_elbow-3.1.0.js
          node --check tests/clinical_reasoning_shoulder_elbow.regression.js
          node tests/clinical_reasoning_shoulder_elbow.regression.js
          git diff --check
      - name: Commit hardening
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add clinical_reasoning_shoulder-3.1.0.js clinical_reasoning_elbow-3.1.0.js tests/clinical_reasoning_shoulder_elbow.regression.js
          git commit -m "Harden shoulder and elbow HMA recognition" || exit 0
          git push
