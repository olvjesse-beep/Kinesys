name: Impeccable detailed visual audit

on:
  push:
    paths:
      - '.github/workflows/impeccable-detail-audit.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Trace final detector source candidates
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          from urllib.parse import urlsplit
          import re

          class Links(HTMLParser):
              def __init__(self):
                  super().__init__(); self.hrefs=[]
              def handle_starttag(self, tag, attrs):
                  if tag.lower() != 'link': return
                  d={str(k).lower():('' if v is None else str(v)) for k,v in attrs}
                  if 'stylesheet' in d.get('rel','').lower() and d.get('href'): self.hrefs.append(d['href'])

          parser=Links(); parser.feed(Path('index.html').read_text(encoding='utf-8'))
          files=[]
          for href in parser.hrefs:
              u=urlsplit(href)
              if u.scheme or u.netloc: continue
              p=Path(u.path.lstrip('/'))
              if p.exists() and p.suffix.lower()=='.css': files.append(p)

          print('RUNTIME_CSS', len(files))
          patterns={
              'RGB_19373E': re.compile(r'(?:rgba?\(\s*25\s*,\s*55\s*,\s*62\b|#19373e\b)', re.I),
              'LINE_12': re.compile(r'line-height\s*:\s*1\.2(?:0)?\s*[;}]', re.I),
              'TRACKING_06PLUS': re.compile(r'letter-spacing\s*:\s*\.?0?(?:6|7|8|9)em\b|letter-spacing\s*:\s*\.(?:06|07|08|09)em\b', re.I),
          }
          for label, pat in patterns.items():
              print('===', label, '===')
              for p in files:
                  text=p.read_text(encoding='utf-8', errors='ignore')
                  for m in pat.finditer(text):
                      line=text.count('\n',0,m.start())+1
                      start=max(0,text.rfind('{',0,m.start()))
                      end=text.find('}',m.start())
                      if end < 0: end=min(len(text),m.start()+320)
                      snippet=' '.join(text[start:end+1].split())
                      print(f'{p}:{line} :: {snippet[:700]}')

          print('=== ALL COLORED SHADOWS USING 25/55/62 ===')
          for p in files:
              text=p.read_text(encoding='utf-8', errors='ignore')
              for m in re.finditer(r'box-shadow\s*:[^;}]*rgba\(\s*25\s*,\s*55\s*,\s*62\s*,[^;)]+\)', text, re.I):
                  line=text.count('\n',0,m.start())+1
                  start=max(0,text.rfind('{',0,m.start())); end=text.find('}',m.start())
                  snippet=' '.join(text[start:(end+1 if end>=0 else m.end()+120)].split())
                  print(f'{p}:{line} :: {snippet[:700]}')
          PY
