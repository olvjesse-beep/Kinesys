name: Impeccable detailed visual audit

on:
  push:
    paths:
      - '.github/workflows/impeccable-detail-audit.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Map CSS intensity sources
        shell: bash
        run: |
          set -euo pipefail
          files=(design_base.css design_components.css design_responsive.css design_foundation.css design_features.css design_screens.css design_typography.css design_navigation.css design_agenda.css design_clinical.css design_utilities.css avaliacao_experiencia-1.22.0.css)
          echo '=== TEXT TRANSFORM UPPERCASE ==='
          grep -n -H -C 2 -E 'text-transform:[[:space:]]*uppercase' "${files[@]}" || true
          echo '=== WIDE TRACKING ==='
          grep -n -H -C 2 -E 'letter-spacing:[[:space:]]*(0\.(0[6-9]|1[0-9])em|[1-9][0-9]*px|\.?[89]px|1px)' "${files[@]}" || true
          echo '=== SIDE ACCENTS / INSET STRIPES ==='
          grep -n -H -C 2 -E 'border-(left|right|top|bottom):[[:space:]]*[2-9]px|inset[^;]*[2-9]px' "${files[@]}" || true
          echo '=== WIDE SHADOWS ==='
          grep -n -H -C 2 -E 'box-shadow:[^;]*(20px|24px|28px|30px|36px|44px|54px|70px|72px)' "${files[@]}" || true
          echo '=== EYEBROW SELECTORS ==='
          grep -n -H -C 2 -E '(eyebrow|kicker)' "${files[@]}" || true
