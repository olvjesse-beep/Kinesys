name: Impeccable detailed visual audit

on:
  push:
    paths:
      - '.github/workflows/impeccable-detail-audit.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Map high-impact visual matches
        shell: bash
        run: |
          set -euo pipefail
          echo '=== KICKERS ==='
          grep -n -C 2 -E 'SUA CLÍNICA\. SEU ACESSO\.|RECUPERAÇÃO DE ACESSO|AJUDA COM A CONTA|PAINEL OPERACIONAL|PAINEL CLÍNICO|PACIENTES|KINESYS LOCAL|DISPONIBILIDADE EM 2 NÍVEIS' index.html || true
          echo '=== UPPERCASE / TRACKING ==='
          grep -n -C 1 -E 'text-transform:[[:space:]]*uppercase|letter-spacing:[[:space:]]*0\.(0[6-9]|1[0-9])em' index.html || true
          echo '=== SIDE ACCENTS ==='
          grep -n -C 2 -E 'border-left:[[:space:]]*[34]px|border-top:[[:space:]]*4px|inset[^"]*3px|box-shadow:[^;]*3px' index.html || true
          echo '=== SHADOWS ==='
          grep -n -C 1 -E 'box-shadow:[^;]*(20px|30px)|box-shadow:[^;]*#173[Bb]45' index.html || true
          echo '=== TARGET CONTAINERS ==='
          grep -n -C 2 -E 'patient-strip|hma-live-suggestions|agenda-grade-scroll|finance-ledger-summary' index.html || true
