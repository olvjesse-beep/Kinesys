name: Impeccable detailed visual audit

on:
  push:
    paths:
      - '.github/workflows/impeccable-detail-audit.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Map final visual finding sources
        shell: bash
        run: |
          set -euo pipefail
          python .github/scripts/map_visual_sources.py
