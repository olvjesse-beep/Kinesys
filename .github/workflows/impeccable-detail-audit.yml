name: Impeccable detailed visual audit

on:
  push:
    paths:
      - '.github/workflows/impeccable-detail-audit.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Measure remaining findings after quieter pass 3
        shell: bash
        run: |
          set -uo pipefail
          chmod +x .agents/skills/impeccable/scripts/impeccable || true
          set +e
          .agents/skills/impeccable/scripts/impeccable detect --json \
            index.html \
            design_tokens.css \
            design_components.css \
            design_responsive.css \
            design_screens.css \
            avaliacao_experiencia-1.22.0.css \
            > /tmp/impeccable.json 2>/tmp/impeccable.err
          code=$?
          set -e
          echo "DETECTOR_EXIT=$code"
          python - <<'PY'
          import json
          from collections import Counter
          from pathlib import Path

          data = json.loads(Path('/tmp/impeccable.json').read_text(encoding='utf-8') or '[]')
          categories = Counter((item.get('antipattern') or item.get('name') or 'unknown') for item in data)
          print(f'FINDING_COUNT={len(data)}')
          print('CATEGORIES_BEGIN')
          for key, value in categories.most_common():
              print(f'{key}={value}')
          print('CATEGORIES_END')
          print('FINDINGS_BEGIN')
          for i, item in enumerate(data, 1):
              print(f'{i:03d}=' + json.dumps(item, ensure_ascii=False, separators=(',',':')))
          print('FINDINGS_END')
          PY
          if [ -s /tmp/impeccable.err ]; then cat /tmp/impeccable.err; fi
          exit 0
