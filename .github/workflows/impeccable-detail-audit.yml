name: Impeccable detailed visual audit

on:
  push:
    paths:
      - '.github/workflows/impeccable-detail-audit.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Diagnose final finding candidates without committing
        shell: bash
        run: |
          set -euo pipefail
          chmod +x .agents/skills/impeccable/scripts/impeccable || true
          python - <<'PY'
          import json
          import subprocess
          from collections import Counter
          from pathlib import Path

          cmd = [
              '.agents/skills/impeccable/scripts/impeccable','detect','--json',
              'index.html','design_tokens.css','design_components.css',
              'design_responsive.css','design_screens.css','avaliacao_experiencia-1.22.0.css'
          ]

          def detect(label):
              proc = subprocess.run(cmd, text=True, capture_output=True)
              try:
                  data = json.loads(proc.stdout or '[]')
              except Exception:
                  data = []
              kinds = Counter((x.get('antipattern') or x.get('name') or 'unknown') for x in data)
              print(f'{label}: total={len(data)} tight-leading={kinds.get("tight-leading",0)} dark-glow={kinds.get("dark-glow",0)}')

          def test(label, path, old, new):
              p=Path(path); original=p.read_text(encoding='utf-8')
              count=original.count(old)
              print(f'PATCH {label}: occurrences={count}')
              if count != 1:
                  return
              p.write_text(original.replace(old,new), encoding='utf-8')
              try:
                  detect(label)
              finally:
                  p.write_text(original, encoding='utf-8')

          detect('BASELINE')

          line_tests = [
              ('LINE_TEAM_H2','design_screens.css','.ks-team-hero h2{line-height:1.2;font-weight:710}','.ks-team-hero h2{line-height:1.35;font-weight:710}'),
              ('LINE_HMA_KICKER','design_clinical.css','font-size:var(--kds-font-metadata);\n    line-height:1.2;\n    font-weight:800;','font-size:var(--kds-font-metadata);\n    line-height:1.35;\n    font-weight:800;'),
              ('LINE_DATETIME_LABEL','design_clinical.css','font-size:var(--kds-font-label);\n    line-height:1.2;\n    font-weight:720;','font-size:var(--kds-font-label);\n    line-height:1.35;\n    font-weight:720;'),
              ('LINE_LOGIN_H1','login_access-1.18.0.css','#tela_login .ks-access-intro h1{font-size:34px;line-height:1.2;color:#fff;margin:18px 0;font-weight:650;letter-spacing:-.8px}','#tela_login .ks-access-intro h1{font-size:34px;line-height:1.35;color:#fff;margin:18px 0;font-weight:650;letter-spacing:-.8px}'),
              ('LINE_HOME_COUNT','design_home_activity-1.18.5.css','#ks_home_recent_count{font-size:30px;font-weight:700;line-height:1.2}','#ks_home_recent_count{font-size:30px;font-weight:700;line-height:1.35}'),
          ]
          for args in line_tests: test(*args)

          shadow_tests = [
              ('SHADOW_PATIENT_CONTEXT_BASE','design_base.css','box-shadow:0 8px 24px rgba(25,55,62,.06)','box-shadow:none'),
              ('SHADOW_REPORT_SURFACE','design_base.css','box-shadow:0 5px 18px rgba(25,55,62,.035)','box-shadow:none'),
              ('SHADOW_FINANCE_ACTIVE','design_base.css','box-shadow:0 1px 5px rgba(25,55,62,.08)','box-shadow:none'),
              ('SHADOW_PATIENT_CONTEXT_REFINED','design_base.css','box-shadow:0 10px 26px rgba(25,55,62,.07)','box-shadow:none'),
              ('SHADOW_PAIN_THERMOMETER','design_clinical.css','box-shadow:0 5px 14px rgba(25,55,62,.045)','box-shadow:none'),
          ]
          for args in shadow_tests: test(*args)
          PY
