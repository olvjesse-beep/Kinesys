name: Login Agenda Home4h Rewrite

on:
  push:
    branches:
      - fix/login-agenda-compact-home-4h

permissions:
  contents: write

jobs:
  rewrite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/login-agenda-compact-home-4h
          fetch-depth: 0
      - name: Apply incremental changes
        shell: bash
        run: |
          python .github/scripts/login_agenda_home4h_transform.py
          python .github/scripts/login_agenda_home4h_compat.py
          python .github/scripts/login_agenda_home4h_hardening.py
          python .github/scripts/agenda_workspace_compact_fix.py
      - name: Validate syntax and contracts
        shell: bash
        run: |
          set -euo pipefail
          node --check login_access-1.18.0.js
          node --check script-1.18.0.js
          node --check agenda-1.20.0.js
          node --check home_fisioterapeuta_util-1.24.0.js
          node --check screen_loader-1.25.0.js
          node --check tests/access_agenda_home4h.contract.js
          node tests/access_agenda_home4h.contract.js
          node tests/fisio_home_patient_self_service.contract.js
          node tests/agenda_editar_atendimento.contract.js
          node tests/screen_loader.contract.js
          node tests/data_loading.contract.js
          node tests/operational_data_loading.contract.js
          node tests/prontuario_export_lazy.contract.js
          node tests/mensagens_config_bootstrap.contract.js
          node tests/clinical_reasoning_shoulder_elbow.regression.js
          git diff --check
      - name: Commit permanent implementation only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add login_access-1.18.0.js script-1.18.0.js agenda-1.20.0.js design_agenda.css agenda_referencia-1.20.0.css home_fisioterapeuta_util-1.24.0.js home_fisioterapeuta_util-1.24.0.css screen_loader-1.25.0.js index.html tests/access_agenda_home4h.contract.js
          if git diff --cached --quiet; then
            echo 'No permanent changes to commit'
            exit 0
          fi
          git commit -m "Compact agenda workspace and preserve proportional timing"
          git push origin HEAD:fix/login-agenda-compact-home-4h
