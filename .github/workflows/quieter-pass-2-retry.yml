name: Retry KineSys quieter visual pass 2

on:
  push:
    paths:
      - '.github/workflows/quieter-pass-2-retry.yml'

permissions:
  contents: write

jobs:
  retry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Execute guarded source normalization
        shell: bash
        run: |
          set -euo pipefail
          python .github/scripts/quieter_pass_2.py
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add design_tokens.css design_components.css design_screens.css avaliacao_experiencia-1.22.0.css design_agenda.css
          git diff --cached --stat
          git commit -m "Normalize KineSys visual source contracts"
          git push
