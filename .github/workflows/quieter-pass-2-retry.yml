name: Retry KineSys quieter visual pass 2

on:
  push:
    paths:
      - '.github/workflows/quieter-pass-2-retry.yml'

permissions:
  contents: write

jobs:
  retry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Execute guarded source normalization
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import textwrap

          source = Path('.github/workflows/quieter-pass-2.yml').read_text(encoding='utf-8')
          start = "          python - <<'PY'\n"
          end = "\n          PY\n"
          if source.count(start) != 1 or source.count(end) != 1:
              raise SystemExit('Could not isolate guarded pass-2 Python source')
          block = source.split(start, 1)[1].split(end, 1)[0]
          exec(textwrap.dedent(block), {})
          PY

          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add design_tokens.css design_components.css design_screens.css avaliacao_experiencia-1.22.0.css design_agenda.css
          git diff --cached --stat
          git commit -m "Normalize KineSys visual source contracts"
          git push
