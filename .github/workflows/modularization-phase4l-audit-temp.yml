name: Modularization Phase 4L Audit Temp

on:
  push:
    branches: [performance/modularization-phase4l]
    paths:
      - '.github/workflows/modularization-phase4l-audit-temp.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Audit next low-risk core boundary
        shell: bash
        run: |
          set -euo pipefail
          echo '=== CORE SIZE / HEADERS ==='
          wc -l -c script-1.18.0.js
          grep -nE '^/\*.*={5,}|^// ={5,}' script-1.18.0.js | head -n 90 || true

          echo '=== SECTION 11 FUNCTIONS ==='
          awk '/\/\* ================= 11\. PRONTUÁRIOS E BUSCA/{f=1} /\/\* ================= 12\. EVOLUÇÕES E RELATÓRIOS/{f=0} f' script-1.18.0.js > /tmp/sec11.js
          wc -l -c /tmp/sec11.js
          grep -nE '^(async )?function ' /tmp/sec11.js || true

          echo '=== SECTION 12 FUNCTIONS ==='
          awk '/\/\* ================= 12\. EVOLUÇÕES E RELATÓRIOS/{f=1} /\/\* ================= NOVAS FUNÇÕES PARA O GERADOR DE DOCUMENTOS/{f=0} f' script-1.18.0.js > /tmp/sec12.js
          wc -l -c /tmp/sec12.js
          grep -nE '^(async )?function ' /tmp/sec12.js || true

          echo '=== CANDIDATE REFERENCES ==='
          grep -RInE 'renderizarTabelaProntuarios|filtrarPacientesSalvos|renderizarPacientesRecentesHome|atualizarSelectsPacientes|carregarHistoricoEvolucao|carregarPacienteParaRelatorio' --include='*.js' --include='*.html' . | grep -v '^./.git/' | grep -v '^./script-1.17' | grep -v '^./script.js:' | grep -v '^./supabase/' || true

          echo '=== FIRST 70 LINES SECTION 11 ==='
          head -n 70 /tmp/sec11.js

          echo '=== SELECT HELPERS CONTEXT ==='
          grep -n -B5 -A35 'async function atualizarSelectsPacientes' script-1.18.0.js || true

          echo '=== DEPENDENCY COUNTS FIRST 40 LINES SECTION 11 ==='
          head -n 40 /tmp/sec11.js > /tmp/sec11head.js
          for p in _supabase usuarioLogado usuarioEhMaster obterPacientesBasicos obterPacienteCompletoPorId navegarPara escapeHTML localStorage processarRadarEmTempoReal; do count=$(grep -o "$p" /tmp/sec11head.js 2>/dev/null | wc -l || true); echo "$p: $count"; done
