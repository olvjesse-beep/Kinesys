name: Phase 5A Batch 1 Preflight Temp

on:
  push:
    branches:
      - cleanup/phase5a-dead-artifacts-batch1

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prove batch 1 artifacts are outside runtime
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';

          const targets=['KineSys_v1.15.0_DEPLOY_APP.zip','agenda-audit__agenda-1.20.0.js'];
          for(const target of targets){if(!fs.existsSync(target))throw new Error(`Target missing before cleanup: ${target}`);}

          const html=fs.readFileSync('index.html','utf8');
          const strip=x=>String(x||'').split('?')[0].split('#')[0].replace(/^\//,'');
          const local=x=>x&&!/^(?:https?:|data:|\/\/)/i.test(x);
          const roots=[
            ...[...html.matchAll(/<script\b[^>]*\bsrc=["']([^"']+)["'][^>]*>/gi)].map(m=>strip(m[1])),
            ...[...html.matchAll(/<link\b[^>]*\bhref=["']([^"']+)["'][^>]*>/gi)].map(m=>strip(m[1]))
          ].filter(local);
          const reachable=new Set(roots),queue=roots.filter(x=>/\.(?:js|css)$/i.test(x));
          const refPattern=/["'`]([^"'`\n]+?\.(?:js|css))(?:\?[^"'`\n]*)?["'`]/gi;
          while(queue.length){
            const current=queue.shift();
            if(!fs.existsSync(current))continue;
            let txt='';try{txt=fs.readFileSync(current,'utf8');}catch{continue;}
            for(const m of txt.matchAll(refPattern)){
              const raw=strip(m[1]);if(!local(raw))continue;
              const rel=path.normalize(path.join(path.dirname(current),raw)).replace(/\\/g,'/').replace(/^\.\//,'');
              const found=fs.existsSync(rel)?rel:(fs.existsSync(raw)?raw:null);
              if(found&&!reachable.has(found)){reachable.add(found);queue.push(found);}
            }
          }

          const textExt=/\.(?:html?|js|mjs|cjs|css|json|md|ya?ml|toml|sql|txt)$/i;
          function walk(dir,out=[]){for(const ent of fs.readdirSync(dir,{withFileTypes:true})){if(['.git','node_modules'].includes(ent.name))continue;const p=path.join(dir,ent.name);if(ent.isDirectory())walk(p,out);else if(textExt.test(ent.name))out.push(p.replace(/^\.\//,''));}return out;}
          const textFiles=walk('.');
          const allowedReferences=new Set([
            'docs/PHASE4_CLOSEOUT.md',
            'tests/phase4_closeout.contract.js',
            '.github/workflows/phase5a-batch1-preflight-temp.yml'
          ]);

          for(const target of targets){
            if(reachable.has(target))throw new Error(`${target} is runtime reachable`);
            const refs=[];
            for(const file of textFiles){
              if(file===target||allowedReferences.has(file))continue;
              let txt='';try{txt=fs.readFileSync(file,'utf8');}catch{continue;}
              if(txt.includes(target))refs.push(file);
            }
            console.log(`${target}: runtime_reachable=false unexpected_refs=${refs.length}${refs.length?' -> '+refs.join(', '):''}`);
            if(refs.length)throw new Error(`${target} still has unexpected references`);
          }
          console.log(`runtime_reachable_total=${reachable.size}`);
          NODE
