name: Core Modularization Phase 4B Temp

on:
  push:
    branches:
      - performance/core-modularization-phase4b
    paths:
      - tools/core_phase4b_patch_temp.py
      - .github/workflows/core-phase4b-temp.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: performance/core-modularization-phase4b
      - name: Apply Phase 4B patch
        run: python tools/core_phase4b_patch_temp.py
      - name: Validate Phase 4B
        run: |
          set -euo pipefail
          node --check operation_guard-1.0.0.js
          node --check script-1.18.0.js
          node --check tests/operation_guard_modularization.contract.js
          node tests/operation_guard_modularization.contract.js
          node tests/menu_dropdown_modularization.contract.js
          node tests/screen_loader.contract.js
          git diff --check
      - name: Commit Phase 4B source changes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add script-1.18.0.js index.html
          git commit -m "Extract operation guard from core for Phase 4B" || exit 0
          git push origin HEAD:performance/core-modularization-phase4b
