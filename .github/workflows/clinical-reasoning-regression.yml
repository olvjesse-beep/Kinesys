name: Clinical Reasoning Regression

on:
  push:
    branches: [main]
    paths:
      - 'clinical_reasoning_hma-3.0.0.js'
      - 'clinical_reasoning_shoulder-3.1.0.js'
      - 'clinical_reasoning_elbow-3.1.0.js'
      - 'clinical_reasoning_wrist-3.1.0.js'
      - 'clinical_reasoning_wrist-3.1.0.css'
      - 'clinical_reasoning_cervical-3.1.0.js'
      - 'clinical_reasoning_cervical-3.1.0.css'
      - 'clinical_region_loader-1.0.0.js'
      - 'database/mapeamento_clinico_core-1.0.0.js'
      - 'database/mapeamento_clinico.js'
      - 'database/condicoes_mobilidade_v23.js'
      - 'database/diferenciais_neurais.js'
      - 'database/regioes/**'
      - 'screen_loader-1.25.0.js'
      - 'script-1.18.0.js'
      - 'tests/clinical_bank_regional_equivalence.contract.js'
      - 'tests/clinical_bank_base_regional_equivalence.contract.js'
      - 'tests/clinical_reasoning_shoulder_elbow.regression.js'
      - 'tests/clinical_reasoning_wrist.regression.js'
      - 'tests/clinical_reasoning_upper_limb.adversarial.js'
      - 'tests/clinical_reasoning_upper_limb.chaos.js'
      - 'tests/clinical_reasoning_cervical.regression.js'
      - 'tests/clinical_reasoning_cervical.adversarial.js'
      - '.github/workflows/clinical-reasoning-regression.yml'
  pull_request:
    branches: [main]
    paths:
      - 'clinical_reasoning_hma-3.0.0.js'
      - 'clinical_reasoning_shoulder-3.1.0.js'
      - 'clinical_reasoning_elbow-3.1.0.js'
      - 'clinical_reasoning_wrist-3.1.0.js'
      - 'clinical_reasoning_wrist-3.1.0.css'
      - 'clinical_reasoning_cervical-3.1.0.js'
      - 'clinical_reasoning_cervical-3.1.0.css'
      - 'clinical_region_loader-1.0.0.js'
      - 'database/mapeamento_clinico_core-1.0.0.js'
      - 'database/mapeamento_clinico.js'
      - 'database/condicoes_mobilidade_v23.js'
      - 'database/diferenciais_neurais.js'
      - 'database/regioes/**'
      - 'screen_loader-1.25.0.js'
      - 'script-1.18.0.js'
      - 'tests/clinical_bank_regional_equivalence.contract.js'
      - 'tests/clinical_bank_base_regional_equivalence.contract.js'
      - 'tests/clinical_reasoning_shoulder_elbow.regression.js'
      - 'tests/clinical_reasoning_wrist.regression.js'
      - 'tests/clinical_reasoning_upper_limb.adversarial.js'
      - 'tests/clinical_reasoning_upper_limb.chaos.js'
      - 'tests/clinical_reasoning_cervical.regression.js'
      - 'tests/clinical_reasoning_cervical.adversarial.js'
      - '.github/workflows/clinical-reasoning-regression.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    name: Ombro + cotovelo + punho/mão + cervical — HMA clínica
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: JavaScript syntax
        run: |
          node --check clinical_reasoning_shoulder-3.1.0.js
          node --check clinical_reasoning_elbow-3.1.0.js
          node --check clinical_reasoning_wrist-3.1.0.js
          node --check clinical_reasoning_cervical-3.1.0.js
          node --check clinical_region_loader-1.0.0.js
          node --check database/mapeamento_clinico_core-1.0.0.js
          for f in database/regioes/*-base-1.0.0.js; do node --check "$f"; done
          for f in database/regioes/*-ext-1.0.0.js; do node --check "$f"; done
          node --check tests/clinical_bank_regional_equivalence.contract.js
          node --check tests/clinical_bank_base_regional_equivalence.contract.js
          node --check tests/clinical_reasoning_shoulder_elbow.regression.js
          node --check tests/clinical_reasoning_wrist.regression.js
          node --check tests/clinical_reasoning_upper_limb.adversarial.js
          node --check tests/clinical_reasoning_upper_limb.chaos.js
          node --check tests/clinical_reasoning_cervical.regression.js
          node --check tests/clinical_reasoning_cervical.adversarial.js

      - name: Verify regional clinical base equivalence
        run: node tests/clinical_bank_base_regional_equivalence.contract.js

      - name: Verify regional clinical extension equivalence
        run: node tests/clinical_bank_regional_equivalence.contract.js

      - name: Run realistic shoulder and elbow HMA corpus
        run: node tests/clinical_reasoning_shoulder_elbow.regression.js

      - name: Run realistic wrist and hand HMA corpus
        run: node tests/clinical_reasoning_wrist.regression.js

      - name: Run adversarial upper-limb audit corpus
        run: node tests/clinical_reasoning_upper_limb.adversarial.js

      - name: Run noisy HMA chaos corpus
        run: node tests/clinical_reasoning_upper_limb.chaos.js

      - name: Run realistic cervical HMA corpus
        run: node tests/clinical_reasoning_cervical.regression.js

      - name: Run adversarial cervical audit corpus
        run: node tests/clinical_reasoning_cervical.adversarial.js

# Permanent 175-case regression gate for Motor Clínico 3.1 shoulder/elbow/wrist-hand/cervical changes.
