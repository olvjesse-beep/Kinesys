name: TEMP Apply Clinical Chaos Hardening

on:
  push:
    branches:
      - audit/clinical-upper-limb-chaos-noisy-hma
    paths:
      - 'tools/chaos_hardening_patch.py'
      - 'tools/chaos_hardening_patch_v2.py'
      - 'tools/chaos_hardening_patch_v3.py'
      - 'tools/chaos_hardening_patch_v4.py'
      - '.github/workflows/chaos-hardening-temp.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout source branch
        uses: actions/checkout@v4
        with:
          ref: audit/clinical-upper-limb-chaos-noisy-hma
          fetch-depth: 0

      - name: Apply targeted hardening patch
        run: python3 tools/chaos_hardening_patch_v4.py

      - name: JavaScript syntax
        run: |
          node --check clinical_reasoning_shoulder-3.1.0.js
          node --check clinical_reasoning_elbow-3.1.0.js
          node --check clinical_reasoning_wrist-3.1.0.js
          node --check tests/clinical_reasoning_upper_limb.chaos.js

      - name: Run all clinical suites
        run: |
          status=0
          node tests/clinical_reasoning_shoulder_elbow.regression.js || status=1
          node tests/clinical_reasoning_wrist.regression.js || status=1
          node tests/clinical_reasoning_upper_limb.adversarial.js || status=1
          node tests/clinical_reasoning_upper_limb.chaos.js || status=1
          exit $status

      - name: Diff integrity
        run: git diff --check

      - name: Commit verified motor changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add clinical_reasoning_shoulder-3.1.0.js clinical_reasoning_elbow-3.1.0.js clinical_reasoning_wrist-3.1.0.js
          git diff --cached --quiet && exit 0
          git commit -m 'Harden upper-limb motors for noisy HMA language'
          git push origin HEAD:audit/clinical-upper-limb-chaos-noisy-hma
