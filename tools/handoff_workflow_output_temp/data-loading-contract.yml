name: Data Loading Contract

on:
  pull_request:
    branches: [main]
    paths:
      - 'index.html'
      - 'src/core/kinesys_data_cache-1.0.0.js'
      - 'src/patient/patient_index_cache_core-1.0.0.js'
      - 'src/patient/patient_chart_read_core-1.0.0.js'
      - 'src/patient/patient_pre_registration_core-1.0.0.js'
      - 'src/patient/patient_records_browse_core-1.0.0.js'
      - 'src/core/script-1.18.0.js'
      - 'src/core/midias_core-1.0.0.js'
      - 'src/agenda/agenda-1.20.0.js'
      - 'src/finance/financeiro-1.19.0.js'
      - 'src/core/design_system-1.20.1.js'
      - 'src/home/home_detalhes-1.18.5.js'
      - 'tests/data_cache.contract.js'
      - 'tests/data_cache_integration.contract.js'
      - 'tests/patient_index_cache_modularization.contract.js'
      - 'tests/patient_chart_read_modularization.contract.js'
      - 'tests/patient_pre_registration_modularization.contract.js'
      - 'tests/patient_records_browse_modularization.contract.js'
      - 'tests/agenda_cache.contract.js'
      - 'tests/agenda_aux_cache.contract.js'
      - 'tests/data_loading.contract.js'
      - 'tests/operational_data_loading.contract.js'
      - '.github/workflows/data-loading-contract.yml'
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'src/core/kinesys_data_cache-1.0.0.js'
      - 'src/patient/patient_index_cache_core-1.0.0.js'
      - 'src/patient/patient_chart_read_core-1.0.0.js'
      - 'src/patient/patient_pre_registration_core-1.0.0.js'
      - 'src/patient/patient_records_browse_core-1.0.0.js'
      - 'src/core/script-1.18.0.js'
      - 'src/core/midias_core-1.0.0.js'
      - 'src/agenda/agenda-1.20.0.js'
      - 'src/finance/financeiro-1.19.0.js'
      - 'src/core/design_system-1.20.1.js'
      - 'src/home/home_detalhes-1.18.5.js'
      - 'tests/data_cache.contract.js'
      - 'tests/data_cache_integration.contract.js'
      - 'tests/patient_index_cache_modularization.contract.js'
      - 'tests/patient_chart_read_modularization.contract.js'
      - 'tests/patient_pre_registration_modularization.contract.js'
      - 'tests/patient_records_browse_modularization.contract.js'
      - 'tests/agenda_cache.contract.js'
      - 'tests/agenda_aux_cache.contract.js'
      - 'tests/data_loading.contract.js'
      - 'tests/operational_data_loading.contract.js'
      - '.github/workflows/data-loading-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    name: On-demand data + scoped cache contract
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: JavaScript syntax
        run: |
          node --check src/core/kinesys_data_cache-1.0.0.js
          node --check src/patient/patient_index_cache_core-1.0.0.js
          node --check src/patient/patient_chart_read_core-1.0.0.js
          node --check src/patient/patient_pre_registration_core-1.0.0.js
          node --check src/patient/patient_records_browse_core-1.0.0.js
          node --check src/core/script-1.18.0.js
          node --check src/core/midias_core-1.0.0.js
          node --check src/agenda/agenda-1.20.0.js
          node --check src/finance/financeiro-1.19.0.js
          node --check tests/data_cache.contract.js
          node --check tests/data_cache_integration.contract.js
          node --check tests/patient_index_cache_modularization.contract.js
          node --check tests/patient_chart_read_modularization.contract.js
          node --check tests/patient_pre_registration_modularization.contract.js
          node --check tests/patient_records_browse_modularization.contract.js
          node --check tests/agenda_cache.contract.js
          node --check tests/agenda_aux_cache.contract.js
          node --check tests/data_loading.contract.js
          node --check tests/operational_data_loading.contract.js
      - name: Data cache behavior contract
        run: node tests/data_cache.contract.js
      - name: Patient index cache integration contract
        run: node tests/data_cache_integration.contract.js
      - name: Patient index cache modularization contract
        run: node tests/patient_index_cache_modularization.contract.js
      - name: Patient chart read modularization contract
        run: node tests/patient_chart_read_modularization.contract.js
      - name: Patient pre-registration modularization contract
        run: node tests/patient_pre_registration_modularization.contract.js
      - name: Patient records browse modularization contract
        run: node tests/patient_records_browse_modularization.contract.js
      - name: Agenda week cache integration contract
        run: node tests/agenda_cache.contract.js
      - name: Agenda auxiliary cache integration contract
        run: node tests/agenda_aux_cache.contract.js
      - name: Core patient data loading contract
        run: node tests/data_loading.contract.js
      - name: Operational patient data loading contract
        run: node tests/operational_data_loading.contract.js
