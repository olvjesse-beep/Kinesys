name: Impeccable detailed visual audit

on:
  push:
    paths:
      - '.github/workflows/impeccable-detail-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: 'C:\PROGRA~1\Git\bin\bash.exe --noprofile --norc -eo pipefail {0}'

jobs:
  audit:
    runs-on: [self-hosted, Windows, X64]
    steps:
      - uses: actions/checkout@v4      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Measure KineSys visual findings
        shell: 'C:\PROGRA~1\Git\bin\bash.exe --noprofile --norc -eo pipefail {0}'
        run: |
          set -uo pipefail
          chmod +x .agents/skills/impeccable/scripts/impeccable || true
          set +e
          .agents/skills/impeccable/scripts/impeccable detect --json \
            index.html \
            styles/design_tokens.css \
            styles/design_components.css \
            styles/design_responsive.css \
            styles/design_screens.css \
            styles/avaliacao_experiencia-1.22.0.css \
            > .impeccable-detail.json 2>.impeccable-detail.err
          code=$?
          set -e
          echo "DETECTOR_EXIT=$code"
          python - <<'PY'
          import json
          from collections import Counter
          from pathlib import Path

          data = json.loads(Path('.impeccable-detail.json').read_text(encoding='utf-8') or '[]')
          categories = Counter((item.get('antipattern') or item.get('name') or 'unknown') for item in data)
          print(f'FINDING_COUNT={len(data)}')
          print('CATEGORIES_BEGIN')
          for key, value in categories.most_common():
              print(f'{key}={value}')
          print('CATEGORIES_END')
          print('FINDINGS_BEGIN')
          for i, item in enumerate(data, 1):
              print(f'{i:03d}=' + json.dumps(item, ensure_ascii=False, separators=(',',':')))
          print('FINDINGS_END')
          PY
          if [ -s .impeccable-detail.err ]; then cat .impeccable-detail.err; fi
          exit 0
