      - 'tests/ui_experience_lifecycle.contract.js'
      - 'tests/operational_data_loading.contract.js'
      - '.github/workflows/screen-loader-contract.yml'
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'src/ui/screen_loader-1.25.0.js'
      - 'src/clinical/clinical_region_loader-1.0.0.js'
      - 'src/core/script-1.18.0.js'
      - 'src/ui/menu_dropdown-1.0.0.js'
      - 'src/core/operation_guard-1.0.0.js'
      - 'src/core/html_escape-1.0.0.js'
      - 'src/core/cadastro_validacoes_core-1.0.0.js'
