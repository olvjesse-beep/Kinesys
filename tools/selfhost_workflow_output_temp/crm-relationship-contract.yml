name: CRM Relationship Contract

on:
  pull_request:
    branches: [main]
    paths:
      - 'index.html'
      - 'src/core/script-1.18.0.js'
      - 'src/core/crm_relationship_core-1.0.0.js'
      - 'tests/crm_relationship_modularization.contract.js'
      - 'tests/data_loading.contract.js'
      - '.github/workflows/crm-relationship-contract.yml'
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'src/core/script-1.18.0.js'
      - 'src/core/crm_relationship_core-1.0.0.js'
      - 'tests/crm_relationship_modularization.contract.js'
      - 'tests/data_loading.contract.js'
      - '.github/workflows/crm-relationship-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: 'C:\PROGRA~1\Git\bin\bash.exe --noprofile --norc -eo pipefail {0}'

jobs:
  contract:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: JavaScript syntax
        run: |
          node --check src/core/crm_relationship_core-1.0.0.js
          node --check src/core/script-1.18.0.js
          node --check tests/crm_relationship_modularization.contract.js
          node --check tests/data_loading.contract.js
      - name: CRM relationship modularization contract
        run: node tests/crm_relationship_modularization.contract.js
      - name: Data loading compatibility contract
        run: node tests/data_loading.contract.js
